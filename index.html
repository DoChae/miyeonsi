<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>봄, 프레임 밖에서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =============================================================
 *  봄, 프레임 밖에서 — UI
 * ============================================================= */
:root {
  --ink: #121626;
  --ink-2: #1c2136;
  --paper: #f7f2eb;
  --paper-dim: #d9d3cb;
  --blush: #eaa79f;
  --blush-2: #f6d2c8;
  --lilac: #b8a4e6;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --char-base: 90vh;
  --tb-alpha: .84;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --ease: cubic-bezier(.22, .8, .24, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0a0c14;
  color: var(--paper);
  font-family: var(--font);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }
#app { position: fixed; inset: 0; overflow: hidden; }

.screen {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .7s ease, visibility 0s linear .7s;
}
.screen.active { opacity: 1; visibility: visible; transition: opacity .7s ease; }

/* ============================ TITLE ============================ */
#title { overflow: hidden; }
.title-bg {
  position: absolute; inset: -4%;
  background:
    radial-gradient(80% 60% at 78% 18%, rgba(255, 230, 214, .55), transparent 60%),
    radial-gradient(70% 50% at 12% 88%, rgba(184, 164, 230, .35), transparent 65%),
    linear-gradient(172deg, #232946 0%, #4b4b72 34%, #a77f92 66%, #eeb3a4 88%, #f8dac8 100%);
  background-size: cover; background-position: center;
  animation: kenburns 28s ease-in-out infinite alternate;
}
.title-shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10, 12, 22, .1) 0%, rgba(10, 12, 22, .0) 40%, rgba(10, 12, 22, .55) 100%);
}
@keyframes kenburns { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1.2%, -1%); } }

.petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.petals i {
  position: absolute; top: -20px;
  background: radial-gradient(circle at 30% 30%, #fff 0%, #fde3e0 45%, #f3b7b2 100%);
  border-radius: 80% 0 80% 0;
  animation-name: fall, sway;
  animation-timing-function: linear, ease-in-out;
  animation-iteration-count: infinite, infinite;
  animation-direction: normal, alternate;
}
@keyframes fall { to { top: 105%; transform: rotate(540deg); } }
@keyframes sway { from { margin-left: -24px; } to { margin-left: 28px; } }

.vf {
  position: absolute; pointer-events: none;
  top: calc(18px + var(--safe-t)); bottom: calc(18px + var(--safe-b));
  left: calc(18px + var(--safe-l)); right: calc(18px + var(--safe-r));
}
.vf i { position: absolute; width: 30px; height: 30px; border: 0 solid rgba(255, 255, 255, .78); }
.vf .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
.vf .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
.vf .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
.vf .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.vf .rec, .vf .tc, .vf .iso {
  position: absolute; font: 600 11px/1 ui-monospace, 'SF Mono', Menlo, monospace;
  letter-spacing: .14em; color: rgba(255, 255, 255, .86);
}
.vf .rec { top: 14px; left: 44px; display: flex; align-items: center; gap: 7px; }
.vf .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; animation: blink 1.2s steps(2, start) infinite; }
.vf .tc { top: 14px; right: 44px; }
.vf .iso { bottom: 14px; right: 44px; opacity: .7; }
@keyframes blink { to { visibility: hidden; } }

.title-inner {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(620px, 86vw);
  text-align: center;
}
.title-kicker {
  font-size: 12px; letter-spacing: .5em; font-weight: 600;
  color: rgba(255, 255, 255, .78); margin-bottom: 18px;
  animation: rise 1.2s var(--ease) both .2s;
}
.title-logo {
  font-family: var(--serif); font-weight: 700; line-height: 1.05;
  display: flex; flex-direction: column; align-items: center;
  text-shadow: 0 6px 40px rgba(30, 20, 50, .45);
}
.title-logo .l1 { font-size: clamp(30px, 4.6vw, 48px); color: var(--blush-2); font-weight: 400; animation: rise 1.2s var(--ease) both .35s; }
.title-logo .l2 { font-size: clamp(44px, 8vw, 92px); letter-spacing: -.02em; animation: rise 1.4s var(--ease) both .5s; }
.title-en {
  margin-top: 14px; font-size: 11px; letter-spacing: .62em;
  color: rgba(255, 255, 255, .62); animation: rise 1.2s var(--ease) both .7s;
}
.title-menu {
  margin: clamp(34px, 7vh, 64px) auto 0; display: flex; flex-direction: column;
  align-items: center; gap: 4px; animation: rise 1.2s var(--ease) both .9s;
}
.title-menu button {
  position: relative; padding: 11px 26px;
  font-size: 14px; font-weight: 600; letter-spacing: .32em; text-indent: .32em;
  color: rgba(255, 255, 255, .88);
  transition: color .3s, letter-spacing .4s var(--ease);
}
.title-menu button::before, .title-menu button::after {
  content: ''; position: absolute; top: 50%; width: 0; height: 1px;
  background: var(--blush-2); transition: width .4s var(--ease);
}
.title-menu button::before { right: 100%; }
.title-menu button::after { left: 100%; }
.title-menu button:hover:not(:disabled) { color: #fff; letter-spacing: .4em; }
.title-menu button:hover:not(:disabled)::before, .title-menu button:hover:not(:disabled)::after { width: 28px; }
.title-menu button:disabled { opacity: .32; cursor: default; }
.title-foot {
  position: absolute; left: 0; right: 0; bottom: calc(40px + var(--safe-b));
  text-align: center; font-size: 11px; color: rgba(255, 255, 255, .55); letter-spacing: .02em; padding: 0 40px;
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

/* ============================ STAGE ============================ */
#game { background: #000; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0; transition: opacity 1s ease;
}
.bg.show { opacity: 1; }
.bg.instant { transition: none; }
.bg-label {
  position: absolute; right: calc(22px + var(--safe-r)); top: calc(22px + var(--safe-t));
  text-align: right; pointer-events: none; max-width: 60%;
}
.bg-label b {
  display: block; font-family: var(--serif); font-size: clamp(15px, 1.6vw, 20px);
  color: rgba(255, 255, 255, .62); letter-spacing: .04em; font-weight: 700;
  text-shadow: 0 1px 8px rgba(0, 0, 0, .25);
}
.bg-label span {
  display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px;
  font: 10px ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, .7);
  border: 1px dashed rgba(255, 255, 255, .4);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(5, 6, 14, .45) 100%);
}

/* ---------- characters ---------- */
#chars { position: absolute; inset: 0; pointer-events: none; }
.char {
  position: absolute;
  bottom: var(--by, 0px);
  left: var(--x, 50%);
  height: var(--h, var(--char-base));
  transform: translateX(-50%) translate(var(--ex, 0px), var(--ey, 0px));
  z-index: 2;
  transition:
    left .7s var(--ease),
    transform .6s var(--ease),
    opacity .55s ease,
    filter .4s ease;
  filter: drop-shadow(0 14px 34px rgba(0, 0, 0, .22));
}
.char.enter, .char.leave { opacity: 0; }
.char.speaking { z-index: 4; }
.char.dim { filter: brightness(.56) saturate(.72) drop-shadow(0 14px 34px rgba(0, 0, 0, .18)); }
.char .bob { height: 100%; }
.char .bob.hop { animation: hop .42s var(--ease); }
.char .inner {
  position: relative; height: 100%;
  transform: translateX(var(--lean, 0px)) scaleX(var(--flip, 1));
  transition: transform .5s var(--ease);
}
.char .face { display: block; height: 100%; width: auto; max-width: none; pointer-events: none; }
.char .face.incoming { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .28s ease; }
.char .face.incoming.in { opacity: 1; }
#chars.instant .char, #chars.instant .char .inner { transition: none !important; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-3.2%); } 65% { transform: translateY(.4%); } }

#stage.shake { animation: shake .45s; }
@keyframes shake {
  0%, 100% { transform: none; } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); }
  60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, -1px); }
}

/* ---------- place banner ---------- */
#place {
  position: absolute; z-index: 15;
  top: calc(20px + var(--safe-t)); left: calc(20px + var(--safe-l));
  padding: 10px 18px 10px 16px;
  border-left: 3px solid var(--blush);
  background: linear-gradient(90deg, rgba(14, 17, 30, .72), rgba(14, 17, 30, .28));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 0 10px 10px 0;
  opacity: 0; transform: translateX(-14px);
  transition: opacity .6s ease, transform .6s var(--ease);
  pointer-events: none;
}
#place.on { opacity: 1; transform: none; }
#place b { display: block; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
#place span { display: block; margin-top: 3px; font: 500 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: rgba(255, 255, 255, .7); }

/* ============================ TEXTBOX ============================ */
#textbox {
  --c: var(--blush);
  position: absolute; z-index: 20;
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  width: min(1120px, calc(100% - 32px - var(--safe-l) - var(--safe-r)));
  min-height: clamp(150px, 25vh, 214px);
  padding: 34px 40px 26px;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(26, 30, 50, calc(var(--tb-alpha) * .9)), rgba(14, 16, 28, var(--tb-alpha)));
  backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .07);
  transition: opacity .35s ease, transform .35s var(--ease);
  cursor: pointer;
}
#textbox::before {
  content: ''; position: absolute; left: 24px; right: 24px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c), transparent);
  opacity: .7;
}
#nameplate {
  position: absolute; top: -19px; left: 28px;
  padding: 8px 22px 8px 18px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-weight: 800; font-size: 15px; letter-spacing: .08em;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .25), inset 4px 0 0 var(--c);
  transition: opacity .25s, transform .25s var(--ease);
}
#textbox.narr #nameplate { opacity: 0; transform: translateY(6px); }
#textbox.msg #nameplate { background: #fff7d6; }
#textbox.msg #nameplate span::before { content: '✉ '; }
#text {
  font-size: clamp(15.5px, .9vw + 9px, 20px);
  line-height: 1.82;
  letter-spacing: -.005em;
  white-space: pre-line;
  color: var(--paper);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
}
#text .rest { visibility: hidden; }
#textbox.narr #text { color: #ddd6e6; }
#textbox.whisper #text { font-size: .94em; color: #c9c2d6; font-style: italic; }
#textbox.msg #text { color: #fff4cf; }
#next {
  position: absolute; right: 30px; bottom: 20px;
  width: 10px; height: 10px; opacity: 0;
  border-right: 2px solid var(--c); border-bottom: 2px solid var(--c);
  transform: rotate(45deg);
  transition: opacity .2s;
}
#next.on { opacity: 1; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: rotate(45deg) translate(3px, 3px); } }

#quick {
  position: absolute; top: 9px; right: 18px;
  display: flex; gap: 2px;
}
#quick button {
  padding: 5px 8px; border-radius: 6px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  color: rgba(255, 255, 255, .48);
  transition: color .2s, background .2s;
}
#quick button:hover { color: #fff; background: rgba(255, 255, 255, .06); }
#quick button.active { color: var(--ink); background: var(--blush-2); }
#game.skipping #quick [data-q="skip"] { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

#game.ui-hidden #textbox, #game.ui-hidden #place { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); }
#game.ui-hidden #place { transform: none; }

/* ============================ OVERLAYS ============================ */
.overlay {
  position: absolute; inset: 0; z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity .5s ease, visibility 0s linear .5s;
}
.overlay.on { opacity: 1; visibility: visible; transition: opacity .5s ease; }

/* ---------- choices ---------- */
#choices {
  background: radial-gradient(70% 60% at 50% 45%, rgba(10, 12, 22, .35), rgba(10, 12, 22, .62));
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  padding: 20px 20px calc(clamp(150px, 25vh, 214px) + 40px);
}
.choice-prompt {
  font-family: var(--serif); font-size: clamp(16px, 1.4vw + 6px, 21px);
  color: #fff; margin-bottom: 20px; text-align: center;
  text-shadow: 0 2px 16px rgba(0, 0, 0, .5);
  max-width: 640px;
}
.choice-prompt:empty { display: none; }
.choice-list { width: min(580px, 100%); display: flex; flex-direction: column; gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 16px;
  width: 100%; padding: 16px 22px;
  text-align: left; font-size: clamp(15px, .6vw + 11px, 17px); font-weight: 600; line-height: 1.45;
  color: var(--ink);
  background: rgba(250, 246, 240, .94);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .6);
  opacity: 0; transform: translateY(12px);
  animation: choiceIn .5s var(--ease) forwards;
  transition: transform .25s var(--ease), background .25s, box-shadow .25s;
}
.choice em {
  flex: 0 0 auto; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
  color: #c2756c; padding: 6px 7px; border-radius: 6px; background: rgba(234, 167, 159, .18);
}
@media (hover: hover) {
  .choice:hover { transform: translateX(6px); background: #fff; box-shadow: 0 14px 34px rgba(0, 0, 0, .32), inset 4px 0 0 var(--blush); }
}
.choice:active { transform: scale(.985); }
@keyframes choiceIn { to { opacity: 1; transform: none; } }

/* ---------- chapter card ---------- */
#card { background: #07080e; z-index: 50; text-align: center; padding: 30px; cursor: pointer; }
.card-line { width: 1px; height: 0; background: var(--blush); margin-bottom: 24px; transition: height 1.2s var(--ease) .2s; }
#card.on .card-line { height: 56px; }
.card-kicker { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .5em; color: var(--blush); }
.card-title { font-family: var(--serif); font-size: clamp(30px, 5vw, 52px); margin: 18px 0 14px; letter-spacing: .02em; }
.card-sub { font-size: 14px; color: rgba(255, 255, 255, .6); letter-spacing: .08em; }
#card > * { opacity: 0; transform: translateY(10px); transition: opacity 1s ease, transform 1s var(--ease); }
#card.on > * { opacity: 1; transform: none; }
#card.on .card-kicker { transition-delay: .35s; }
#card.on .card-title { transition-delay: .55s; }
#card.on .card-sub { transition-delay: .8s; }

/* ---------- endcard ---------- */
#endcard { background: rgba(7, 8, 14, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 45; padding: 20px; }
.ec-panel { width: min(520px, 100%); text-align: center; }
.ec-kicker { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .4em; color: var(--blush); }
.ec-title { font-family: var(--serif); font-size: clamp(30px, 5vw, 44px); margin: 16px 0 18px; }
.ec-text { font-family: var(--serif); font-size: 16px; line-height: 1.8; color: rgba(255, 255, 255, .86); white-space: pre-line; }
.ec-stats { margin: 30px 0 22px; display: grid; gap: 14px; text-align: left; }
.ec-next { font-size: 12px; letter-spacing: .06em; color: rgba(255, 255, 255, .5); margin-bottom: 26px; }
.ec-btn {
  padding: 13px 34px; border-radius: 999px; font-weight: 700; letter-spacing: .2em;
  background: var(--paper); color: var(--ink);
  transition: transform .2s var(--ease), box-shadow .2s;
}
.ec-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, .35); }

.stat { --c: var(--blush); padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stat-top b { font-size: 15px; }
.stat-top span { font-size: 12px; color: var(--c); font-weight: 600; }
.stat .bar { height: 6px; margin: 10px 0 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); transition: width 1s var(--ease); }
.stat small { font-size: 11px; color: rgba(255, 255, 255, .5); }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .48s ease; z-index: 60; }
#fade.on { opacity: 1; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 59; }
#flash.on { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

/* ---------- toasts ---------- */
#toasts {
  position: absolute; z-index: 90; pointer-events: none;
  top: calc(20px + var(--safe-t)); right: calc(20px + var(--safe-r));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.toast {
  --c: var(--blush);
  padding: 9px 16px 9px 12px; border-radius: 999px;
  background: rgba(14, 17, 30, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, .1);
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  animation: toastIn .45s var(--ease);
  transition: opacity .5s, transform .5s;
}
.toast i { font-style: normal; color: var(--c); font-size: 14px; }
.toast small { font-weight: 400; color: rgba(255, 255, 255, .7); font-size: 12px; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateX(16px); } }

/* ============================ MODAL ============================ */
.modal {
  position: absolute; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background: rgba(6, 7, 12, .6);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s;
}
.modal.on { opacity: 1; visibility: visible; transition: opacity .3s; }
.modal-panel {
  width: min(760px, 100%); max-height: 100%;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1e2338, #141828);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  transform: translateY(14px) scale(.98); transition: transform .35s var(--ease);
}
.modal.on .modal-panel { transform: none; }
.modal-panel header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
.modal-panel h3 { font: 700 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .4em; color: var(--blush-2); }
.modal-panel .x { width: 34px; height: 34px; border-radius: 50%; color: rgba(255, 255, 255, .6); transition: background .2s; }
.modal-panel .x:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.modal-body { padding: 18px 24px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }

.modal.log .modal-panel { height: 86vh; }
.log-line { --c: transparent; padding: 12px 0 12px 14px; border-left: 2px solid var(--c); margin-bottom: 4px; }
.log-line b { display: block; font-size: 12px; letter-spacing: .1em; color: var(--c); margin-bottom: 4px; }

.log-choice { margin: 10px 0 14px; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--blush-2); display: inline-block; }

/* slots */
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.slot {
  display: flex; gap: 12px; padding: 10px; border-radius: 14px; text-align: left;

}
.slot:hover { background: rgba(255, 255, 255, .08); border-color: rgba(234, 167, 159, .5); transform: translateY(-1px); }
.slot.empty { opacity: .62; }
.slot-thumb {
  flex: 0 0 104px; height: 64px; border-radius: 9px; position: relative; overflow: hidden;
  background-color: #2a2f45; background-size: cover; background-position: center;
}
.slot-thumb span {
  position: absolute; left: 6px; top: 6px; padding: 3px 6px; border-radius: 5px;

<script>/* ==== js/engine.js ==== */
/* =============================================================
 *  VN ENGINE
 *  스토리 내용은 하나도 들어 있지 않은 범용 엔진입니다.
 *  스토리는 js/story/*.js 에서 VN.label(이름, [명령...]) 으로 등록합니다.
 * ============================================================= */
(function () {
  'use strict';

  const CFG = window.GAME_CONFIG;
  const CHARS = window.CHARACTERS;
  const BGS = window.BACKGROUNDS;
  const POS = window.POSITIONS;
  const FACE_LABEL = window.FACE_LABELS || {};

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BLOCK = 'BLOCK';
  const JUMPED = 'JUMPED';

  /* ===========================================================
   *  1. 스토리 등록 & 컴파일
   *  when()/choice()의 중첩 블록을 하위 라벨로 펼쳐서
   *  세이브 데이터가 "라벨 + 인덱스"만으로 위치를 기억할 수 있게 함
   * =========================================================== */
  const LABELS = {};

  function compile(name, list) {
    if (!Array.isArray(list)) throw new Error(`[${name}] 명령 목록은 배열이어야 합니다`);
    return list.map((c, i) => {
      if (!c || typeof c !== 'object') throw new Error(`[${name}] ${i}번째 명령이 비어 있어요 (쉼표를 확인하세요)`);
      if ('if' in c) {
        const t = `${name}/${i}/then`;
        defineLabel(t, [...(c.then || []), { ret: true }]);
        let e = null;
        if (c.else && c.else.length) {
          e = `${name}/${i}/else`;
          defineLabel(e, [...c.else, { ret: true }]);
        }
        return { type: 'if', cond: c.if, t, e };
      }
      if (c.type === 'choice') {
        return {
          ...c,
          choice: c.choice.map((o, k) => {
            const opt = { ...o, sub: null };
            if (o.then && o.then.length) {
              opt.sub = `${name}/${i}/opt${k}`;
              defineLabel(opt.sub, [...o.then, o.jump ? { type: 'jump', to: o.jump } : { ret: true }]);
              opt.jump = null;
            }
            delete opt.then;
            return opt;
          }),
        };
      }
      return c;
    });
  }

  function defineLabel(name, list) {
    if (LABELS[name]) console.warn(`[VN] 라벨 "${name}"이(가) 다시 정의되었습니다`);
    LABELS[name] = compile(name, list);
  }

  /* ===========================================================
   *  2. 스토리 작성용 DSL
   * =========================================================== */
  const dsl = {
    /** 대사. face는 null이면 표정 유지. opts: {hop, whisper, msg, as} */
    say: (who, face, text, opts = {}) => ({ type: 'say', who, face, text, ...opts }),
    /** 내레이션 */
    narr: (text, opts = {}) => ({ type: 'say', who: null, text, ...opts }),
    /** 등장. opts: {from:'left'|'right', look:'left'|'right'|'front'} */
    show: (who, pos = 'center', face = 'normal', opts = {}) => ({ type: 'show', who, pos, face, ...opts }),
    hide: (who) => ({ type: 'hide', who }),
    hideAll: () => ({ type: 'hideAll' }),
    move: (who, pos) => ({ type: 'move', who, pos }),
    face: (who, face) => ({ type: 'face', who, face }),
    look: (who, dir) => ({ type: 'look', who, dir }),
    /** 배경 전환. fade: 'cross' | 'black' | 'none'.  black은 기본적으로 인물도 정리 (opts.keep으로 유지) */
    bg: (id, fade = 'cross', opts = {}) => ({ type: 'bg', id, fade, ...opts }),
    place: (where, when) => ({ type: 'place', where, when }),
    chapter: (kicker, title, sub) => ({ type: 'chapter', kicker, title, sub }),
    /** 선택지. options: [{text, aff, set, then, jump, if}] */
    choice: (prompt, options) => ({ type: 'choice', prompt, choice: options }),
    /** 조건 분기 */
    when: (cond, then, otherwise) => ({ if: cond, then, else: otherwise }),
    aff: (o) => ({ type: 'aff', o }),
    set: (o) => ({ type: 'set', o }),
    jump: (to) => ({ type: 'jump', to }),
    wait: (ms) => ({ type: 'wait', ms }),
    fx: (name, who) => ({ type: 'fx', name, who }),
    endcard: (o) => ({ type: 'endcard', ...o }),
    call: (fn) => ({ type: 'call', fn }),
  };

  /* ===========================================================
   *  3. 저장소 & 설정
   * =========================================================== */
  const KEY = CFG.saveKey || 'vn';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(`${KEY}:${k}`)); } catch { return null; } },
    set(k, v) {
      try { localStorage.setItem(`${KEY}:${k}`, JSON.stringify(v)); return true; }
      catch { toast('저장 공간이 부족하거나 저장이 막혀 있어요'); return false; }
    },
  };

  const DEFAULT_SETTINGS = { textSpeed: 26, autoDelay: 1300, affToast: true, boxAlpha: 0.84 };
  let settings = { ...DEFAULT_SETTINGS, ...(store.get('settings') || {}) };

  function applySettings() {
    document.documentElement.style.setProperty('--tb-alpha', settings.boxAlpha);
    store.set('settings', settings);
  }

  /* ===========================================================
   *  4. 게임 상태
   * =========================================================== */
  function freshState() {
    const aff = {};
    Object.entries(CHARS).forEach(([id, c]) => { if (c.heroine) aff[id] = c.startAffection || 0; });
    return {
      label: CFG.startLabel, index: 0, stack: [],
      aff, flags: {}, bg: null, stage: {}, speaker: null,
      chapter: '', line: '', log: [],
    };
  }

  let S = freshState();
  let running = false, runId = 0;
  let waiting = null;            // 'say' | 'choice' | 'card' | 'end'
  let typing = null;
  let auto = false, skip = false;
  let autoTimer = 0, cardTimer = 0, placeTimer = 0;
  let modalOpen = false, uiHidden = false;
  let suppressLogOnce = false;

  const evalFn = (v) => (typeof v === 'function' ? v(S) : v);
  const isMobile = () => document.body.classList.contains('m');
  const skipping = () => skip;

  /* ===========================================================
   *  5. 실행 루프
   * =========================================================== */
  function popFrame() {
    const f = S.stack.pop();
    S.label = f.label; S.index = f.index;
  }

  function current() {
    for (;;) {
      const list = LABELS[S.label];
      if (!list) throw new Error(`라벨을 찾을 수 없어요: "${S.label}"`);
      if (S.index >= list.length) {
        if (S.stack.length) { popFrame(); continue; }
        return null;
      }
      const c = list[S.index];
      if (c.ret) {
        if (S.stack.length) popFrame(); else S.index++;
        continue;
      }
      return c;
    }
  }

  async function run() {
    if (running) return;
    running = true;
    const my = ++runId;
    try {
      for (let guard = 0; guard < 10000; guard++) {
        if (my !== runId) return;
        const cmd = current();
        if (!cmd) { endOfStory(); return; }
        const r = await exec(cmd);
        if (my !== runId) return;
        if (r === BLOCK) return;
        if (r !== JUMPED) S.index++;
      }
      throw new Error('명령이 너무 많이 연속 실행되었어요 (무한 반복 확인)');
    } catch (e) {
      console.error(e);
      toast(`⚠ ${esc(e.message)}`, '#ff8a80');
    } finally {
      if (my === runId) running = false;
    }
  }

  async function exec(c) {
    switch (c.type) {
      case 'say': return execSay(c);
      case 'show': {
        if (!CHARS[c.who]) { console.warn('[VN] 알 수 없는 캐릭터', c.who); return; }
        S.stage[c.who] = { pos: c.pos, face: c.face || 'normal', look: c.look || 'auto' };
        renderStage(skipping(), { [c.who]: c.from });
        return;
      }
      case 'hide': delete S.stage[c.who]; renderStage(skipping()); return;
      case 'hideAll': S.stage = {}; renderStage(skipping()); return;
      case 'move': if (S.stage[c.who]) { S.stage[c.who].pos = c.pos; renderStage(skipping()); } return;
      case 'face': if (S.stage[c.who]) { S.stage[c.who].face = c.face; renderStage(skipping()); } return;
      case 'look': if (S.stage[c.who]) { S.stage[c.who].look = c.dir; renderStage(skipping()); } return;
      case 'bg': await changeBg(c.id, c.fade, c); return;
      case 'place': showPlace(evalFn(c.where), evalFn(c.when)); return;
      case 'chapter': return showCard(c);
      case 'choice': return showChoice(c);
      case 'if': {
        const target = evalFn(c.cond) ? c.t : c.e;
        if (!target) return;
        S.stack.push({ label: S.label, index: S.index + 1 });
        S.label = target; S.index = 0;
        return JUMPED;
      }
      case 'aff': applyAff(c.o); return;
      case 'set': Object.assign(S.flags, clone(c.o)); return;
      case 'jump': S.stack = []; S.label = c.to; S.index = 0; return JUMPED;
      case 'wait': if (!skipping()) await sleep(c.ms); return;
      case 'fx': doFx(c.name, c.who); return;
      case 'call': c.fn(S, api); return;
      case 'endcard': return showEndcard(c);
      default: console.warn('[VN] 알 수 없는 명령', c); return;
    }
  }

  function endOfStory() {
    stopAll();
    showScreen('title');
  }

  /* ===========================================================
   *  6. 대사창 & 타이핑
   * =========================================================== */
  function execSay(c) {
    const text = String(evalFn(c.text) ?? '');
    const who = c.who || null;
    const ch = who ? CHARS[who] : null;
    if (who && c.face && S.stage[who]) S.stage[who].face = c.face;
    S.speaker = c.msg ? null : who;
    renderStage(skipping());
    if (c.hop && who && !skipping()) hop(who);

    const tb = $('#textbox');
    const name = c.as || (ch ? ch.name : who || '');
    tb.classList.toggle('narr', !who);
    tb.classList.toggle('whisper', !!c.whisper);
    tb.classList.toggle('msg', !!c.msg);
    tb.style.setProperty('--c', ch ? ch.color : '#e9a8a2');
    $('#nameplate span').textContent = name;

    S.line = text;
    if (suppressLogOnce) suppressLogOnce = false;
    else S.log.push({ name: who ? name : '', color: ch ? ch.color : '', text, whisper: !!c.whisper });
    if (S.log.length > 400) S.log.splice(0, S.log.length - 400);

    waiting = 'say';
    startTyping(text);
    return BLOCK;
  }

  function startTyping(text) {
    cancelTyping();
    $('#next').classList.remove('on');
    const shown = $('#text .shown'), rest = $('#text .rest');
    const speed = skipping() ? 0 : settings.textSpeed;
    if (!speed) { shown.textContent = text; rest.textContent = ''; onTyped(); return; }
    shown.textContent = ''; rest.textContent = text;
    const t0 = performance.now();
    let n0 = -1;
    typing = { text, raf: 0 };
    const tick = (now) => {
      if (!typing) return;
      const n = Math.min(text.length, Math.floor((now - t0) / speed) + 1);
      if (n !== n0) { n0 = n; shown.textContent = text.slice(0, n); rest.textContent = text.slice(n); }
      if (n >= text.length) { typing = null; onTyped(); }
      else typing.raf = requestAnimationFrame(tick);
    };
    typing.raf = requestAnimationFrame(tick);
  }

  function cancelTyping() {
    if (typing) cancelAnimationFrame(typing.raf);
    typing = null;
  }

  function finishTyping() {
    if (!typing) return;
    const t = typing.text;
    cancelTyping();
    $('#text .shown').textContent = t;
    $('#text .rest').textContent = '';
    onTyped();
  }

  function onTyped() {
    $('#next').classList.add('on');
    scheduleAuto();
  }

  function clearAuto() { clearTimeout(autoTimer); autoTimer = 0; }

  function scheduleAuto() {
    clearAuto();
    if (waiting !== 'say' || typing || modalOpen) return;
    const go = () => { if (waiting === 'say' && !typing && !modalOpen) next(); };
    if (skip) autoTimer = setTimeout(go, 45);
    else if (auto) autoTimer = setTimeout(go, settings.autoDelay + S.line.length * 38);
  }

  function next() {
    clearAuto();
    $('#next').classList.remove('on');
    waiting = null;
    S.index++;
    run();
  }

  function advance() {
    if (modalOpen) return;
    if (uiHidden) { setHidden(false); return; }
    if (waiting === 'say') {
      if (typing) finishTyping(); else next();
    } else if (waiting === 'card') closeCard();
  }

  /* ===========================================================
   *  7. 캐릭터 렌더링
   * =========================================================== */
  const probeCache = {};
  function probe(url) {
    if (!probeCache[url]) {
      probeCache[url] = new Promise((res) => {
        const img = new Image();
        img.onload = () => res(true);
        img.onerror = () => res(false);
        img.src = url;
      });
    }
    return probeCache[url];
  }
  async function firstLoadable(list) {
    for (const u of list) if (await probe(u)) return u;
    return null;
  }

  const faceCache = {};
  function resolveFace(id, face) {
    const key = `${id}/${face}`;
    if (faceCache[key]) return faceCache[key];
    const c = CHARS[id];
    const dir = c.folder || `assets/characters/${id}`;
    const exts = CFG.imageFormats || ['png'];
    const list = exts.map((x) => `${dir}/${face}.${x}`);
    if (face !== 'normal') exts.forEach((x) => list.push(`${dir}/normal.${x}`));
    faceCache[key] = firstLoadable(list).then((u) => u || placeholderChar(id, face));
    return faceCache[key];
  }

  function placeholderChar(id, face) {
    const c = CHARS[id];
    const col = c.color || '#aaaaaa';
    const hair = (c.placeholder && c.placeholder.hair) || 'bob';
    const dir = c.folder || `assets/characters/${id}`;
    const hairPath = {
      long: 'M152 220 C150 120 200 88 250 88 C300 88 350 120 348 220 L362 470 C340 452 318 446 300 446 L300 300 L200 300 L200 446 C182 446 160 452 138 470 Z',
      straight: 'M156 215 C152 118 200 86 250 86 C300 86 348 118 344 215 L350 420 L306 412 L300 300 L200 300 L194 412 L150 420 Z',
      bob: 'M150 225 C146 120 198 86 250 86 C302 86 354 120 350 225 L352 318 L318 322 L310 270 L190 270 L182 322 L148 318 Z',
    }[hair];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1000" width="500" height="1000">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".92"/><stop offset=".75" stop-color="${col}" stop-opacity=".55"/><stop offset="1" stop-color="${col}" stop-opacity=".25"/></linearGradient>
<linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<path d="${hairPath}" fill="${col}" opacity=".55"/>
<path d="M70 1000 C70 640 100 455 178 410 C206 394 228 388 250 388 C272 388 294 394 322 410 C400 455 430 640 430 1000 Z" fill="url(#g)"/>
<path d="M218 310 L282 310 L290 396 L210 396 Z" fill="url(#g)"/>
<ellipse cx="250" cy="215" rx="88" ry="106" fill="url(#g)"/>
<ellipse cx="226" cy="178" rx="44" ry="56" fill="url(#h)"/>
<rect x="140" y="520" width="220" height="132" rx="22" fill="rgba(16,19,32,.55)"/>
<text x="250" y="576" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#fff">${esc(c.name)}</text>
<text x="250" y="626" text-anchor="middle" font-family="sans-serif" font-size="26" fill="rgba(255,255,255,.82)">${esc(FACE_LABEL[face] || face)} · ${esc(face)}</text>
<text x="250" y="972" text-anchor="middle" font-family="monospace" font-size="17" fill="rgba(255,255,255,.75)">${esc(dir)}/${esc(face)}.png</text>
</svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function posX(pos) {
    const p = POS[pos] || POS.center;
    return isMobile() ? (p.mx ?? p.x) : p.x;
  }

  function lookOf(id) {
    const e = S.stage[id];
    if (e.look && e.look !== 'auto') return e.look;
    const others = Object.keys(S.stage).filter((k) => k !== id && CHARS[k] && !CHARS[k].noSprite);
    if (!others.length) return 'front';
    const me = posX(e.pos);
    const avg = others.reduce((a, k) => a + posX(S.stage[k].pos), 0) / others.length;
    if (Math.abs(avg - me) < 1) return 'front';
    return avg > me ? 'right' : 'left';
  }

  function layoutFor(id, e) {
    const c = CHARS[id];
    const base = { scale: c.scale ?? 1, offsetX: c.offsetX ?? 0, offsetY: c.offsetY ?? 0 };
    const m = isMobile() ? (c.mobile || {}) : {};
    const f = (c.faceAdjust && c.faceAdjust[e.face]) || {};
    return { ...base, ...m, ...f };
  }

  function charEl(id) {
    return $(`#chars .char[data-id="${id}"]:not(.leave)`);
  }

  function createChar(id) {
    const el = document.createElement('div');
    el.className = 'char';
    el.dataset.id = id;
    el.innerHTML = '<div class="bob"><div class="inner"></div></div>';
    return el;
  }

  function applyLayout(el, id, e) {
    const c = CHARS[id];
    const L = layoutFor(id, e);
    el.style.setProperty('--x', `${posX(e.pos) + L.offsetX}%`);
    el.style.setProperty('--h', `calc(var(--char-base) * ${L.scale})`);
    el.style.setProperty('--by', `calc(var(--char-base) * ${L.scale * -L.offsetY / 100})`);
    const dir = lookOf(id);
    const canFlip = c.allowFlip !== false && c.lookDir && c.lookDir !== 'front';
    const flip = canFlip && dir !== 'front' && dir !== c.lookDir ? -1 : 1;
    const lean = c.lean ?? 10;
    const inner = $('.inner', el);
    inner.style.setProperty('--flip', flip);
    inner.style.setProperty('--lean', `${dir === 'right' ? lean : dir === 'left' ? -lean : 0}px`);
  }

  async function setFace(el, id, face, instant) {
    const url = await resolveFace(id, face);
    if (!el.isConnected || el.dataset.src === url) return;
    el.dataset.src = url;
    const inner = $('.inner', el);
    const olds = $$('.face', inner);
    const img = document.createElement('img');
    img.className = 'face';
    img.alt = '';
    img.draggable = false;
    img.src = url;
    if (instant || !olds.length) {
      olds.forEach((o) => o.remove());
      inner.appendChild(img);
      return;
    }
    img.classList.add('incoming');
    inner.appendChild(img);
    try { await img.decode(); } catch { /* ignore */ }
    if (el.dataset.src !== url) { img.remove(); return; }
    requestAnimationFrame(() => img.classList.add('in'));
    setTimeout(() => {
      if (el.dataset.src !== url) return;
      olds.forEach((o) => o.remove());
      img.classList.remove('incoming', 'in');
    }, 300);
  }

  function renderStage(instant, enter = {}) {
    const layer = $('#chars');
    if (instant) layer.classList.add('instant');

    $$('.char', layer).forEach((el) => {
      if (!S.stage[el.dataset.id] && !el.classList.contains('leave')) {
        el.classList.add('leave');
        setTimeout(() => el.remove(), instant ? 0 : 560);
      }
    });

    Object.keys(S.stage).forEach((id) => {
      const c = CHARS[id];
      if (!c || c.noSprite) return;
      const e = S.stage[id];
      let el = charEl(id);
      const isNew = !el;
      if (isNew) {
        el = createChar(id);
        layer.appendChild(el);
        if (!instant) {
          const from = enter[id];
          el.style.setProperty('--ex', from === 'left' ? '-9vw' : from === 'right' ? '9vw' : '0px');
          el.style.setProperty('--ey', from ? '0px' : '16px');
          el.classList.add('enter');
        }
      }
      applyLayout(el, id, e);
      setFace(el, id, e.face, instant || isNew);
      const speaking = S.speaker === id;
      el.classList.toggle('speaking', speaking);
      el.classList.toggle('dim', !!S.speaker && !speaking);
      if (isNew && !instant) {
        void el.offsetWidth;
        requestAnimationFrame(() => {
          el.classList.remove('enter');
          el.style.setProperty('--ex', '0px');
          el.style.setProperty('--ey', '0px');
        });
      }
    });

    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.remove('instant')));
  }

  function hop(id) {
    const el = charEl(id);
    if (!el) return;
    const b = $('.bob', el);
    b.classList.remove('hop');
    void b.offsetWidth;
    b.classList.add('hop');
  }

  function doFx(name, who) {
    if (skipping()) return;
    if (name === 'hop') return hop(who);
    if (name === 'shake') {
      const st = $('#stage');
      st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
    }
    if (name === 'flash') {
      const f = $('#flash');
      f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    }
  }

  /* ===========================================================
   *  8. 배경
   * =========================================================== */
  const bgCache = {};
  const bgResolved = {};
  function resolveBg(id) {
    if (bgCache[id]) return bgCache[id];
    const b = BGS[id] || {};
    const base = b.src ? b.src.replace(/\.[a-z0-9]+$/i, '') : `assets/bg/${id}`;
    const list = b.src ? [b.src] : [];
    (CFG.bgFormats || ['jpg']).forEach((x) => list.push(`${base}.${x}`));
    bgCache[id] = firstLoadable(list).then((u) => (bgResolved[id] = u || null));
    return bgCache[id];
  }

  function bgPlaceholderCss(id) {
    const b = BGS[id] || { ph: ['#333', '#111'] };
    const [a, z] = b.ph || ['#333', '#111'];
    return `radial-gradient(120% 80% at 80% 10%, rgba(255,255,255,.28), transparent 60%),
      radial-gradient(90% 60% at 10% 90%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(165deg, ${a}, ${z})`;
  }

  let bgFront = 'A';
  async function paintBg(id, instant) {
    const url = id ? await resolveBg(id) : null;
    const back = $(`#bg${bgFront === 'A' ? 'B' : 'A'}`);
    const front = $(`#bg${bgFront}`);
    const b = BGS[id] || {};
    back.style.backgroundImage = url ? `url("${url}")` : bgPlaceholderCss(id);
    back.style.backgroundPosition = b.focus || '50% 50%';
    $('.bg-label', back).innerHTML = url || !id ? '' :
      `<b>${esc(b.name || id)}</b><span>assets/bg/${esc(id)}.jpg</span>`;
    if (instant) { back.classList.add('instant'); front.classList.add('instant'); }
    back.classList.add('show');
    front.classList.remove('show');
    bgFront = bgFront === 'A' ? 'B' : 'A';
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => {
      back.classList.remove('instant'); front.classList.remove('instant');
    }));
  }

  async function changeBg(id, fade, opts = {}) {
    S.bg = id;
    const fast = skipping();
    if (fade === 'black' && !fast) {
      const f = $('#fade');
      f.classList.add('on');
      await sleep(480);
      if (!opts.keep) { S.stage = {}; S.speaker = null; renderStage(true); }
      await paintBg(id, true);
      await sleep(120);
      f.classList.remove('on');
      await sleep(260);
    } else {
      if (fade === 'black' && !opts.keep) { S.stage = {}; S.speaker = null; renderStage(true); }
      await paintBg(id, fast || fade === 'none');
    }
  }

  /* ===========================================================
   *  9. 연출: 장소 표시, 챕터 카드, 선택지, 엔드카드, 토스트
   * =========================================================== */
  function showPlace(where, when) {
    const el = $('#place');
    $('b', el).textContent = where || '';
    $('span', el).textContent = when || '';
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
    clearTimeout(placeTimer);
    placeTimer = setTimeout(() => el.classList.remove('on'), skipping() ? 900 : 3800);
  }

  function showCard(c) {
    S.chapter = [c.kicker, c.title].filter(Boolean).join(' · ');
    const card = $('#card');
    $('.card-kicker', card).textContent = c.kicker || '';
    $('.card-title', card).textContent = c.title || '';
    $('.card-sub', card).textContent = c.sub || '';
    card.classList.add('on');
    waiting = 'card';
    suppressLogOnce = false;
    autosave();
    clearTimeout(cardTimer);
    cardTimer = setTimeout(closeCard, skip ? 300 : 3200);
    return BLOCK;
  }

  function closeCard() {
    if (waiting !== 'card') return;
    clearTimeout(cardTimer);
    $('#card').classList.remove('on');
    waiting = null;
    S.index++;
    run();
  }

  function showChoice(c) {
    setSkip(false);
    clearAuto();
    suppressLogOnce = false;
    const box = $('#choices');
    const list = $('.choice-list', box);
    $('.choice-prompt', box).textContent = c.prompt ? String(evalFn(c.prompt)) : '';
    list.innerHTML = '';
    const opts = c.choice.filter((o) => !o.if || evalFn(o.if));
    opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.style.animationDelay = `${120 + i * 80}ms`;
      const label = String(evalFn(o.text));
      b.innerHTML = `<em>${String(i + 1).padStart(2, '0')}</em><span>${esc(label)}</span>`;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); pick(o, label); });
      list.appendChild(b);
    });
    box.classList.add('on');
    waiting = 'choice';
    autosave();
    return BLOCK;
  }

  function pick(o, label) {
    if (waiting !== 'choice') return;
    $('#choices').classList.remove('on');
    waiting = null;
    S.log.push({ choice: true, text: label });
    if (o.aff) applyAff(o.aff);
    if (o.set) Object.assign(S.flags, clone(o.set));
    if (o.sub) {
      S.stack.push({ label: S.label, index: S.index + 1 });
      S.label = o.sub; S.index = 0;
    } else if (o.jump) {
      S.stack = []; S.label = o.jump; S.index = 0;
    } else S.index++;
    run();
  }

  function pickByNumber(n) {
    if (waiting !== 'choice' || modalOpen) return;
    const b = $$('#choices .choice')[n - 1];
    if (b) b.click();
  }

  function applyAff(o) {
    Object.entries(o).forEach(([id, v]) => {
      if (!(id in S.aff)) S.aff[id] = 0;
      S.aff[id] = Math.max(0, Math.min(100, S.aff[id] + v));
      if (settings.affToast && v && !skipping()) {
        const c = CHARS[id];
        toast(`<i>♥</i>${esc(c ? c.name : id)} <small>${v > 0 ? '마음이 조금 움직였다' : '마음이 살짝 식었다'}</small>`, c && c.color);
      }
    });
  }

  function stageLabel(c, v) {
    let label = '';
    (c.stages || []).forEach(([min, l]) => { if (v >= min) label = l; });
    return label;
  }

  function statsHtml() {
    return Object.entries(CHARS).filter(([, c]) => c.heroine).map(([id, c]) => {
      const v = S.aff[id] ?? 0;
      return `<div class="stat" style="--c:${c.color}">
        <div class="stat-top"><b>${esc(c.fullName || c.name)}</b><span>${esc(stageLabel(c, v))}</span></div>
        <div class="bar"><i style="width:${Math.max(2, v)}%"></i></div>
        <small>${esc(c.role || '')}</small></div>`;
    }).join('');
  }

  function showEndcard(c) {
    setSkip(false);
    setAuto(false);
    const el = $('#endcard');
    $('.ec-kicker', el).textContent = evalFn(c.kicker) || '';
    $('.ec-title', el).textContent = evalFn(c.title) || '';
    $('.ec-text', el).textContent = evalFn(c.text) || '';
    $('.ec-stats', el).innerHTML = statsHtml();
    $('.ec-next', el).textContent = evalFn(c.next) || '';
    el.classList.add('on');
    waiting = 'end';
    if (c.id) {
      const sys = store.get('system') || { cleared: {} };
      sys.cleared[c.id] = Date.now();
      store.set('system', sys);
    }
    return BLOCK;
  }

  function toast(html, color) {
    const t = document.createElement('div');
    t.className = 'toast';
    if (color) t.style.setProperty('--c', color);
    t.innerHTML = html;
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2300);
    setTimeout(() => t.remove(), 2900);
  }

  /* ===========================================================
   *  10. AUTO / SKIP / HIDE
   * =========================================================== */
  function setAuto(on) {
    auto = on;
    if (on) skip = false;
    syncQuick();
    if (on && waiting === 'say' && !typing) scheduleAuto();
    if (!on && !skip) clearAuto();
  }

  function setSkip(on) {
    skip = on;
    if (on) auto = false;
    syncQuick();
    $('#game').classList.toggle('skipping', on);
    if (!on) { clearAuto(); return; }
    if (waiting === 'say') { if (typing) finishTyping(); else scheduleAuto(); }
    else if (waiting === 'card') closeCard();
  }

  function syncQuick() {
    $('[data-q="auto"]').classList.toggle('active', auto);
    $('[data-q="skip"]').classList.toggle('active', skip);
  }

  function setHidden(on) {
    uiHidden = on;
    $('#game').classList.toggle('ui-hidden', on);
  }

  /* ===========================================================
   *  11. 세이브 / 로드
   * =========================================================== */
  function snapshot() {
    return {
      v: 1, t: Date.now(),
      label: S.label, index: S.index, stack: clone(S.stack),
      aff: clone(S.aff), flags: clone(S.flags),
      bg: S.bg, stage: clone(S.stage), speaker: S.speaker,
      chapter: S.chapter, line: S.line, log: S.log.slice(-200),
    };
  }

  const canSave = () => waiting === 'say' || waiting === 'choice';

  function saveTo(slot) {
    if (!canSave()) { toast('지금은 저장할 수 없어요'); return false; }
    const ok = store.set(`slot:${slot}`, snapshot());
    if (ok) toast(`<i>✓</i>${slot === 'auto' ? '자동' : slot + '번'} 슬롯에 저장했어요`);
    return ok;
  }

  function autosave() { store.set('slot:auto', snapshot()); }

  const slotKeys = () => ['auto', ...Array.from({ length: CFG.saveSlots || 9 }, (_, i) => String(i + 1))];
  const readSlot = (k) => store.get(`slot:${k}`);

  function latestSave() {
    let best = null;
    slotKeys().forEach((k) => {
      const d = readSlot(k);
      if (d && LABELS[d.label] && (!best || d.t > best.t)) best = d;
    });
    return best;
  }

  function resetStageDom() {
    $('#chars').innerHTML = '';
    ['#choices', '#card', '#endcard'].forEach((s) => $(s).classList.remove('on'));
    $('#fade').classList.remove('on');
    $('#text .shown').textContent = '';
    $('#text .rest').textContent = '';
    $('#nameplate span').textContent = '';
    $('#textbox').className = 'narr';
    $('#next').classList.remove('on');
    setHidden(false);
  }

  function stopAll() {
    runId++;
    running = false;
    clearAuto();
    cancelTyping();
    clearTimeout(cardTimer);
    waiting = null;
    auto = false;
    skip = false;
    syncQuick();
    $('#game').classList.remove('skipping');
  }

  function startFrom(data) {
    if (!data || !LABELS[data.label]) { toast('이 세이브는 현재 버전의 스토리와 맞지 않아요'); return; }
    stopAll();
    closeModal(true);
    S = Object.assign(freshState(), clone(data));
    const base = freshState().aff;
    Object.keys(base).forEach((k) => { if (!(k in S.aff)) S.aff[k] = base[k]; });
    resetStageDom();
    showScreen('game');
    paintBg(S.bg, true);
    renderStage(true);
    suppressLogOnce = true;
    run();
  }

  function newGame() {
    stopAll();
    closeModal(true);
    S = freshState();
    resetStageDom();
    paintBg(null, true);
    showScreen('game');
    run();
  }

  /* ===========================================================
   *  12. 모달 (LOG / SAVE / LOAD / SETTINGS / MENU / STATUS)
   * =========================================================== */
  function openModal(title, build, cls = '') {
    const m = $('#modal');
    m.className = `modal on ${cls}`;
    $('header h3', m).textContent = title;
    const body = $('.modal-body', m);
    body.innerHTML = '';
    build(body);
    modalOpen = true;
    clearAuto();
  }

  function closeModal(silent) {
    const m = $('#modal');
    if (!m.classList.contains('on')) { modalOpen = false; return; }
    m.classList.remove('on');
    modalOpen = false;
    if (!silent) scheduleAuto();
  }

  function confirmBox(msg) {
    return new Promise((res) => {
      const c = $('#confirm');
      $('p', c).textContent = msg;
      c.classList.add('on');
      const done = (v) => {
        c.classList.remove('on');
        $('.yes', c).onclick = $('.no', c).onclick = null;
        res(v);
      };
      $('.yes', c).onclick = () => done(true);
      $('.no', c).onclick = () => done(false);
    });
  }

  function openLog() {
    openModal('LOG', (body) => {
      if (!S.log.length) { body.innerHTML = '<p class="empty-msg">아직 기록이 없어요</p>'; return; }
      body.innerHTML = S.log.map((l) => l.choice
        ? `<div class="log-choice">▸ ${esc(l.text)}</div>`
        : `<div class="log-line${l.name ? '' : ' narr'}${l.whisper ? ' whisper' : ''}" style="--c:${l.color || 'transparent'}">
            ${l.name ? `<b>${esc(l.name)}</b>` : ''}<p>${esc(l.text)}</p></div>`).join('');
      requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
    }, 'log');
  }

  function fmtDate(t) {
    const d = new Date(t);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function openSlots(mode) {
    openModal(mode === 'save' ? 'SAVE' : 'LOAD', (body) => {
      const grid = document.createElement('div');
      grid.className = 'slots';
      slotKeys().forEach((k) => {
        if (mode === 'save' && k === 'auto') return;
        const d = readSlot(k);
        const b = document.createElement('button');
        b.className = 'slot' + (d ? '' : ' empty');
        const thumb = d && d.bg ? (bgResolved[d.bg] ? `url("${bgResolved[d.bg]}")` : bgPlaceholderCss(d.bg)) : 'none';
        b.innerHTML = `
          <div class="slot-thumb" style='background-image:${thumb}'><span>${k === 'auto' ? 'AUTO' : 'NO.' + k.padStart(2, '0')}</span></div>
          <div class="slot-info">${d
            ? `<b>${esc(d.chapter || '—')}</b><p>${esc((d.line || '').slice(0, 46))}${(d.line || '').length > 46 ? '…' : ''}</p><time>${fmtDate(d.t)}</time>`
            : '<p class="none">비어 있음</p>'}</div>`;
        b.addEventListener('click', async () => {
          if (mode === 'save') {
            if (d && !(await confirmBox(`${k}번 슬롯에 덮어쓸까요?`))) return;
            if (saveTo(k)) openSlots('save');
          } else if (d) {
            if ($('#game').classList.contains('active') && !(await confirmBox('이 세이브를 불러올까요?\n현재 진행 중인 내용은 사라져요.'))) return;
            startFrom(d);
          }
        });
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }, 'slots-modal');
  }

  function openSettings() {
    openModal('SETTINGS', (body) => {
      body.innerHTML = `
        <label class="set-row"><span>글자 속도</span>
          <input type="range" min="0" max="60" step="2" data-k="textSpeed">
          <em class="hint">느림 ↔ 즉시</em></label>
        <label class="set-row"><span>AUTO 대기 시간</span>
          <input type="range" min="400" max="3600" step="100" data-k="autoDelay">
          <em class="hint">짧게 ↔ 길게</em></label>
        <label class="set-row"><span>대사창 불투명도</span>
          <input type="range" min="0.35" max="1" step="0.05" data-k="boxAlpha">
          <em class="hint">투명 ↔ 불투명</em></label>
        <label class="set-row toggle"><span>호감도 변화 알림</span>
          <input type="checkbox" data-k="affToast"><i></i></label>
        <p class="set-note">단축키 · Space/Enter 진행 · Ctrl 누르는 동안 SKIP · A 자동 · L 로그 · H 숨기기 · 1~3 선택지 · Esc 메뉴</p>`;
      const ts = $('[data-k="textSpeed"]', body);
      ts.value = 60 - settings.textSpeed;
      ts.oninput = () => { settings.textSpeed = 60 - Number(ts.value); applySettings(); };
      const ad = $('[data-k="autoDelay"]', body);
      ad.value = settings.autoDelay;
      ad.oninput = () => { settings.autoDelay = Number(ad.value); applySettings(); };
      const ba = $('[data-k="boxAlpha"]', body);
      ba.value = settings.boxAlpha;
      ba.oninput = () => { settings.boxAlpha = Number(ba.value); applySettings(); };
      const at = $('[data-k="affToast"]', body);
      at.checked = settings.affToast;
      at.onchange = () => { settings.affToast = at.checked; applySettings(); };
    });
  }

  function openStatus() {
    openModal('STATUS', (body) => {
      body.innerHTML = `<p class="status-ch">${esc(S.chapter || '—')}</p><div class="stats">${statsHtml()}</div>`;
    });
  }

  function openMenu() {
    openModal('MENU', (body) => {
      body.innerHTML = `<div class="menu-grid">
        <button data-m="status"><b>STATUS</b><span>관계</span></button>
        <button data-m="save"><b>SAVE</b><span>저장</span></button>
        <button data-m="load"><b>LOAD</b><span>불러오기</span></button>
        <button data-m="log"><b>LOG</b><span>대사 기록</span></button>
        <button data-m="settings"><b>SETTINGS</b><span>설정</span></button>
        <button data-m="title"><b>TITLE</b><span>타이틀로</span></button></div>`;
      $$('[data-m]', body).forEach((b) => b.addEventListener('click', async () => {
        const m = b.dataset.m;
        if (m === 'status') openStatus();
        if (m === 'save') openSlots('save');
        if (m === 'load') openSlots('load');
        if (m === 'log') openLog();
        if (m === 'settings') openSettings();
        if (m === 'title' && (await confirmBox('타이틀로 돌아갈까요?\n저장하지 않은 진행은 사라져요.'))) {
          stopAll(); closeModal(true); showScreen('title');
        }
      }));
    });
  }

  /* ===========================================================
   *  13. 화면 전환 & 타이틀
   * =========================================================== */
  let tcTimer = 0;
  function showScreen(name) {
    $$('.screen').forEach((s) => s.classList.toggle('active', s.id === name));
    clearInterval(tcTimer);
    if (name === 'title') {
      $('#btnContinue').disabled = !latestSave();
      let f = 0;
      tcTimer = setInterval(() => {
        f++;
        const p = (n) => String(n).padStart(2, '0');
        const fr = f % 24, s = Math.floor(f / 24);
        $('#timecode').textContent = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}:${p(fr)}`;
      }, 1000 / 24);
    }
  }

  function buildPetals() {
    const wrap = $('.petals');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('i');
      const size = 6 + Math.random() * 10;
      p.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size * 0.72}px;` +
        `animation-duration:${9 + Math.random() * 10}s,${3 + Math.random() * 3}s;` +
        `animation-delay:${-Math.random() * 18}s,${-Math.random() * 3}s;opacity:${0.45 + Math.random() * 0.45}`;
      wrap.appendChild(p);
    }
  }

  /* ===========================================================
   *  14. 레이아웃 (반응형)
   * =========================================================== */
  function layout() {
    const w = window.innerWidth, h = window.innerHeight;
    const portrait = h > w;
    const m = portrait || w < 760;
    document.body.classList.toggle('m', m);
    document.body.classList.toggle('portrait', portrait);
    const L = CFG.layout || {};
    const base = portrait
      ? Math.min(h * (L.portraitHeight ?? 0.8), w * (L.portraitMaxWidthRatio ?? 1.9))
      : h * (L.landscapeHeight ?? 0.95);
    document.documentElement.style.setProperty('--char-base', `${Math.round(base)}px`);
    if (Object.keys(S.stage).length) renderStage(true);
  }

  /* ===========================================================
   *  15. 입력
   * =========================================================== */
  function bindInput() {
    $('.title-menu').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      const act = b.dataset.act;
      if (act === 'new') newGame();
      if (act === 'continue') { const d = latestSave(); if (d) startFrom(d); }
      if (act === 'load') openSlots('load');
      if (act === 'settings') openSettings();
    });

    $('#game').addEventListener('click', (ev) => {
      if (ev.target.closest('#quick, #choices, #endcard')) return;
      advance();
    });

    $('#quick').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      ev.stopPropagation();
      const q = b.dataset.q;
      if (q === 'auto') setAuto(!auto);
      if (q === 'skip') setSkip(!skip);
      if (q === 'log') openLog();
      if (q === 'save') openSlots('save');
      if (q === 'load') openSlots('load');
      if (q === 'hide') setHidden(true);
      if (q === 'menu') openMenu();
    });

    $('#endcard .ec-btn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      stopAll();
      $('#endcard').classList.remove('on');
      showScreen('title');
    });

    $('#modal').addEventListener('click', (ev) => {
      if (ev.target.id === 'modal' || ev.target.closest('.x')) closeModal();
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if ($('#confirm').classList.contains('on')) return;
        if (modalOpen) closeModal();
        else if ($('#game').classList.contains('active')) openMenu();
        return;
      }
      if (!$('#game').classList.contains('active') || modalOpen) return;
      if (ev.key === 'Control' && !ev.repeat) { setSkip(true); return; }
      if (ev.repeat) return;
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
      else if (/^[1-9]$/.test(ev.key)) pickByNumber(Number(ev.key));
      else if (ev.key === 'a' || ev.key === 'A') setAuto(!auto);
      else if (ev.key === 'l' || ev.key === 'L') openLog();
      else if (ev.key === 'h' || ev.key === 'H') setHidden(!uiHidden);
    });
    window.addEventListener('keyup', (ev) => { if (ev.key === 'Control') setSkip(false); });
    window.addEventListener('blur', () => { if (skip) setSkip(false); });

    $('#stage').addEventListener('wheel', (ev) => {
      if (ev.deltaY < 0 && $('#game').classList.contains('active') && !modalOpen) openLog();
    }, { passive: true });

    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  }

  /* ===========================================================
   *  16. 부팅
   * =========================================================== */
  function validate() {
    if (!LABELS[CFG.startLabel]) console.error(`[VN] 시작 라벨 "${CFG.startLabel}"이 없어요`);
    Object.entries(LABELS).forEach(([name, list]) => list.forEach((c) => {
      const targets = [];
      if (c.type === 'jump') targets.push(c.to);
      if (c.type === 'choice') c.choice.forEach((o) => o.jump && targets.push(o.jump));
      targets.forEach((t) => { if (!LABELS[t]) console.error(`[VN] "${name}"에서 존재하지 않는 라벨 "${t}"로 이동합니다`); });
      if (c.type === 'show' && !CHARS[c.who]) console.error(`[VN] "${name}": 알 수 없는 캐릭터 "${c.who}"`);
      if (c.type === 'bg' && !BGS[c.id]) console.warn(`[VN] "${name}": config에 없는 배경 "${c.id}"`);
    }));
  }

  function preload() {
    Object.entries(CHARS).forEach(([id, c]) => {
      if (c.noSprite) return;
      (c.faces || ['normal']).forEach((f) => resolveFace(id, f));
    });
    Object.keys(BGS).forEach((id) => resolveBg(id));
  }

  async function titleImage() {
    if (!CFG.titleImage) return;
    const u = await firstLoadable((CFG.bgFormats || ['jpg']).map((x) => `${CFG.titleImage}.${x}`));
    if (u) $('.title-bg').style.backgroundImage = `url("${u}")`;
  }

  function boot() {
    document.title = CFG.title;
    applySettings();
    validate();
    layout();
    bindInput();
    buildPetals();
    showScreen('title');
    preload();
    titleImage();
  }

  const api = {
    dsl, label: defineLabel, boot,
    get state() { return S; },
    get labels() { return LABELS; },
    toast,
    /** 엔딩/루트 판정 등에 쓰는 도우미 */
    gain: (id) => (S.aff[id] ?? 0) - ((CHARS[id] && CHARS[id].startAffection) || 0),
  };
  window.VN = api;
})();

</script>
<!-- 스토리: 챕터를 추가하면 여기에 한 줄씩 -->
<script>/* ==== js/story/prologue.js ==== */
/* =============================================================
 *  PROLOGUE — 개강 첫날
 * ============================================================= */
(() => {
  const { say, narr, show, hide, hideAll, move, bg, place, chapter, jump } = VN.dsl;
  // 화자 단축 함수: Y(표정, 대사, 옵션)

<script>/* ==== js/story/routes.js ==== */
/* =============================================================
 *  ROUTES — 공통 루트 → 개별 루트 분기 (템플릿)
 *
 *  지금은 챕터 1까지만 있어서 이 라벨들은 아직 실행되지 않습니다.
 *  공통 루트의 마지막 챕터가 끝날 때 jump('route_split') 하면
 *  아래 기준으로 서연 루트 / 지아 루트 / 노멀 엔딩으로 나뉩니다.
 *
 *  새 챕터 추가 방법
 *   1) js/story/chapter2.js 를 만들고 VN.label('ch2', [...]) 작성
 *   2) index.html 에 <script src="js/story/chapter2.js"><\/script> 추가
 *   3) chapter1.js 의 'ch1_end' 에서 endcard 대신 jump('ch2')
 * ============================================================= */
(() => {
  const { narr, when, jump, endcard } = VN.dsl;

  /** 루트 판정 기준 — 숫자는 공통 루트 분량이 정해지면 조정 */
  const ROUTE_RULE = {
    minAffection: 40,   // 이 이상이어야 개별 루트 진입
    margin: 5,          // 상대보다 이만큼은 높아야 함 (동점 방지)
  };

  function routeOf(s) {
    const j = s.aff.jia, sy = s.aff.seoyeon;
    if (sy >= ROUTE_RULE.minAffection && sy >= j + ROUTE_RULE.margin) return 'seoyeon';
    if (j >= ROUTE_RULE.minAffection && j >= sy + ROUTE_RULE.margin) return 'jia';
    // 호감도가 비슷하면 핵심 플래그로 결정 (예시)
    if (s.flags.confessedTo) return s.flags.confessedTo;
    return null;
  }
  VN.routeOf = routeOf;

  VN.label('route_split', [
    when((s) => routeOf(s) === 'seoyeon', [jump('seoyeon_route')]),
    when((s) => routeOf(s) === 'jia', [jump('jia_route')]),
    jump('normal_end'),
  ]);

  VN.label('seoyeon_route', [
    narr('(서연 루트 — 준비 중)'),
    endcard({ id: 'seoyeon_route_wip', kicker: 'SEOYEON ROUTE', title: '준비 중', text: '서연 루트는 다음 업데이트에서 이어집니다.' }),
  ]);

  VN.label('jia_route', [
    narr('(지아 루트 — 준비 중)'),
    endcard({ id: 'jia_route_wip', kicker: 'JIA ROUTE', title: '준비 중', text: '지아 루트는 다음 업데이트에서 이어집니다.' }),
  ]);

  VN.label('normal_end', [
    endcard({ id: 'normal_end', kicker: 'NORMAL END', title: '봄이 지나가고', text: '아무 일도 일어나지 않은 봄도,\n나쁘지는 않았다.' }),
  ]);
})();

</script>
<script>VN.boot();</script>
