<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>첫사랑 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Black+Han+Sans&family=Dokdo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =============================================================
 *  온에어 — UI
 * ============================================================= */
:root {
  --ink: #121626;
  --ink-2: #1c2136;
  --paper: #f7f2eb;
  --paper-dim: #d9d3cb;
  --blush: #eaa79f;
  --blush-2: #f6d2c8;
  --lilac: #b8a4e6;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --char-base: 90vh;
  --tb-alpha: .84;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --ease: cubic-bezier(.22, .8, .24, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0a0c14;
  color: var(--paper);
  font-family: var(--font);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }
#app { position: fixed; inset: 0; overflow: hidden; }

.screen {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .7s ease, visibility 0s linear .7s;
}
.screen.active { opacity: 1; visibility: visible; transition: opacity .7s ease; }

/* ============================ TITLE ============================ */
#title { overflow: hidden; }
.title-bg {
  position: absolute; inset: -4%;
  background:
    radial-gradient(80% 60% at 78% 18%, rgba(255, 230, 214, .55), transparent 60%),
    radial-gradient(70% 50% at 12% 88%, rgba(184, 164, 230, .35), transparent 65%),
    linear-gradient(172deg, #232946 0%, #4b4b72 34%, #a77f92 66%, #eeb3a4 88%, #f8dac8 100%);
  background-size: cover; background-position: center;
  animation: kenburns 28s ease-in-out infinite alternate;
}
.title-shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10, 12, 22, .1) 0%, rgba(10, 12, 22, .0) 40%, rgba(10, 12, 22, .55) 100%);
}
@keyframes kenburns { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1.2%, -1%); } }

.petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.petals i {
  position: absolute; top: -20px;
  background: radial-gradient(circle at 30% 30%, #fff 0%, #fde3e0 45%, #f3b7b2 100%);
  border-radius: 80% 0 80% 0;
  animation-name: fall, sway;
  animation-timing-function: linear, ease-in-out;
  animation-iteration-count: infinite, infinite;
  animation-direction: normal, alternate;
}
@keyframes fall { to { top: 105%; transform: rotate(540deg); } }
@keyframes sway { from { margin-left: -24px; } to { margin-left: 28px; } }

.vf {
  position: absolute; pointer-events: none;
  top: calc(18px + var(--safe-t)); bottom: calc(18px + var(--safe-b));
  left: calc(18px + var(--safe-l)); right: calc(18px + var(--safe-r));
}
.vf i { position: absolute; width: 30px; height: 30px; border: 0 solid rgba(255, 255, 255, .78); }
.vf .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
.vf .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
.vf .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
.vf .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.vf .rec, .vf .tc, .vf .iso {
  position: absolute; font: 600 11px/1 ui-monospace, 'SF Mono', Menlo, monospace;
  letter-spacing: .14em; color: rgba(255, 255, 255, .86);
}
.vf .rec { top: 14px; left: 44px; display: flex; align-items: center; gap: 7px; }
.vf .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; animation: blink 1.2s steps(2, start) infinite; }
.vf .tc { top: 14px; right: 44px; }
.vf .iso { bottom: 14px; right: 44px; opacity: .7; }
@keyframes blink { to { visibility: hidden; } }

.title-inner {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(620px, 86vw);
  text-align: center;
}
.title-kicker {
  font-size: 12px; letter-spacing: .5em; font-weight: 600;
  color: rgba(255, 255, 255, .78); margin-bottom: 18px;
  animation: rise 1.2s var(--ease) both .2s;
}
.title-logo {
  font-family: var(--serif); font-weight: 700; line-height: 1.05;
  display: flex; flex-direction: column; align-items: center;
  text-shadow: 0 6px 40px rgba(30, 20, 50, .45);
}
.title-logo .l1 { font-size: clamp(30px, 4.6vw, 48px); color: var(--blush-2); font-weight: 400; animation: rise 1.2s var(--ease) both .35s; }
.title-logo .l2 { font-size: clamp(44px, 8vw, 92px); letter-spacing: -.02em; animation: rise 1.4s var(--ease) both .5s; }
.title-en {
  margin-top: 14px; font-size: 11px; letter-spacing: .62em;
  color: rgba(255, 255, 255, .62); animation: rise 1.2s var(--ease) both .7s;
}
.title-menu {
  margin: clamp(34px, 7vh, 64px) auto 0; display: flex; flex-direction: column;
  align-items: center; gap: 4px; animation: rise 1.2s var(--ease) both .9s;
}
.title-menu button {
  position: relative; padding: 11px 26px;
  font-size: 14px; font-weight: 600; letter-spacing: .32em; text-indent: .32em;
  color: rgba(255, 255, 255, .88);
  transition: color .3s, letter-spacing .4s var(--ease);
}
.title-menu button::before, .title-menu button::after {
  content: ''; position: absolute; top: 50%; width: 0; height: 1px;
  background: var(--blush-2); transition: width .4s var(--ease);
}
.title-menu button::before { right: 100%; }
.title-menu button::after { left: 100%; }
.title-menu button:hover:not(:disabled) { color: #fff; letter-spacing: .4em; }
.title-menu button:hover:not(:disabled)::before, .title-menu button:hover:not(:disabled)::after { width: 28px; }
.title-menu button:disabled { opacity: .32; cursor: default; }
.title-foot {
  position: absolute; left: 0; right: 0; bottom: calc(40px + var(--safe-b));
  text-align: center; font-size: 11px; color: rgba(255, 255, 255, .55); letter-spacing: .02em; padding: 0 40px;
}
.title-endings { margin-top: 18px; font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .24em; color: rgba(255, 255, 255, .6); min-height: 11px; }
.sound-hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(66px + var(--safe-b));
  white-space: nowrap;
  padding: 7px 14px; border-radius: 999px;
  font-size: 11.5px; letter-spacing: .04em; color: rgba(255, 255, 255, .78);
  background: rgba(14, 17, 30, .35); border: 1px solid rgba(255, 255, 255, .18);
  animation: pulse 2.4s ease-in-out infinite;
  transition: opacity .6s;
}
.sound-hint.off { opacity: 0; pointer-events: none; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

/* ============================ STAGE ============================ */
#game { background: #000; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0; transition: opacity 1s ease;
}
.bg.show { opacity: 1; }
.bg.instant { transition: none; }
.bg-label {
  position: absolute; right: calc(22px + var(--safe-r)); top: calc(22px + var(--safe-t));
  text-align: right; pointer-events: none; max-width: 60%;
}
.bg-label b {
  display: block; font-family: var(--serif); font-size: clamp(15px, 1.6vw, 20px);
  color: rgba(255, 255, 255, .62); letter-spacing: .04em; font-weight: 700;
  text-shadow: 0 1px 8px rgba(0, 0, 0, .25);
}
.bg-label span {
  display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px;
  font: 10px ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, .7);
  border: 1px dashed rgba(255, 255, 255, .4);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(5, 6, 14, .45) 100%);
}

/* ---------- characters ---------- */
#chars { position: absolute; inset: 0; pointer-events: none; }
.char {
  position: absolute;
  bottom: var(--by, 0px);
  left: var(--x, 50%);
  height: var(--h, var(--char-base));
  transform: translateX(-50%) translate(var(--ex, 0px), var(--ey, 0px));
  z-index: 2;
  transition:
    left .7s var(--ease),
    transform .6s var(--ease),
    opacity .55s ease,
    filter .4s ease;
  filter: drop-shadow(0 14px 34px rgba(0, 0, 0, .22));
}
.char.enter, .char.leave { opacity: 0; }
.char.speaking { z-index: 4; }
.char.dim { filter: brightness(.56) saturate(.72) drop-shadow(0 14px 34px rgba(0, 0, 0, .18)); }
.char .bob { height: 100%; }
.char .bob.hop { animation: hop .42s var(--ease); }
.char .inner {
  position: relative; height: 100%;
  transform: translateX(var(--lean, 0px)) scaleX(var(--flip, 1));
  transition: transform .5s var(--ease);
}
.char .face { display: block; height: 100%; width: auto; max-width: none; pointer-events: none; }
.char .face.incoming { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .12s ease; }
.char .face.outgoing { opacity: 0; transition: opacity .12s ease; }
.char .face.incoming.in { opacity: 1; }
#chars.instant .char, #chars.instant .char .inner { transition: none !important; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-3.2%); } 65% { transform: translateY(.4%); } }

#stage.shake { animation: shake .45s; }
@keyframes shake {
  0%, 100% { transform: none; } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); }
  60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, -1px); }
}

/* ---------- place banner ---------- */
#place {
  position: absolute; z-index: 15;
  top: calc(20px + var(--safe-t)); left: calc(20px + var(--safe-l));
  padding: 10px 18px 10px 16px;
  border-left: 3px solid var(--blush);
  background: linear-gradient(90deg, rgba(14, 17, 30, .72), rgba(14, 17, 30, .28));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 0 10px 10px 0;
  opacity: 0; transform: translateX(-14px);
  transition: opacity .6s ease, transform .6s var(--ease);
  pointer-events: none;
}
#place.on { opacity: 1; transform: none; }
#place b { display: block; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
#place span { display: block; margin-top: 3px; font: 500 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: rgba(255, 255, 255, .7); }

/* ---------- 호감도 게이지 (HUD) ---------- */
#hud {
  position: absolute; z-index: 17;
  top: calc(20px + var(--safe-t)); right: calc(20px + var(--safe-r));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  pointer-events: none;
  transition: opacity .35s ease;
}
body.no-hud #hud, #game.ui-hidden #hud, #game:has(#endcard.on) #hud, #game:has(#card.on) #hud { opacity: 0; }
.hud-item {
  --c: var(--blush);
  position: relative;
  display: none; align-items: center; gap: 8px;
  padding: 7px 14px 7px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(14, 17, 30, .78), rgba(14, 17, 30, .5));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
  font-size: 13px;
}
.hud-item.on { display: flex; animation: hudIn .5s var(--ease) both; }
@keyframes hudIn { from { opacity: 0; transform: translateX(14px); } }
.hud-heart {
  display: grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: #fff; font-size: 12px;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .08), 0 0 14px var(--c);
}
.hud-name { font-weight: 800; letter-spacing: .06em; min-width: 2.4em; }
.hud-bar { position: relative; width: 92px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.hud-bar i {
  position: absolute; inset: 0 auto 0 0; border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c));
  box-shadow: 0 0 10px var(--c);
  transition: width .9s var(--ease);
}
.hud-num { font: 700 12px/1 ui-monospace, Menlo, monospace; min-width: 2ch; text-align: right; color: #fff; }
.hud-stage { font-size: 11px; color: rgba(255, 255, 255, .62); }
.hud-item.up .hud-heart { animation: beat .7s ease 2; }
.hud-item.up { animation: hudGlow 1.2s ease; }
.hud-item.down .hud-heart { filter: grayscale(.7); animation: droop .8s ease; }
@keyframes beat { 30% { transform: scale(1.35); } 60% { transform: scale(.92); } }
@keyframes droop { 40% { transform: translateY(3px) scale(.9); } }
@keyframes hudGlow { 20% { box-shadow: 0 0 0 2px var(--c), 0 0 26px var(--c); } }
.hud-pop {
  position: absolute; right: 10px; top: -6px;
  font: 800 15px/1 var(--font); color: #fff;
  text-shadow: 0 0 8px var(--c), 0 1px 0 rgba(0, 0, 0, .4);
  animation: hudPop 1.4s var(--ease) forwards;
}
.hud-item.down .hud-pop { color: #c9c2d6; text-shadow: none; }
@keyframes hudPop { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 20% { opacity: 1; transform: translateY(-4px) scale(1.15); } 100% { opacity: 0; transform: translateY(-26px); } }
.hud-spark {
  position: absolute; left: 14px; top: 10px;
  color: var(--c); font-size: 12px; text-shadow: 0 0 8px var(--c);
  animation: spark 1.1s ease-out forwards;
}
@keyframes spark { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(160deg); } }
body:not(.no-hud) #toasts { top: calc(104px + var(--safe-t)); }

/* ---------- 인물 소개 카드 (intro) ---------- */
#intro {
  --c: var(--blush);
  position: absolute; z-index: 16;
  top: calc(26px + var(--safe-t)); left: 0; right: 0; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  width: max-content; max-width: min(560px, calc(100% - 32px));
  padding: 12px 26px 12px 12px;
  border-radius: 18px;
  background: linear-gradient(100deg, rgba(14, 17, 30, .82), rgba(14, 17, 30, .5));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .35), inset 0 -2px 0 var(--c);
  opacity: 0; transform: translateY(-10px);
  transition: opacity .6s ease, transform .6s var(--ease);
  pointer-events: none;
}
#intro.on { opacity: 1; transform: none; }
.intro-pic {
  flex: none; width: 66px; height: 80px; border-radius: 12px;
  background-color: #1b2034; background-repeat: no-repeat;
  border: 2px solid var(--c);
}
.intro-body { min-width: 0; }
.intro-kicker { font: 600 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .32em; color: var(--c); }
.intro-name { margin-top: 7px; font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.intro-role { margin-top: 5px; font-size: 12.5px; line-height: 1.45; color: rgba(255, 255, 255, .72); }

/* ============================ TEXTBOX ============================ */
#textbox {
  --c: var(--blush);
  position: absolute; z-index: 20;
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  width: min(1120px, calc(100% - 32px - var(--safe-l) - var(--safe-r)));
  min-height: clamp(150px, 25vh, 214px);
  padding: 34px 40px 26px;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(26, 30, 50, calc(var(--tb-alpha) * .9)), rgba(14, 16, 28, var(--tb-alpha)));
  backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .07);
  transition: opacity .35s ease, transform .35s var(--ease);
  cursor: pointer;
}
#textbox::before {
  content: ''; position: absolute; left: 24px; right: 24px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c), transparent);
  opacity: .7;
}
#nameplate {
  position: absolute; top: -19px; left: 28px;
  padding: 8px 22px 8px 18px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-weight: 800; font-size: 15px; letter-spacing: .08em;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .25), inset 4px 0 0 var(--c);
  transition: opacity .25s, transform .25s var(--ease);
}
#textbox.narr #nameplate { opacity: 0; transform: translateY(6px); }
/* 화면 밖 인물 초상 */
#textbox { --pw: clamp(84px, 7.5vw, 108px); }
#portrait {
  position: absolute; left: 22px; bottom: 20px;
  width: var(--pw); height: calc(var(--pw) * 1.22);
  border-radius: 14px;
  background-color: #1b2034; background-repeat: no-repeat;
  border: 2px solid var(--c);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .35);
  opacity: 0; transform: translateY(6px);
  transition: opacity .25s ease, transform .25s var(--ease);
  pointer-events: none;
}
#portrait.on { opacity: 1; transform: none; }
#textbox.has-portrait { padding-left: calc(var(--pw) + 46px); }
#textbox.has-portrait #nameplate { left: calc(var(--pw) + 34px); }
#textbox.msg #nameplate { background: #fff7d6; }
#textbox.msg #nameplate span::before { content: '✉ '; }
#text {
  font-size: clamp(15.5px, .9vw + 9px, 20px);
  line-height: 1.82;
  letter-spacing: -.005em;
  white-space: pre-line;
  color: var(--paper);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
}
#text .rest { visibility: hidden; }
#textbox.narr #text { color: #ddd6e6; }
#textbox.whisper #text { font-size: .94em; color: #c9c2d6; font-style: italic; }
#textbox.msg #text { color: #fff4cf; }
#next {
  position: absolute; right: 30px; bottom: 20px;
  width: 10px; height: 10px; opacity: 0;
  border-right: 2px solid var(--c); border-bottom: 2px solid var(--c);
  transform: rotate(45deg);
  transition: opacity .2s;
}
#next.on { opacity: 1; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: rotate(45deg) translate(3px, 3px); } }

#quick {
  position: absolute; top: 9px; right: 18px;
  display: flex; gap: 2px;
}
#quick button {
  padding: 5px 8px; border-radius: 6px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  color: rgba(255, 255, 255, .48);
  transition: color .2s, background .2s;
}
#quick button:hover { color: #fff; background: rgba(255, 255, 255, .06); }
#quick button.active { color: var(--ink); background: var(--blush-2); }
#game.skipping #quick [data-q="skip"] { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

#game.ui-hidden #intro { opacity: 0; }
#game.ui-hidden #textbox, #game.ui-hidden #place { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); }
#game.ui-hidden #place { transform: none; }

/* ============================ OVERLAYS ============================ */
.overlay {
  position: absolute; inset: 0; z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity .5s ease, visibility 0s linear .5s;
}
.overlay.on { opacity: 1; visibility: visible; transition: opacity .5s ease; }

/* ---------- choices ---------- */
#choices {
  background: radial-gradient(70% 60% at 50% 45%, rgba(10, 12, 22, .35), rgba(10, 12, 22, .62));
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  padding: 20px 20px calc(clamp(150px, 25vh, 214px) + 40px);
}
.choice-prompt {
  font-family: var(--serif); font-size: clamp(16px, 1.4vw + 6px, 21px);
  color: #fff; margin-bottom: 20px; text-align: center;
  text-shadow: 0 2px 16px rgba(0, 0, 0, .5);
  max-width: 640px;
}
.choice-prompt:empty { display: none; }
.choice-list { width: min(580px, 100%); display: flex; flex-direction: column; gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 16px;
  width: 100%; padding: 16px 22px;
  text-align: left; font-size: clamp(15px, .6vw + 11px, 17px); font-weight: 600; line-height: 1.45;
  color: var(--ink);
  background: rgba(250, 246, 240, .94);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(255, 255, 255, .6);
  opacity: 0; transform: translateY(12px);
  animation: choiceIn .5s var(--ease) forwards;
  transition: transform .25s var(--ease), background .25s, box-shadow .25s;
}
.choice em {
  flex: 0 0 auto; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
  color: #c2756c; padding: 6px 7px; border-radius: 6px; background: rgba(234, 167, 159, .18);
}
@media (hover: hover) {
  .choice:hover { transform: translateX(6px); background: #fff; box-shadow: 0 14px 34px rgba(0, 0, 0, .32), inset 4px 0 0 var(--blush); }
}
.choice:active { transform: scale(.985); }
@keyframes choiceIn { to { opacity: 1; transform: none; } }

/* ---------- chapter card ---------- */
#card { background: #07080e; z-index: 50; text-align: center; padding: 30px; cursor: pointer; }
.card-line { width: 1px; height: 0; background: var(--blush); margin-bottom: 24px; transition: height 1.2s var(--ease) .2s; }
#card.on .card-line { height: 56px; }
.card-kicker { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .5em; color: var(--blush); }
.card-title { font-family: var(--serif); font-size: clamp(30px, 5vw, 52px); margin: 18px 0 14px; letter-spacing: .02em; }
.card-sub:empty { display: none; }
.card-sub { font-size: 14px; color: rgba(255, 255, 255, .6); letter-spacing: .08em; }
#card > * { opacity: 0; transform: translateY(10px); transition: opacity 1s ease, transform 1s var(--ease); }
#card.on > * { opacity: 1; transform: none; }
#card.on .card-kicker { transition-delay: .35s; }
#card.on .card-title { transition-delay: .55s; }
#card.on .card-sub { transition-delay: .8s; }

/* ---------- endcard ---------- */
#endcard { background: rgba(7, 8, 14, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 45; padding: 20px; }
.ec-panel { width: min(520px, 100%); text-align: center; }
.ec-kicker { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .4em; color: var(--blush); }
.ec-title { font-family: var(--serif); font-size: clamp(30px, 5vw, 44px); margin: 16px 0 18px; }
.ec-text { font-family: var(--serif); font-size: 16px; line-height: 1.8; color: rgba(255, 255, 255, .86); white-space: pre-line; }
.ec-stats { margin: 30px 0 22px; display: grid; gap: 14px; text-align: left; }
.ec-next { font-size: 12px; letter-spacing: .06em; color: rgba(255, 255, 255, .5); margin-bottom: 26px; }
.ec-btn {
  padding: 13px 34px; border-radius: 999px; font-weight: 700; letter-spacing: .2em;
  background: var(--paper); color: var(--ink);
  transition: transform .2s var(--ease), box-shadow .2s;
}
.ec-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, .35); }

.stat { --c: var(--blush); padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stat-top b { font-size: 15px; }
.stat-top span { font-size: 12px; color: var(--c); font-weight: 600; }
.stat .bar { height: 6px; margin: 10px 0 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); transition: width 1s var(--ease); }
.stat small { font-size: 11px; color: rgba(255, 255, 255, .5); }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .48s ease; z-index: 60; }
#fade.on { opacity: 1; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 59; }
/* 집중선 */
#speedlines {
  position: absolute; inset: -10%; z-index: 58; pointer-events: none; opacity: 0;
  background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255, 255, 255, 0) 0deg 2.2deg, rgba(255, 255, 255, .9) 2.4deg 2.9deg, rgba(255, 255, 255, 0) 3.1deg 5.3deg);
  -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 46%, transparent 38%, #000 78%);
  mask-image: radial-gradient(ellipse 60% 55% at 50% 46%, transparent 38%, #000 78%);
}
#speedlines.on { animation: speed 1.1s steps(1) forwards, speedFade 1.1s ease-out forwards; }
@keyframes speed { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(1.3deg) scale(1.02); } 50% { transform: rotate(-.8deg) scale(1.01); } 75% { transform: rotate(.6deg) scale(1.03); } }
@keyframes speedFade { 0% { opacity: 0; } 8% { opacity: 1; } 60% { opacity: .9; } 100% { opacity: 0; } }

/* 큰 글씨 대사 (say opts.big) */
#textbox.big #text { font-size: clamp(30px, 3vw + 14px, 52px); font-weight: 800; letter-spacing: .02em; line-height: 1.3; }
#textbox.big #text .shown { display: inline-block; animation: bigPop .45s var(--ease); }
@keyframes bigPop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }

/* 후광 (fx('halo', who)) — 부드럽게 번지고, 천천히 숨 쉬듯 */
.char .halo { position: absolute; left: 50%; top: 24%; width: 170%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; z-index: -1; opacity: 0; animation: haloIn 1.8s ease-out forwards; }
.char .halo.out { animation: haloOut 2.4s ease-in-out forwards; }
.char .halo i { position: absolute; inset: 0; border-radius: 50%; }
.char .halo-glow { background: radial-gradient(circle, rgba(255, 253, 240, .95) 0%, rgba(255, 240, 210, .6) 20%, rgba(255, 222, 230, .22) 42%, transparent 64%); animation: breathe 3.2s ease-in-out infinite; }
.char .halo-bloom { inset: -40%; background: radial-gradient(circle, rgba(255, 250, 235, .55) 0%, rgba(255, 245, 230, .18) 35%, transparent 60%); filter: blur(10px); }
.char .halo-rays {
  background: repeating-conic-gradient(from 0deg, rgba(255, 248, 225, .5) 0deg 2.5deg, transparent 2.5deg 12deg);
  -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%); mask-image: radial-gradient(circle, #000 12%, transparent 62%);
  filter: blur(6px); opacity: .55;
  animation: haloSpin 60s linear infinite;
}
.char .halo b {
  position: absolute; left: var(--sx); top: var(--sy); width: var(--sz); height: var(--sz); border-radius: 50%;
  background: #fffaf0; box-shadow: 0 0 8px 2px rgba(255, 240, 200, .9);
  opacity: 0; animation: mote 3.6s ease-in-out var(--sd) infinite;
}
@keyframes haloIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes haloOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
@keyframes haloSpin { to { transform: rotate(360deg); } }
@keyframes mote { 0% { opacity: 0; transform: translate(0, 10px); } 30% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -60px); } }
/* 후광이 뜰 때 배경도 살짝 밝아짐 */
#stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(60% 70% at 50% 35%, rgba(255, 250, 238, .35), transparent 70%); opacity: 0; transition: opacity 2.2s ease; }
#stage.lit::after { opacity: 1; }
#flash.on { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

/* ---------- toasts ---------- */
#toasts {
  position: absolute; z-index: 90; pointer-events: none;
  top: calc(20px + var(--safe-t)); right: calc(20px + var(--safe-r));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.toast {
  --c: var(--blush);
  padding: 9px 16px 9px 12px; border-radius: 999px;
  background: rgba(14, 17, 30, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, .1);
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  animation: toastIn .45s var(--ease);
  transition: opacity .5s, transform .5s;
}
.toast i { font-style: normal; color: var(--c); font-size: 14px; }
.toast small { font-weight: 400; color: rgba(255, 255, 255, .7); font-size: 12px; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateX(16px); } }

/* ============================ MODAL ============================ */
.modal {
  position: absolute; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background: rgba(6, 7, 12, .6);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s;
}
.modal.on { opacity: 1; visibility: visible; transition: opacity .3s; }
.modal-panel {
  width: min(760px, 100%); max-height: 100%;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1e2338, #141828);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  transform: translateY(14px) scale(.98); transition: transform .35s var(--ease);
}
.modal.on .modal-panel { transform: none; }
.modal-panel header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
.modal-panel h3 { font: 700 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .4em; color: var(--blush-2); }
.modal-panel .x { width: 34px; height: 34px; border-radius: 50%; color: rgba(255, 255, 255, .6); transition: background .2s; }
.modal-panel .x:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.modal-body { padding: 18px 24px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
.modal-body .empty-msg { color: rgba(255, 255, 255, .5); text-align: center; padding: 30px 0; }

/* log */
.modal.log .modal-panel { height: 86vh; }
.log-line { --c: transparent; padding: 12px 0 12px 14px; border-left: 2px solid var(--c); margin-bottom: 4px; }
.log-line b { display: block; font-size: 12px; letter-spacing: .1em; color: var(--c); margin-bottom: 4px; }
.log-line p { font-size: 15px; line-height: 1.7; color: #ece6df; white-space: pre-line; }
.log-line.narr { border-left-color: rgba(255, 255, 255, .12); }
.log-line.narr p { color: #bdb6c8; }
.log-line.whisper p { font-style: italic; }
.log-choice { margin: 10px 0 14px; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--blush-2); display: inline-block; }

/* slots */
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.slot {
  display: flex; gap: 12px; padding: 10px; border-radius: 14px; text-align: left;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08);
  transition: background .2s, border-color .2s, transform .2s var(--ease);
}
.slot:hover { background: rgba(255, 255, 255, .08); border-color: rgba(234, 167, 159, .5); transform: translateY(-1px); }
.slot.empty { opacity: .62; }
.slot-thumb {
  flex: 0 0 104px; height: 64px; border-radius: 9px; position: relative; overflow: hidden;
  background-color: #2a2f45; background-size: cover; background-position: center;
}
.slot-thumb span {
  position: absolute; left: 6px; top: 6px; padding: 3px 6px; border-radius: 5px;
  font: 700 9.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em;
  background: rgba(10, 12, 20, .7); color: #fff;
}
.slot-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.slot-info b { font-size: 12px; color: var(--blush-2); letter-spacing: .04em; }
.slot-info p { font-size: 12.5px; color: #e4ded6; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.slot-info p.none { color: rgba(255, 255, 255, .45); }
.slot-info time { font: 10.5px ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, .45); }

/* settings */
.set-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 6px 18px; padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.set-row > span { font-size: 14px; font-weight: 600; }
.set-row .hint { grid-column: 2; font-size: 11px; color: rgba(255, 255, 255, .45); font-style: normal; }
.set-row input[type=range] { width: 100%; accent-color: var(--blush); height: 28px; }
.set-row.toggle { grid-template-columns: 1fr auto; cursor: pointer; }
.set-row.toggle input { display: none; }
.set-row.toggle i { width: 44px; height: 26px; border-radius: 99px; background: rgba(255, 255, 255, .16); position: relative; transition: background .25s; }
.set-row.toggle i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
.set-row.toggle input:checked + i { background: var(--blush); }
.set-row.toggle input:checked + i::after { transform: translateX(18px); }
.set-note { margin-top: 18px; font-size: 12px; line-height: 1.7; color: rgba(255, 255, 255, .5); }

/* menu & status */
.menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.menu-grid button {
  padding: 22px 10px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08);
  transition: background .2s, border-color .2s;
}
.menu-grid button:hover { background: rgba(255, 255, 255, .08); border-color: rgba(234, 167, 159, .5); }
.menu-grid b { font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .24em; color: var(--blush-2); }
.menu-grid span { font-size: 12px; color: rgba(255, 255, 255, .6); }
.status-ch { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: rgba(255, 255, 255, .55); margin-bottom: 14px; }
.stats { display: grid; gap: 12px; }

/* confirm */
.confirm {
  position: absolute; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center;
  background: rgba(6, 7, 12, .55); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s linear .25s; padding: 20px;
}
.confirm.on { opacity: 1; visibility: visible; transition: opacity .25s; }
.confirm-panel { width: min(360px, 100%); padding: 26px 24px 18px; border-radius: 18px; background: #1d2236; border: 1px solid rgba(255, 255, 255, .1); text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.confirm-panel p { font-size: 15px; line-height: 1.6; white-space: pre-line; margin-bottom: 20px; }
.confirm-btns { display: flex; gap: 8px; }
.confirm-btns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; background: rgba(255, 255, 255, .07); }
.confirm-btns .yes { background: var(--blush); color: var(--ink); }

/* ============================ MOBILE ============================ */
body.m #textbox {
  width: calc(100% - 20px - var(--safe-l) - var(--safe-r));
  bottom: calc(10px + var(--safe-b));
  min-height: 0; height: clamp(146px, 24vh, 184px);
  padding: 34px 20px 18px;
  border-radius: 18px;
}
body.m #nameplate { left: 16px; top: -16px; font-size: 13.5px; padding: 6px 16px 6px 14px; }
body.m #text { font-size: 15.5px; line-height: 1.72; }
body.m #textbox.big #text { font-size: 32px; line-height: 1.3; }
body.m #quick { top: 6px; right: 8px; gap: 0; }
body.m #quick button { padding: 5px 5px; font-size: 9.5px; letter-spacing: .08em; }
body.m #next { right: 18px; bottom: 14px; }
body.m #place { top: calc(12px + var(--safe-t)); left: calc(12px + var(--safe-l)); padding: 8px 14px 8px 12px; }
body.m #place b { font-size: 13px; }
body.m #intro { top: calc(96px + var(--safe-t)); gap: 12px; padding: 10px 18px 10px 10px; border-radius: 14px; }
body.m .intro-pic { width: 50px; height: 62px; border-radius: 10px; }
body.m .intro-name { font-size: 19px; margin-top: 5px; }
body.m .intro-role { font-size: 11.5px; }
body.m #portrait { left: 12px; bottom: calc(100% + 26px); width: 62px; height: 76px; border-radius: 12px; }
body.m #textbox.has-portrait { padding-left: 20px; }
body.m #textbox.has-portrait #nameplate { left: 16px; }
body.m #toasts { top: calc(12px + var(--safe-t)); right: calc(12px + var(--safe-r)); }
body.m #hud { top: calc(12px + var(--safe-t)); right: calc(12px + var(--safe-r)); gap: 6px; }
body.m .hud-item { padding: 5px 10px 5px 6px; gap: 6px; font-size: 11.5px; }
body.m .hud-heart { width: 18px; height: 18px; font-size: 10px; }
body.m .hud-bar { width: 54px; height: 5px; }
body.m .hud-stage { display: none; }
body.m:not(.no-hud) #toasts { top: calc(80px + var(--safe-t)); }
body.m .toast { font-size: 12px; padding: 7px 13px 7px 10px; }
body.m #choices { padding: 16px 14px calc(clamp(146px, 24vh, 184px) + 28px); }
body.m .choice { padding: 14px 16px; gap: 12px; }
body.m .slots { grid-template-columns: 1fr; }
body.m .menu-grid { grid-template-columns: repeat(2, 1fr); }
body.m .set-row { grid-template-columns: 1fr; }
body.m .set-row .hint { grid-column: 1; }
body.m .set-row.toggle { grid-template-columns: 1fr auto; }
body.m .modal-body { padding: 14px 18px 20px; }
body.m .vf .iso { display: none; }
body.m .sound-hint { bottom: calc(104px + var(--safe-b)); }

/* 가로로 눕힌 휴대폰 (높이가 낮은 화면) */
@media (max-height: 500px) and (orientation: landscape) {
  #textbox { min-height: 0; height: 36vh; padding: 26px 26px 14px; bottom: calc(8px + var(--safe-b)); }
  #text { font-size: 15px; line-height: 1.65; }
  #choices { padding-bottom: calc(36vh + 20px); }
  .choice { padding: 10px 16px; }
  .choice-list { gap: 8px; }
  .title-menu { margin-top: 18px; }
  .title-menu button { padding: 7px 20px; }
  .title-kicker { margin-bottom: 8px; }
  .title-foot { bottom: calc(26px + var(--safe-b)); }
}
@media (max-width: 360px) {
  body.m #quick button { font-size: 8.5px; padding: 5px 4px; letter-spacing: .04em; }
}
@media (prefers-reduced-motion: reduce) {
  .title-bg, .petals i { animation: none !important; }
}


/* =============================================================
 *  THEME · 밝은 학원물 (고등학교 버전)
 *  대사창: 반투명 흰 유리 · 화면 아래에서 조금 띄움
 * ============================================================= */
:root {
  --cute: 'Jua', var(--font);
  --tb-lift: 15vh;                          /* 대사창을 바닥에서 띄우는 높이 (가운데가 화면 2/3 지점쯤) */
  --tb-h: clamp(150px, 24vh, 200px);
}
#textbox {
  bottom: calc(var(--tb-lift) + var(--safe-b));
  min-height: var(--tb-h);
  background: linear-gradient(180deg, rgba(255, 255, 255, calc(var(--tb-alpha) * .62)), rgba(255, 250, 252, calc(var(--tb-alpha) * .78)));
  backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 2px solid rgba(255, 255, 255, .85);
  box-shadow: 0 14px 40px rgba(90, 110, 160, .22), inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent);
  border-radius: 22px;
}
#textbox::before { background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .9; top: -1px; }
#text { color: #2b2f45; text-shadow: none; font-weight: 500; }
#textbox.narr #text { color: #4a4f66; }
#textbox.whisper #text { color: #6b6f86; }
#textbox.msg #text { color: #6a4b12; }
#textbox.big #text { color: #2b2f45; text-shadow: 3px 3px 0 color-mix(in srgb, var(--c) 45%, #fff); font-family: var(--cute); font-weight: 400; }
#nameplate {
  background: var(--c); color: #fff;
  font-family: var(--cute); font-weight: 400; font-size: 18px; letter-spacing: .06em;
  padding: 6px 22px 6px 18px;
  border: 2px solid #fff;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 45%, transparent);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .12);
}
#textbox.msg #nameplate { background: #f5c65b; }
#next { border-color: var(--c); }
#quick button { color: rgba(43, 47, 69, .55); }
#quick button:hover { color: #2b2f45; background: rgba(43, 47, 69, .06); }
#quick button.active { color: #fff; background: var(--c); }
#portrait { border-color: #fff; box-shadow: 0 8px 20px rgba(90, 110, 160, .25), 0 0 0 2px var(--c); }

/* 장소 표시 · 호감도 · 소개 카드도 밝게 */
#place { background: linear-gradient(90deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .45)); color: #2b2f45; border-left-color: #7fb2e5; }
#place b { font-family: var(--cute); font-weight: 400; font-size: 17px; }
#place span { color: rgba(43, 47, 69, .62); }
.hud-item { background: linear-gradient(90deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6)); color: #2b2f45; border-color: #fff; box-shadow: 0 6px 18px rgba(90, 110, 160, .2); }
.hud-name { font-family: var(--cute); font-weight: 400; }
.hud-bar { background: rgba(43, 47, 69, .1); }
.hud-num { color: #2b2f45; }
.hud-stage { color: rgba(43, 47, 69, .55); }
.hud-pop { color: var(--c); text-shadow: 0 0 0 transparent, 0 2px 0 #fff; }
#intro { background: linear-gradient(100deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, .62)); color: #2b2f45; border-color: #fff; }
.intro-name { font-family: var(--cute); font-weight: 400; }
.intro-role { color: rgba(43, 47, 69, .66); }

/* 선택지 */
#choices {
  background: radial-gradient(70% 60% at 50% 45%, rgba(255, 255, 255, .15), rgba(120, 140, 190, .35));
  padding-bottom: calc(var(--tb-h) + var(--tb-lift) + 40px);
}
.choice-prompt { font-family: var(--cute); color: #fff; text-shadow: 0 2px 0 rgba(90, 110, 160, .55), 0 0 18px rgba(90, 110, 160, .5); }
.choice { background: rgba(255, 255, 255, .9); border: 2px solid #fff; box-shadow: 0 8px 22px rgba(90, 110, 160, .25); color: #2b2f45; }

/* 모바일 */
body.m { --tb-lift: 13vh; --tb-h: clamp(146px, 23vh, 180px); }
body.m #textbox { bottom: calc(var(--tb-lift) + var(--safe-b)); height: var(--tb-h); }
body.m #nameplate { font-size: 15.5px; padding: 5px 16px 5px 14px; }
body.m #choices { padding-bottom: calc(var(--tb-h) + var(--tb-lift) + 28px); }
@media (max-height: 500px) and (orientation: landscape) {
  :root { --tb-lift: 14px; --tb-h: 36vh; }
  #textbox { height: var(--tb-h); }
}
#speedlines { z-index: 15; }
#portrait, .intro-pic { background-color: #eef3fb; }

/* ---------- 큰 글씨 대사: 대화창 없이 화면 중앙 ---------- */
#game.bigline #textbox {
  top: 50%; bottom: auto; transform: translate(-50%, -50%);
  background: none; border-color: transparent; box-shadow: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  min-height: 0; height: auto; padding: 0; text-align: center;
}
#game.bigline #textbox::before, #game.bigline #nameplate, #game.bigline #quick, #game.bigline #next, #game.bigline #portrait { opacity: 0 !important; pointer-events: none; }
#game.bigline #text {
  display: inline-block;
  padding: clamp(46px, 7vw, 92px) clamp(70px, 10vw, 150px);
  background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' preserveAspectRatio='none'%3E%3Cpath d='M200 6 L222 52 L268 14 L268 64 L330 34 L310 84 L392 76 L338 116 L396 150 L326 160 L360 214 L294 186 L276 234 L238 190 L200 236 L170 192 L120 230 L118 184 L50 210 L80 160 L6 150 L66 116 L10 74 L88 82 L66 30 L134 62 L136 12 L176 52 Z' fill='%23fff' stroke='%23111' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E") center / 100% 100% no-repeat;
  filter: drop-shadow(10px 12px 0 #111);
  font-family: 'Dokdo', 'Black Han Sans', var(--cute); font-weight: 400;
  font-size: clamp(64px, 8.5vw, 130px); line-height: 1; letter-spacing: .02em;
  color: #111; -webkit-text-stroke: 0; text-shadow: none;
  animation: bigSlam .5s cubic-bezier(.2, 1.6, .4, 1);
}
#game.bigline #text .shown { animation: none; }
@keyframes bigSlam { 0% { transform: scale(2.2) rotate(-8deg); opacity: 0; } 55% { transform: scale(.92) rotate(2deg); opacity: 1; } 100% { transform: rotate(-3deg); } }
body.m #game.bigline #textbox { height: auto; }
body.m #game.bigline #text { font-size: 62px; padding: 44px 60px; filter: drop-shadow(6px 8px 0 #111); }

/* ---------- 타이틀 화면 · 밝은 학원물 ---------- */
.title-bg { background:
    radial-gradient(70% 55% at 80% 15%, rgba(255, 255, 255, .85), transparent 60%),
    radial-gradient(60% 50% at 10% 90%, rgba(255, 196, 220, .7), transparent 65%),
    linear-gradient(170deg, #bfe0ff 0%, #dcecff 38%, #ffe1ee 72%, #ffd0e2 100%);
  background-size: cover; background-position: center; }
.title-shade { background: linear-gradient(180deg, rgba(255, 255, 255, 0) 55%, rgba(255, 236, 244, .55) 100%); }
#title .vf { display: none; }
.title-kicker { font-family: var(--cute); letter-spacing: .2em; font-size: 15px; color: #ff6fa8; text-shadow: 0 2px 0 #fff; }
.title-logo { font-family: 'Black Han Sans', var(--cute); font-weight: 400; text-shadow: none; }
.title-logo .l1, .title-logo .l2 {
  color: #ff5f9e; -webkit-text-stroke: 12px #fff; paint-order: stroke fill;
  filter: drop-shadow(0 6px 0 #ffb3cf) drop-shadow(0 14px 22px rgba(255, 110, 160, .35));
}
.title-logo .l1 { font-size: clamp(40px, 6vw, 70px); color: #7aa8f0; transform: rotate(-4deg); }
.title-logo .l2 { font-size: clamp(64px, 11vw, 132px); margin-top: -.12em; }
.title-en { font-family: var(--cute); color: #7aa8f0; letter-spacing: .4em; font-size: 12px; }
.title-menu { gap: 10px; }
.title-menu button {
  min-width: 210px; padding: 11px 26px; border-radius: 999px;
  font-family: var(--cute); font-weight: 400; font-size: 17px; letter-spacing: .14em; text-indent: .14em;
  color: #ff5f9e; background: rgba(255, 255, 255, .88);
  border: 3px solid #ff9cc3; box-shadow: 0 4px 0 #ff9cc3;
  transition: transform .15s, box-shadow .15s, background .2s;
}
.title-menu button::before, .title-menu button::after { display: none; }
.title-menu button:hover:not(:disabled) { letter-spacing: .14em; transform: translateY(2px); box-shadow: 0 2px 0 #ff9cc3; background: #fff; color: #ff5f9e; }
.title-endings { color: #ff6fa8; }
.title-foot { color: rgba(90, 100, 140, .7); }
.sound-hint { color: #ff5f9e; background: rgba(255, 255, 255, .8); }
/* 화면 밖으로 삐져나간 효과 때문에 화면이 밀리지 않도록 */
#app, #game, #stage { overflow: clip; }
#speedlines { inset: 0; scale: 1.25; }

/* 비 (BACKGROUNDS 에 rain: true 인 배경) */
#stage::before {
  content: ''; position: absolute; inset: -20% 0 0; z-index: 2; pointer-events: none; opacity: 0;
  background-image:
    repeating-linear-gradient(104deg, transparent 0 26px, rgba(255, 255, 255, .38) 26px 27px, transparent 27px 61px),
    repeating-linear-gradient(98deg, transparent 0 40px, rgba(255, 255, 255, .22) 40px 41px, transparent 41px 87px);
  background-size: 100% 220px, 100% 300px;
  transition: opacity 1.2s ease;
}
#stage.raining::before { opacity: 1; animation: rain .45s linear infinite; }
@keyframes rain { to { background-position: -40px 220px, -50px 300px; } }

/* ---------- 엔딩 화면 · 밝게 ---------- */
#endcard { background: radial-gradient(80% 70% at 50% 40%, rgba(255, 255, 255, .78), rgba(236, 232, 248, .9)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #2b2f45; }
.ec-kicker { font-family: var(--cute); font-size: 14px; letter-spacing: .3em; color: #ff6fa8; }
.ec-title { font-family: 'Black Han Sans', var(--cute); font-weight: 400; font-size: clamp(36px, 6vw, 58px); color: #ff5f9e; -webkit-text-stroke: 8px #fff; paint-order: stroke fill; filter: drop-shadow(0 5px 0 #ffb3cf); }
.ec-text { font-family: var(--font); font-weight: 600; color: #4a4f66; }
.ec-next { color: rgba(43, 47, 69, .5); }
.ec-btn { font-family: var(--cute); font-weight: 400; font-size: 18px; color: #ff5f9e; background: #fff; border: 3px solid #ff9cc3; box-shadow: 0 4px 0 #ff9cc3; }
.ec-btn:hover { box-shadow: 0 2px 0 #ff9cc3; transform: translateY(2px); }
#endcard .stat { background: rgba(255, 255, 255, .85); border: 2px solid #fff; box-shadow: 0 6px 16px rgba(90, 110, 160, .15); }
#endcard .stat-top b { font-family: var(--cute); font-weight: 400; font-size: 17px; color: #2b2f45; }
#endcard .stat .bar { background: rgba(43, 47, 69, .1); }
#endcard .stat small { color: rgba(43, 47, 69, .55); }

/* ---------- 메뉴·로그·세이브·설정 창 · 밝게 ---------- */
.modal { background: rgba(120, 140, 190, .28); }
.modal-panel { background: linear-gradient(180deg, #ffffff, #fff6fa); border: 3px solid #fff; color: #2b2f45; box-shadow: 0 24px 60px rgba(90, 110, 160, .3), 0 0 0 2px #ffc3da; }
.modal-panel header { border-bottom-color: rgba(255, 150, 190, .25); }
.modal-panel h3 { font: 400 18px/1 var(--cute); letter-spacing: .2em; color: #ff5f9e; }
.modal-panel .x { color: rgba(43, 47, 69, .5); }
.modal-panel .x:hover { background: rgba(255, 95, 158, .1); color: #ff5f9e; }
.modal-body .empty-msg { color: rgba(43, 47, 69, .5); }
.log-line p { color: #2b2f45; }
.log-line.narr { border-left-color: rgba(43, 47, 69, .12); }
.log-line.narr p { color: #5d6178; }
.log-choice { background: #ffe1ee; color: #c2185b; }
.slot { background: #fff; border: 2px solid #ffe1ee; }
.slot:hover { background: #fff7fb; border-color: #ff9cc3; }
.slot-thumb { background-color: #e8eef8; }
.slot-info b { color: #ff5f9e; }
.slot-info p { color: #2b2f45; }
.slot-info p.none, .slot-info time { color: rgba(43, 47, 69, .45); }
.set-row { border-bottom-color: rgba(43, 47, 69, .08); }
.set-row .hint, .set-note { color: rgba(43, 47, 69, .5); }
.set-row input[type=range] { accent-color: #ff6fa8; }
.set-row.toggle i { background: rgba(43, 47, 69, .15); }
.set-row.toggle input:checked + i { background: #ff6fa8; }
.menu-grid button { background: #fff; border: 2px solid #ffe1ee; box-shadow: 0 3px 0 #ffd0e2; }
.menu-grid button:hover { background: #fff7fb; border-color: #ff9cc3; }
.menu-grid b { font: 400 16px/1 var(--cute); letter-spacing: .14em; color: #ff5f9e; }
.menu-grid span { color: rgba(43, 47, 69, .6); }
.status-ch { color: rgba(43, 47, 69, .55); }
.modal .stat { background: #fff; border: 2px solid #ffe1ee; }
.modal .stat-top b { color: #2b2f45; }
.modal .stat .bar { background: rgba(43, 47, 69, .1); }
.modal .stat small { color: rgba(43, 47, 69, .55); }
.confirm { background: rgba(120, 140, 190, .3); }
.confirm-panel { background: #fff; border: 3px solid #ffc3da; color: #2b2f45; box-shadow: 0 18px 44px rgba(90, 110, 160, .3); }
.confirm-btns button { background: #f1f3f8; color: #2b2f45; }
.confirm-btns .yes { background: #ff6fa8; color: #fff; }
.toast { background: rgba(255, 255, 255, .92); color: #2b2f45; border: 2px solid #fff; box-shadow: 0 6px 16px rgba(90, 110, 160, .2); }
.toast small { color: rgba(43, 47, 69, .6); }

/* ---------- 선택지 · 다음 표시 · 장소 표시 귀엽게 ---------- */
.choice { border-radius: 20px; border: 3px solid #fff; box-shadow: 0 5px 0 #ffc3da, 0 12px 26px rgba(90, 110, 160, .22); font-weight: 700; }
.choice em { font: 400 14px/1 var(--cute); color: #fff; background: #ff8fbb; width: 28px; height: 28px; padding: 0; border-radius: 50%; display: grid; place-items: center; letter-spacing: 0; }
@media (hover: hover) {
  .choice:hover { transform: translateY(-2px); background: #fff5fa; box-shadow: 0 7px 0 #ff9cc3, 0 14px 30px rgba(255, 110, 160, .25); }
}
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #ff9cc3; }
#next { width: auto; height: auto; border: 0; transform: none; color: var(--c); font-size: 15px; line-height: 1; }
#next::before { content: '♥'; }
#next.on { animation: heartbeat 1.1s ease-in-out infinite; }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }
#place { border-radius: 0 14px 14px 0; border-left-width: 4px; }

/* ---------- 챕터 카드 · 밝게 ---------- */
#card { background: radial-gradient(70% 60% at 50% 45%, #fff 0%, #ffeef6 55%, #e3ecff 100%); color: #2b2f45; }
.card-line { width: 60px; height: 0; background: none; border-top: 3px dotted #ff9cc3; margin-bottom: 18px; transition: height .6s var(--ease) .2s; }
#card.on .card-line { height: 3px; }
.card-kicker { font: 400 16px/1 var(--cute); letter-spacing: .3em; color: #7aa8f0; }
.card-title {
  font-family: 'Black Han Sans', var(--cute); font-weight: 400; font-size: clamp(44px, 7vw, 80px);
  color: #ff5f9e; -webkit-text-stroke: 10px #fff; paint-order: stroke fill;
  filter: drop-shadow(0 6px 0 #ffb3cf); letter-spacing: .04em;
}
#card.on .card-title { animation: cardPop .6s cubic-bezier(.2, 1.5, .4, 1) .45s both; }
@keyframes cardPop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.card-sub { color: rgba(43, 47, 69, .55); }
.card-title { -webkit-text-stroke: 0; filter: none; text-shadow: 0 4px 0 #ffd0e2; }
/* 좁은 폰: 장소 표시가 호감도 게이지와 겹치지 않게 */
body.m #place { max-width: calc(100vw - 196px - var(--safe-l) - var(--safe-r)); }
body.m #place b, body.m #place span { white-space: normal; word-break: keep-all; }
body.m #place span { font-size: 10px; }

/* ---------- 챕터 전환: 카드가 걷힐 때 이전 장면 대사창이 비치지 않게 ---------- */
#game.after-card #textbox { opacity: 0; pointer-events: none; }

/* ---------- 서류 흩날림 fx('papers') ---------- */
#stage .papers { position: absolute; inset: 0; z-index: 14; pointer-events: none; perspective: 900px; }
#stage .papers i {
  position: absolute; left: 0; top: 0; translate: -50% -50%;
  border-radius: 2px;
  background-color: #fffefb;
  background-image:
    linear-gradient(90deg, transparent 12%, rgba(255, 120, 150, .35) 12% 13%, transparent 13%),
    repeating-linear-gradient(180deg, transparent 0 14%, transparent 14% 22%, rgba(120, 140, 190, .3) 22% 23%);
  box-shadow: 0 3px 8px rgba(60, 70, 110, .22), inset 0 0 0 1px rgba(60, 70, 110, .08);
  will-change: transform, opacity;
  backface-visibility: visible;
}

/* ---------- 모바일: 긴 이름표(옆 반 남자애, ✉ 학생회…)가 AUTO 줄과 겹치지 않게 ---------- */
body.m #nameplate { top: -23px; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.m #quick { top: 13px; }
body.m #textbox { padding-top: 40px; }

/* ---------- 엔딩 큰 자막 caption() ---------- */
#caption {
  z-index: 52; text-align: center; padding: 30px; cursor: pointer; overflow: hidden;
  background:
    radial-gradient(60% 50% at 50% 50%, #fff 0%, color-mix(in srgb, var(--c) 18%, #fff) 60%, color-mix(in srgb, var(--c) 40%, #e3ecff) 100%);
}
#caption .cap-top {
  font-family: var(--cute); font-size: clamp(18px, 2.2vw, 26px); color: #4a4f66; letter-spacing: .08em;
  opacity: 0; transform: translateY(10px);
}
#caption .cap-big {
  margin: 14px 0 18px; max-width: 16em; word-break: keep-all; line-height: 1.15;
  font-family: 'Black Han Sans', var(--cute); font-weight: 400;
  font-size: clamp(38px, 6.4vw, 92px); color: color-mix(in srgb, var(--c) 55%, #e8336f);
  -webkit-text-stroke: 10px #fff; paint-order: stroke fill;
  filter: drop-shadow(0 6px 0 color-mix(in srgb, var(--c) 45%, #fff)) drop-shadow(0 18px 30px color-mix(in srgb, var(--c) 35%, transparent));
  opacity: 0;
}
#caption .cap-sub { font-family: var(--cute); font-size: clamp(15px, 1.6vw, 19px); color: rgba(43, 47, 69, .6); opacity: 0; }
#caption.on .cap-top { animation: capFade .7s ease .15s forwards; }
#caption.on .cap-big { animation: capSlam .7s cubic-bezier(.2, 1.6, .4, 1) .7s forwards; }
#caption.on .cap-sub { animation: capFade .8s ease 1.5s forwards; }
@keyframes capFade { to { opacity: 1; transform: none; } }
@keyframes capSlam { 0% { opacity: 0; transform: scale(2.4) rotate(-8deg); } 60% { opacity: 1; transform: scale(.94) rotate(1deg); } 100% { opacity: 1; transform: rotate(-2deg); } }
#caption .cap-heart { position: absolute; left: 0; top: 0; color: var(--c); pointer-events: none; text-shadow: 0 2px 0 #fff; }
body.m #caption .cap-big { -webkit-text-stroke: 7px #fff; }

/* ---------- 퀵 메뉴(AUTO·SKIP…): 글씨만 떠 있지 않게 알약 버튼으로 ---------- */
#quick { gap: 5px; }
#quick button {
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255, 255, 255, .72);
  border: 1.5px solid color-mix(in srgb, var(--c) 45%, #fff);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 30%, transparent);
  color: color-mix(in srgb, var(--c) 55%, #2b2f45);
  font-family: var(--cute); font-weight: 400; font-size: 11.5px; letter-spacing: .06em;
}
#quick button:hover { background: #fff; color: #2b2f45; transform: translateY(-1px); }
#quick button.active { background: var(--c); color: #fff; border-color: #fff; }
body.m #quick { gap: 3px; right: 10px; }
body.m #quick button { padding: 3px 6px; font-size: 10px; letter-spacing: .02em; border-width: 1px; }
@media (max-width: 360px) { body.m #quick button { padding: 3px 4px; font-size: 9px; } }

/* ---------- 대사를 대사창 세로 가운데에 ---------- */
#textbox { display: flex; flex-direction: column; justify-content: flex-start; padding-top: 56px; }
body.m #textbox { padding-top: 52px; }
#game.bigline #textbox { display: block; }

/* ---------- 큰 글씨: 말풍선 대신 쓰는 'pop' 스타일 ({ big: 'pop' }) ---------- */
#game.bigline.bigpop #text {
  background: none; filter: none; padding: 0 20px;
  font-family: 'Black Han Sans', var(--cute); font-size: clamp(54px, 7.4vw, 112px); line-height: 1.1;
  color: #ff2e93;
  -webkit-text-stroke: 12px #fff; paint-order: stroke fill;
  text-shadow: 0 6px 0 #ffb3d6;
  animation: popIn .55s cubic-bezier(.2, 1.7, .4, 1) both, popBoing 1.6s ease-in-out .6s infinite;
}
#game.bigline.bigpop #text::before, #game.bigline.bigpop #text::after {
  content: '✦'; position: absolute; font-size: .42em; -webkit-text-stroke: 0; text-shadow: none;
  color: #ffd166; animation: twinkle 1s ease-in-out infinite;
}
#game.bigline.bigpop #text { position: relative; }
#game.bigline.bigpop #text::before { left: -.3em; top: -.25em; }
#game.bigline.bigpop #text::after { right: -.3em; bottom: -.15em; color: #8fd3ff; animation-delay: .5s; }
@keyframes popIn { 0% { opacity: 0; transform: scale(.3) rotate(-10deg); } 70% { opacity: 1; transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(-2deg); } }
@keyframes popBoing { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.04) rotate(1deg); } }
@keyframes twinkle { 50% { opacity: .3; transform: scale(.7) rotate(20deg); } }
body.m #game.bigline.bigpop #text { font-size: 58px; padding: 0 14px; -webkit-text-stroke: 9px #fff; filter: none; }
/* 말풍선 큰 글씨도 붓글씨체 대신 굵은 고딕 */
#game.bigline:not(.bigpop) #text { font-family: 'Black Han Sans', var(--cute); font-size: clamp(50px, 6.4vw, 98px); }
body.m #game.bigline:not(.bigpop) #text { font-size: 46px; }

/* 인물 사진 아래쪽을 부드럽게 흐리게 (사진마다 허리 아래 잘린 위치가 달라도 티 안 나게) */
.char .face {
  -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 91%);
          mask-image: linear-gradient(to bottom, #000 70%, transparent 91%);
}

/* 세로 모바일: 대사창을 화면 아래쪽으로 내려서 인물이 덜 가리게 */
body.m.portrait { --tb-lift: 12px; }

/* 바나나우유 사진: 손에 든 우유가 흐려지지 않게 아래 흐림을 짧게 */
.char .face[data-face="banana"] {
  -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent 99%);
          mask-image: linear-gradient(to bottom, #000 90%, transparent 99%);
}

</style>

<body>

<script>/* ==== js/audio.js ==== */
/* =============================================================
 *  AUDIO — BGM · 효과음
 *
 *  음원 파일 없이도 브라우저 안에서 직접 연주되는 내장 BGM/효과음입니다.
 *  직접 고른 음원을 쓰고 싶으면 아래 AUDIO_FILES 에 경로를 적어 주세요.
 *  파일이 있으면 그 파일을, 없거나 못 불러오면 내장 사운드를 씁니다.
 *
 *  스토리에서:  bgm('daily')  bgm(null)  sfx('onair')
 * ============================================================= */
window.AUDIO_FILES = {
  bgm: {
    // title: 'assets/audio/bgm/title.mp3',
    // daily: 'assets/audio/bgm/daily.mp3',
    // heart: 'assets/audio/bgm/heart.mp3',
    // night: 'assets/audio/bgm/night.mp3',
  },
  sfx: {
    // select: 'assets/audio/sfx/select.mp3',
  },
};

(function () {
  'use strict';

  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, master, bgmBus, sfxBus, verb;
  let vol = { bgm: 0.55, sfx: 0.7 };
  const BOOST = { bgm: 2.4, sfx: 2.2 };   // 내장 사운드 음량 보정
  let current = null;          // { id, stop() }
  let wanted = null;           // 재생해야 할 BGM id (잠금 해제 전에도 기억)
  let unlocked = false;

  /* ---------- 기본 세팅 ---------- */
  function init() {
    if (ctx || !AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    bgmBus = ctx.createGain(); bgmBus.gain.value = vol.bgm * BOOST.bgm; bgmBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx * BOOST.sfx; sfxBus.connect(master);
    verb = makeReverb(2.6);
    const vg = ctx.createGain(); vg.gain.value = 0.32;
    verb.connect(vg); vg.connect(master);
  }

  function makeReverb(sec) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
    }
    const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
  }

  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s;
  }

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- 악기 ---------- */
  // 전자피아노
  function ep(dest, t, m, dur, v = 0.2, wet = 0.4) {
    const f = mtof(m);
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(v * 0.35, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.4, dur) + 0.6);
    [[1, 1], [2, 0.22], [3.01, 0.06]].forEach(([mul, amp]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + dur + 0.8);
    });
    lp.connect(g); g.connect(dest);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
  }

  // 오르골
  function bell(dest, t, m, v = 0.12, wet = 0.6, len = 1.6) {
    const f = mtof(m);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [[1, 1], [2.756, 0.18], [5.404, 0.07]].forEach(([mul, amp]) => {
      if (f * mul > 16000) return;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + len + 0.05);
    });
    g.connect(dest);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
  }

  // 패드
  function pad(dest, t, notes, dur, v = 0.05) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + Math.min(1.2, dur * 0.4));
    g.gain.setValueAtTime(v, t + dur * 0.8);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.6);
    notes.forEach((m) => [-6, 6].forEach((det) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.7);
    }));
    lp.connect(g); g.connect(dest);
    const w = ctx.createGain(); w.gain.value = 0.5; g.connect(w); w.connect(verb);
  }

  function bass(dest, t, m, dur, v = 0.16) {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(dest, t, v = 0.03) {
    const s = noise();
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(dest); s.start(t, Math.random()); s.stop(t + 0.06);
  }

  function kick(dest, t, v = 0.22) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.25);
  }

  // 통통 튀는 피아노 스타카토
  function pluck(dest, t, m, v = 0.06, len = 0.22) {
    const f = mtof(m);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(4200, t); lp.frequency.exponentialRampToValueAtTime(900, t + len);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [['triangle', 1, 1], ['sine', 2, 0.3]].forEach(([type, mul, amp]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + len + 0.05);
    });
    lp.connect(g); g.connect(dest);
  }

  // 박수
  function clap(dest, t, v = 0.09) {
    [0, 0.011, 0.023].forEach((d, i) => {
      const s = noise();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.9;
      const g = ctx.createGain();
      const len = i === 2 ? 0.14 : 0.02;
      g.gain.setValueAtTime(v, t + d); g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
      s.connect(bp); bp.connect(g); g.connect(dest); s.start(t + d, Math.random() * 0.5); s.stop(t + d + len + 0.02);
    });
  }

  /* ---------- 내장 BGM ----------
   * 코드 진행(MIDI) + 패턴. 8분음표 단위로 연주
   */
  const C = (root, ...iv) => [root, ...iv.map((x) => root + x)];
  const TRACKS = {
    // 타이틀 — 오르골 + 패드, 몽글몽글
    title: {
      bpm: 76, steps: 8,
      chords: [C(53, 4, 7, 11), C(52, 3, 7, 10), C(50, 3, 7, 10), C(48, 4, 7, 11)],
      mel: [[0, 3, 2], [4, 1], [], [6, 2, 1], [0, 2, 1], [4, 3], [], [7, 4]],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) pad(dest, t, ch.map((m) => m + 12), beat * 8, 0.035);
        if (step === 0) bass(dest, t, ch[0] - 12, beat * 6, 0.1);
        const arp = [0, 1, 2, 3, 2, 1, 2, 3];
        bell(dest, t, ch[arp[step]] + 24, 0.05, 0.6, 1.2);
        const mm = this.mel[(bar % 2) * 4 + Math.floor(step / 2)];
        if (step % 2 === 0 && mm && mm.length) bell(dest, t, ch[mm[0] % 4] + 24 + (mm[0] > 3 ? 12 : 0), 0.08, 0.7, 2.2);
      },
    },
    // 일상 — 산뜻한 학원물 (C–G–Am–F, 피아노 + 글로켄, 너무 튀지 않게)
    daily: {
      bpm: 108, steps: 8,
      chords: [C(48, 4, 7), C(43, 4, 7), C(45, 3, 7), C(41, 4, 7)],
      mel: [
        [72, null, 76, null, 77, 76, 74, null],
        [74, null, 71, null, 79, null, 74, null],
        [72, null, 76, null, 81, 79, 76, null],
        [77, null, 76, 74, 72, null, null, null],
        [79, null, 79, null, 81, 79, 76, null],
        [74, null, 74, 71, 67, null, null, null],
        [72, null, 76, 79, 81, null, 79, null],
        [77, null, 76, null, 74, null, 72, null],
      ],
      play(dest, t, bar, step, ch, beat) {
        const sec = bar % 16;                        // 16마디 한 바퀴: 앞 4마디는 반주만
        if (step === 0 || step === 4) kick(dest, t, 0.08);
        if (step % 2 === 1) hat(dest, t, 0.009);
        const r = ch[0] - 12;
        if (step === 0) bass(dest, t, r, beat * 2.6, 0.13);
        if (step === 4) bass(dest, t, r + 7, beat * 2.6, 0.1);
        if (step === 0 || step === 4) ch.forEach((m) => ep(dest, t, m + 12, beat * 1.8, 0.04, 0.35));
        if (step === 2 || step === 6) ch.forEach((m) => pluck(dest, t, m + 24, 0.018, 0.35));
        if (sec >= 4) {
          const n = this.mel[bar % 8][step];
          if (n) { bell(dest, t, n + 12, 0.05, 0.5, 1.2); ep(dest, t, n, beat * 1.5, 0.04, 0.4); }
        } else if (step === 0 || step === 3 || step === 6) bell(dest, t, ch[(step / 3) % 3] + 36, 0.03, 0.5, 0.9);
      },
    },
    // 설렘 — 로망 진행(F–G–Em–Am) 피아노 아르페지오 + 현악 패드 + 오르골 멜로디
    heart: {
      bpm: 78, steps: 8,
      chords: [C(53, 4, 7, 11), C(55, 4, 7, 10), C(52, 3, 7, 10), C(57, 3, 7, 10)],
      mel: [
        [81, null, null, 79, 77, null, 76, null],
        [74, null, null, 76, 77, null, 79, null],
        [79, null, 76, null, 74, null, 76, null],
        [72, null, null, 74, 76, null, null, null],
      ],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) { bass(dest, t, ch[0] - 12, beat * 7, 0.11); pad(dest, t, ch.slice(1).map((m) => m + 12), beat * 8, 0.022); }
        const arp = [0, 1, 2, 3, 2, 1, 2, 3];
        ep(dest, t, ch[arp[step]] + (step >= 4 ? 12 : 0), beat * 1.6, 0.05, 0.45);
        if (bar % 8 >= 2) {
          const n = this.mel[bar % 4][step];
          if (n) { bell(dest, t, n + 12, 0.055, 0.7, 2.2); ep(dest, t, n, beat * 2, 0.05, 0.5); }
        }
      },
    },
    // 밤 — 느린 패드 + 띄엄띄엄 피아노
    night: {
      bpm: 64, steps: 8,
      chords: [C(45, 3, 7, 10, 14), C(41, 4, 7, 11), C(48, 4, 7, 11), C(43, 4, 7, 9)],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) { pad(dest, t, ch.slice(1, 4).map((m) => m + 12), beat * 8, 0.04); bass(dest, t, ch[0] - 12, beat * 7, 0.09); }
        if (step === 0 || step === 3 || step === 6) ep(dest, t, ch[(step / 3 + bar) % ch.length] + 24, beat * 2, 0.05, 0.6);
        if (step === 4 && bar % 2) bell(dest, t, ch[2] + 36, 0.03, 0.8, 2.5);
      },
    },
  };

  function playSynth(id) {
    const tr = TRACKS[id];
    if (!tr) return null;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, ctx.currentTime);
    out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.4);
    out.connect(bgmBus);
    const beat = 60 / tr.bpm / 2;        // 8분음표 길이
    let next = ctx.currentTime + 0.12, step = 0, bar = 0, alive = true;
    const timer = setInterval(() => {
      if (!alive) return;
      while (next < ctx.currentTime + 0.25) {
        const ch = tr.chords[bar % tr.chords.length];
        try { tr.play(out, next, bar, step, ch, beat); } catch (e) { console.warn(e); }
        next += beat;
        if (++step >= tr.steps) { step = 0; bar++; }
      }
    }, 40);
    return {
      id,
      stop(fade = 1.2) {
        alive = false; clearInterval(timer);
        const n = ctx.currentTime;
        out.gain.cancelScheduledValues(n);
        out.gain.setValueAtTime(out.gain.value, n);
        out.gain.linearRampToValueAtTime(0.0001, n + fade);
        setTimeout(() => out.disconnect(), (fade + 2) * 1000);
      },
    };
  }

  function playFile(id, url) {
    const el = new Audio(url);
    el.loop = true; el.volume = 0;
    let alive = true, failed = false;
    const target = () => vol.bgm;
    el.addEventListener('error', () => {
      failed = true;
      if (alive && current && current.id === id) { current = playSynth(id); }
    });
    el.play().catch(() => {});
    let v = 0;
    const fadeIn = setInterval(() => { v = Math.min(target(), v + 0.04); el.volume = v; if (v >= target()) clearInterval(fadeIn); }, 50);
    return {
      id, el,
      stop() {
        alive = false; clearInterval(fadeIn);
        if (failed) return;
        const fo = setInterval(() => { el.volume = Math.max(0, el.volume - 0.05); if (el.volume <= 0) { clearInterval(fo); el.pause(); } }, 50);
      },
    };
  }

  function startBgm(id) {
    if (current && current.id === id) return;
    if (current) { current.stop(); current = null; }
    if (!id || !ctx) return;
    const file = window.AUDIO_FILES.bgm[id];
    current = file ? playFile(id, file) : playSynth(id);
  }

  /* ---------- 효과음 ---------- */
  const SFX = {
    next(t) { // 대사 넘김
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.04);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.07);
    },
    hover(t) { bell(sfxBus, t, 93, 0.025, 0.1, 0.25); },
    choice(t) { bell(sfxBus, t, 88, 0.07, 0.5, 1.2); bell(sfxBus, t + 0.09, 95, 0.06, 0.5, 1.4); },
    select(t) { [84, 88, 91, 96].forEach((m, i) => bell(sfxBus, t + i * 0.055, m, 0.08, 0.5, 1)); },
    scene(t) {
      const s = noise();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.5);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.2); g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      s.connect(bp); bp.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + 0.65);
    },
    card(t) { [72, 76, 79, 83].forEach((m) => bell(sfxBus, t, m, 0.05, 0.8, 3)); bell(sfxBus, t + 0.3, 88, 0.05, 0.8, 3); },
    aff(t) { [91, 95, 98, 103].forEach((m, i) => bell(sfxBus, t + i * 0.04, m, 0.04, 0.6, 0.8)); },
    save(t) { bell(sfxBus, t, 86, 0.08, 0.4, 0.8); bell(sfxBus, t + 0.1, 93, 0.08, 0.4, 1); },
    open(t) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.06);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.12);
    },
    msg(t) { bell(sfxBus, t, 88, 0.07, 0.2, 0.4); bell(sfxBus, t + 0.12, 91, 0.07, 0.2, 0.6); },
    onair(t) { [77, 81, 84, 89].forEach((m, i) => ep(sfxBus, t + i * 0.32, m, 0.9, 0.12, 0.5)); },
    thud(t) { // 쿵
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.28);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.45);
      const s = noise(); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      s.connect(lp); lp.connect(g2); g2.connect(sfxBus); s.start(t); s.stop(t + 0.18);
    },
    papers(t) { // 종이 흩날리는 소리: 휙 + 팔랑팔랑
      const w = noise();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.35);
      const wg = ctx.createGain(); wg.gain.setValueAtTime(0.0001, t);
      wg.gain.linearRampToValueAtTime(0.36, t + 0.12); wg.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      w.connect(bp); bp.connect(wg); wg.connect(sfxBus); w.start(t, Math.random() * 0.3); w.stop(t + 0.6);
      for (let i = 0; i < 22; i++) {
        const st = t + 0.08 + i * 0.075 + Math.random() * 0.06;
        const s = noise();
        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 3200; f.Q.value = 1.4;
        const g = ctx.createGain(); const len = 0.04 + Math.random() * 0.09;
        const v = 0.26 * (1 - i / 26) * (0.5 + Math.random() * 0.5);
        g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(v, st + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, st + len);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(st, Math.random() * 0.8); s.stop(st + len + 0.02);
      }
    },
    hop(t) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.13);
    },
  };

  const sfxCache = {};
  function sfx(name) {
    if (!ctx || !unlocked || vol.sfx <= 0) return;
    const file = window.AUDIO_FILES.sfx[name];
    if (file && sfxCache[name] !== false) {
      const a = sfxCache[name] || (sfxCache[name] = new Audio(file));
      a.addEventListener('error', () => { sfxCache[name] = false; }, { once: true });
      try { a.currentTime = 0; a.volume = vol.sfx; a.play().catch(() => {}); return; } catch { /* fall through */ }
    }
    const fn = SFX[name];
    if (fn) try { fn(ctx.currentTime + 0.01); } catch (e) { console.warn(e); }
  }

  /* ---------- 환경음 (비) ---------- */
  let amb = null, ambWanted = null;
  function startAmbient(id) {
    if (amb && amb.id === id) return;
    if (amb) { amb.stop(); amb = null; }
    if (!id || !ctx) return;
    if (id !== 'rain') return;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, ctx.currentTime);
    out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.5);
    out.connect(sfxBus);
    // 쏴아 — 넓은 빗소리
    const s1 = noise(); s1.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const g1 = ctx.createGain(); g1.gain.value = 0.085;
    s1.connect(hp); hp.connect(lp); lp.connect(g1); g1.connect(out); s1.start();
    // 웅 — 낮은 빗소리
    const s2 = noise(); s2.loop = true;
    const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 380;
    const g2 = ctx.createGain(); g2.gain.value = 0.11;
    s2.connect(lp2); lp2.connect(g2); g2.connect(out); s2.start(0, 0.37);
    // 톡톡 — 처마·우산에 떨어지는 빗방울
    const drops = setInterval(() => {
      const n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const t = ctx.currentTime + Math.random() * 0.1;
        const d = noise();
        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200 + Math.random() * 4500; f.Q.value = 4;
        const g = ctx.createGain(); const v = 0.03 + Math.random() * 0.06;
        g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        d.connect(f); f.connect(g); g.connect(out); d.start(t, Math.random() * 0.9); d.stop(t + 0.04);
      }
    }, 100);
    amb = {
      id,
      stop() {
        clearInterval(drops);
        const n = ctx.currentTime;
        out.gain.cancelScheduledValues(n); out.gain.setValueAtTime(out.gain.value, n);
        out.gain.linearRampToValueAtTime(0.0001, n + 1.2);
        setTimeout(() => { try { s1.stop(); s2.stop(); } catch { /* ignore */ } out.disconnect(); }, 1500);
      },
    };
  }

  /* ---------- 공개 API ---------- */
  window.SOUND = {
    unlock() {
      if (!AC) return;
      init();
      if (ctx.state === 'suspended') ctx.resume();
      if (!unlocked) { unlocked = true; if (wanted) startBgm(wanted); if (ambWanted) startAmbient(ambWanted); }
    },
    /** 환경음: 'rain' | null */
    ambient(id) { ambWanted = id || null; if (unlocked) startAmbient(ambWanted); },
    bgm(id) { wanted = id || null; if (unlocked) startBgm(wanted); },
    get bgmId() { return wanted; },
    sfx,
    setVolume(kind, v) {
      vol[kind] = v;
      if (!ctx) return;
      if (kind === 'bgm') { bgmBus.gain.value = v * BOOST.bgm; if (current && current.el) current.el.volume = v; }
      if (kind === 'sfx') sfxBus.gain.value = v * BOOST.sfx;
    },
