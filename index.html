<script>/* ==== js/audio.js ==== */
/* =============================================================
 *  AUDIO — BGM · 효과음
 *
 *  음원 파일 없이도 브라우저 안에서 직접 연주되는 내장 BGM/효과음입니다.
 *  직접 고른 음원을 쓰고 싶으면 아래 AUDIO_FILES 에 경로를 적어 주세요.
 *  파일이 있으면 그 파일을, 없거나 못 불러오면 내장 사운드를 씁니다.
 *
 *  스토리에서:  bgm('daily')  bgm(null)  sfx('onair')
 * ============================================================= */
window.AUDIO_FILES = {
  bgm: {
    // title: 'assets/audio/bgm/title.mp3',
    // daily: 'assets/audio/bgm/daily.mp3',
    // heart: 'assets/audio/bgm/heart.mp3',
    // night: 'assets/audio/bgm/night.mp3',
  },
  sfx: {
    // select: 'assets/audio/sfx/select.mp3',
  },
};

(function () {
  'use strict';

  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, master, bgmBus, sfxBus, verb;
  let vol = { bgm: 0.55, sfx: 0.7 };
  const BOOST = { bgm: 2.4, sfx: 2.2 };   // 내장 사운드 음량 보정
  let current = null;          // { id, stop() }
  let wanted = null;           // 재생해야 할 BGM id (잠금 해제 전에도 기억)
  let unlocked = false;

  /* ---------- 기본 세팅 ---------- */
  function init() {
    if (ctx || !AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    bgmBus = ctx.createGain(); bgmBus.gain.value = vol.bgm * BOOST.bgm; bgmBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx * BOOST.sfx; sfxBus.connect(master);
    verb = makeReverb(2.6);
    const vg = ctx.createGain(); vg.gain.value = 0.32;
    verb.connect(vg); vg.connect(master);
  }

  function makeReverb(sec) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
    }
    const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
  }

  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s;
  }

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- 악기 ---------- */
  // 전자피아노
  function ep(dest, t, m, dur, v = 0.2, wet = 0.4) {
    const f = mtof(m);
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(v * 0.35, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.4, dur) + 0.6);
    [[1, 1], [2, 0.22], [3.01, 0.06]].forEach(([mul, amp]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + dur + 0.8);
    });
    lp.connect(g); g.connect(dest);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
  }

  // 오르골
  function bell(dest, t, m, v = 0.12, wet = 0.6, len = 1.6) {
    const f = mtof(m);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [[1, 1], [2.756, 0.18], [5.404, 0.07]].forEach(([mul, amp]) => {
      if (f * mul > 16000) return;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + len + 0.05);
    });
    g.connect(dest);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
  }

  // 패드
  function pad(dest, t, notes, dur, v = 0.05) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + Math.min(1.2, dur * 0.4));
    g.gain.setValueAtTime(v, t + dur * 0.8);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.6);
    notes.forEach((m) => [-6, 6].forEach((det) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.7);
    }));
    lp.connect(g); g.connect(dest);
    const w = ctx.createGain(); w.gain.value = 0.5; g.connect(w); w.connect(verb);
  }

  function bass(dest, t, m, dur, v = 0.16) {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(dest, t, v = 0.03) {
    const s = noise();
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(dest); s.start(t, Math.random()); s.stop(t + 0.06);
  }

  function kick(dest, t, v = 0.22) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.25);
  }

  /* ---------- 내장 BGM ----------
   * 코드 진행(MIDI) + 패턴. 8분음표 단위로 연주
   */
  const C = (root, ...iv) => [root, ...iv.map((x) => root + x)];
  const TRACKS = {
    // 타이틀 — 오르골 + 패드, 몽글몽글
    title: {
      bpm: 76, steps: 8,
      chords: [C(53, 4, 7, 11), C(52, 3, 7, 10), C(50, 3, 7, 10), C(48, 4, 7, 11)],
      mel: [[0, 3, 2], [4, 1], [], [6, 2, 1], [0, 2, 1], [4, 3], [], [7, 4]],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) pad(dest, t, ch.map((m) => m + 12), beat * 8, 0.035);
        if (step === 0) bass(dest, t, ch[0] - 12, beat * 6, 0.1);
        const arp = [0, 1, 2, 3, 2, 1, 2, 3];
        bell(dest, t, ch[arp[step]] + 24, 0.05, 0.6, 1.2);
        const mm = this.mel[(bar % 2) * 4 + Math.floor(step / 2)];
        if (step % 2 === 0 && mm && mm.length) bell(dest, t, ch[mm[0] % 4] + 24 + (mm[0] > 3 ? 12 : 0), 0.08, 0.7, 2.2);
      },
    },
    // 일상 — 가벼운 로파이 피아노
    daily: {
      bpm: 92, steps: 8,
      chords: [C(48, 4, 7, 11), C(47, 3, 8, 10), C(45, 3, 7, 10), C(53, 4, 7, 11)],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0 || step === 5) kick(dest, t, 0.14);
        if (step % 2 === 1) hat(dest, t, 0.018); else hat(dest, t, 0.01);
        if (step === 0) bass(dest, t, ch[0] - 12, beat * 1.8, 0.14);
        if (step === 3) bass(dest, t, ch[0] - 12 + 7, beat * 0.9, 0.1);
        if (step === 6) bass(dest, t, ch[0] - 12, beat * 0.9, 0.1);
        if (step === 2 || step === 6) ch.slice(1).forEach((m) => ep(dest, t, m + 12, beat * 1.2, 0.05, 0.25));
        const melody = [
          [76, null, 74, 72, null, 74, 76, null],
          [74, null, 72, 71, null, 72, 74, null],
          [72, null, 74, 76, null, 79, 76, null],
          [77, null, 76, 74, null, null, 72, null],
        ];
        if (bar % 8 >= 4) {
          const n = melody[bar % 4][step];
          if (n) ep(dest, t, n, beat * 0.9, 0.07, 0.35);
        }
      },
    },
    // 설렘 — 아르페지오 피아노 + 오르골
    heart: {
      bpm: 82, steps: 8,
      chords: [C(53, 4, 7, 11), C(55, 4, 7, 9), C(52, 3, 7, 10), C(45, 3, 7, 10)],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) { bass(dest, t, ch[0] - 12, beat * 3.8, 0.12); pad(dest, t, ch, beat * 8, 0.025); }
        const arp = [0, 2, 3, 1, 2, 3, 1, 2];
        ep(dest, t, ch[arp[step]] + 12, beat * 0.9, 0.06, 0.4);
        const mel = [[79, 0], [81, 3], [79, 6], [76, 0], [77, 3], [76, 6], [72, 0], [74, 4]];
        mel.forEach(([n, s], i) => { if (Math.floor(i / 2) === bar % 4 && s === step) bell(dest, t, n, 0.06, 0.7, 2); });
      },
    },
    // 밤 — 느린 패드 + 띄엄띄엄 피아노
    night: {
      bpm: 64, steps: 8,
      chords: [C(45, 3, 7, 10, 14), C(41, 4, 7, 11), C(48, 4, 7, 11), C(43, 4, 7, 9)],
      play(dest, t, bar, step, ch, beat) {
        if (step === 0) { pad(dest, t, ch.slice(1, 4).map((m) => m + 12), beat * 8, 0.04); bass(dest, t, ch[0] - 12, beat * 7, 0.09); }
        if (step === 0 || step === 3 || step === 6) ep(dest, t, ch[(step / 3 + bar) % ch.length] + 24, beat * 2, 0.05, 0.6);
        if (step === 4 && bar % 2) bell(dest, t, ch[2] + 36, 0.03, 0.8, 2.5);
      },
    },
  };

  function playSynth(id) {
    const tr = TRACKS[id];
    if (!tr) return null;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, ctx.currentTime);
    out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.4);
    out.connect(bgmBus);
    const beat = 60 / tr.bpm / 2;        // 8분음표 길이
    let next = ctx.currentTime + 0.12, step = 0, bar = 0, alive = true;
    const timer = setInterval(() => {
      if (!alive) return;
      while (next < ctx.currentTime + 0.25) {
        const ch = tr.chords[bar % tr.chords.length];
        try { tr.play(out, next, bar, step, ch, beat); } catch (e) { console.warn(e); }
        next += beat;
        if (++step >= tr.steps) { step = 0; bar++; }
      }
    }, 40);
    return {
      id,
      stop(fade = 1.2) {
        alive = false; clearInterval(timer);
        const n = ctx.currentTime;
        out.gain.cancelScheduledValues(n);
        out.gain.setValueAtTime(out.gain.value, n);
        out.gain.linearRampToValueAtTime(0.0001, n + fade);
        setTimeout(() => out.disconnect(), (fade + 2) * 1000);
      },
    };
  }

  function playFile(id, url) {
    const el = new Audio(url);
    el.loop = true; el.volume = 0;
    let alive = true, failed = false;
    const target = () => vol.bgm;
    el.addEventListener('error', () => {
      failed = true;
      if (alive && current && current.id === id) { current = playSynth(id); }
    });
    el.play().catch(() => {});
    let v = 0;
    const fadeIn = setInterval(() => { v = Math.min(target(), v + 0.04); el.volume = v; if (v >= target()) clearInterval(fadeIn); }, 50);
    return {
      id, el,
      stop() {
        alive = false; clearInterval(fadeIn);
        if (failed) return;
        const fo = setInterval(() => { el.volume = Math.max(0, el.volume - 0.05); if (el.volume <= 0) { clearInterval(fo); el.pause(); } }, 50);
      },
    };
  }

  function startBgm(id) {
    if (current && current.id === id) return;
    if (current) { current.stop(); current = null; }
    if (!id || !ctx) return;
    const file = window.AUDIO_FILES.bgm[id];
    current = file ? playFile(id, file) : playSynth(id);
  }

  /* ---------- 효과음 ---------- */
  const SFX = {
    next(t) { // 대사 넘김
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.04);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.07);
    },
    hover(t) { bell(sfxBus, t, 93, 0.025, 0.1, 0.25); },
    choice(t) { bell(sfxBus, t, 88, 0.07, 0.5, 1.2); bell(sfxBus, t + 0.09, 95, 0.06, 0.5, 1.4); },
    select(t) { [84, 88, 91, 96].forEach((m, i) => bell(sfxBus, t + i * 0.055, m, 0.08, 0.5, 1)); },
    scene(t) {
      const s = noise();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.5);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.2); g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      s.connect(bp); bp.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + 0.65);
    },
    card(t) { [72, 76, 79, 83].forEach((m) => bell(sfxBus, t, m, 0.05, 0.8, 3)); bell(sfxBus, t + 0.3, 88, 0.05, 0.8, 3); },
    aff(t) { [91, 95, 98, 103].forEach((m, i) => bell(sfxBus, t + i * 0.04, m, 0.04, 0.6, 0.8)); },
    save(t) { bell(sfxBus, t, 86, 0.08, 0.4, 0.8); bell(sfxBus, t + 0.1, 93, 0.08, 0.4, 1); },
    open(t) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.06);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.12);
    },
    msg(t) { bell(sfxBus, t, 88, 0.07, 0.2, 0.4); bell(sfxBus, t + 0.12, 91, 0.07, 0.2, 0.6); },
    onair(t) { [77, 81, 84, 89].forEach((m, i) => ep(sfxBus, t + i * 0.32, m, 0.9, 0.12, 0.5)); },
    hop(t) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.13);
    },
  };

  const sfxCache = {};
  function sfx(name) {
    if (!ctx || !unlocked || vol.sfx <= 0) return;
    const file = window.AUDIO_FILES.sfx[name];
    if (file && sfxCache[name] !== false) {
      const a = sfxCache[name] || (sfxCache[name] = new Audio(file));
      a.addEventListener('error', () => { sfxCache[name] = false; }, { once: true });
      try { a.currentTime = 0; a.volume = vol.sfx; a.play().catch(() => {}); return; } catch { /* fall through */ }
    }
    const fn = SFX[name];
    if (fn) try { fn(ctx.currentTime + 0.01); } catch (e) { console.warn(e); }
  }

  /* ---------- 공개 API ---------- */
  window.SOUND = {
    unlock() {
      if (!AC) return;
      init();
      if (ctx.state === 'suspended') ctx.resume();
      if (!unlocked) { unlocked = true; if (wanted) startBgm(wanted); }
    },
    bgm(id) { wanted = id || null; if (unlocked) startBgm(wanted); },
    get bgmId() { return wanted; },
    sfx,
    setVolume(kind, v) {
      vol[kind] = v;
      if (!ctx) return;
      if (kind === 'bgm') { bgmBus.gain.value = v * BOOST.bgm; if (current && current.el) current.el.volume = v; }
      if (kind === 'sfx') sfxBus.gain.value = v * BOOST.sfx;
    },
    tracks: Object.keys(TRACKS),
    /** 개발용: 곡/효과음을 오프라인으로 렌더링해서 { peak, rms } 반환 */
    async _probe(kind, id, sec = 8) {
      const saved = [ctx, master, bgmBus, sfxBus, verb, noiseBuf, unlocked];
      ctx = new OfflineAudioContext(2, 44100 * sec, 44100);
      noiseBuf = null;
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      bgmBus = ctx.createGain(); bgmBus.gain.value = vol.bgm * BOOST.bgm; bgmBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx * BOOST.sfx; sfxBus.connect(master);
      verb = makeReverb(2.6); const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
      if (kind === 'bgm') {
        const tr = TRACKS[id]; const beat = 60 / tr.bpm / 2;
        let t = 0.05, step = 0, bar = 0;
        while (t < sec - 0.5) { tr.play(bgmBus, t, bar, step, tr.chords[bar % tr.chords.length], beat); t += beat; if (++step >= tr.steps) { step = 0; bar++; } }
      } else { SFX[id](0.05); }
      const buf = await ctx.startRendering();
      [ctx, master, bgmBus, sfxBus, verb, noiseBuf, unlocked] = saved;
      const d = buf.getChannelData(0); let peak = 0, sum = 0;
      for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += d[i] * d[i]; }
      return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / d.length).toFixed(4) };
    },
  };

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (unlocked) ctx.resume();
  });
})();

</script>
<script>/* ==== js/engine.js ==== */
/* =============================================================
 *  VN ENGINE
 *  스토리 내용은 하나도 들어 있지 않은 범용 엔진입니다.
 *  스토리는 js/story/*.js 에서 VN.label(이름, [명령...]) 으로 등록합니다.
 * ============================================================= */
(function () {
  'use strict';

  const CFG = window.GAME_CONFIG;
  const CHARS = window.CHARACTERS;
  const BGS = window.BACKGROUNDS;
  const POS = window.POSITIONS;
  const FACE_LABEL = window.FACE_LABELS || {};

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BLOCK = 'BLOCK';
  const JUMPED = 'JUMPED';

  /* ===========================================================
   *  1. 스토리 등록 & 컴파일
   *  when()/choice()의 중첩 블록을 하위 라벨로 펼쳐서
   *  세이브 데이터가 "라벨 + 인덱스"만으로 위치를 기억할 수 있게 함
   * =========================================================== */
  const LABELS = {};

  function compile(name, list) {
    if (!Array.isArray(list)) throw new Error(`[${name}] 명령 목록은 배열이어야 합니다`);
    return list.map((c, i) => {
      if (!c || typeof c !== 'object') throw new Error(`[${name}] ${i}번째 명령이 비어 있어요 (쉼표를 확인하세요)`);
      if ('if' in c) {
        const t = `${name}/${i}/then`;
        defineLabel(t, [...(c.then || []), { ret: true }]);
        let e = null;
        if (c.else && c.else.length) {
          e = `${name}/${i}/else`;
          defineLabel(e, [...c.else, { ret: true }]);
        }
        return { type: 'if', cond: c.if, t, e };
      }
      if (c.type === 'choice') {
        return {
          ...c,
          choice: c.choice.map((o, k) => {
            const opt = { ...o, sub: null };
            if (o.then && o.then.length) {
              opt.sub = `${name}/${i}/opt${k}`;
              defineLabel(opt.sub, [...o.then, o.jump ? { type: 'jump', to: o.jump } : { ret: true }]);
              opt.jump = null;
            }
            delete opt.then;
            return opt;
          }),
        };
      }
      return c;
    });
  }

  function defineLabel(name, list) {
    if (LABELS[name]) console.warn(`[VN] 라벨 "${name}"이(가) 다시 정의되었습니다`);
    LABELS[name] = compile(name, list);
  }

  /* ===========================================================
   *  2. 스토리 작성용 DSL
   * =========================================================== */
  const dsl = {
    /** 대사. face는 null이면 표정 유지. opts: {hop, whisper, msg, as} */
    say: (who, face, text, opts = {}) => ({ type: 'say', who, face, text, ...opts }),
    /** 내레이션 */
    narr: (text, opts = {}) => ({ type: 'say', who: null, text, ...opts }),
    /** 등장. opts: {from:'left'|'right', look:'left'|'right'|'front'} */
    show: (who, pos = 'center', face = 'normal', opts = {}) => ({ type: 'show', who, pos, face, ...opts }),
    hide: (who) => ({ type: 'hide', who }),
    hideAll: () => ({ type: 'hideAll' }),
    move: (who, pos) => ({ type: 'move', who, pos }),
    face: (who, face) => ({ type: 'face', who, face }),
    look: (who, dir) => ({ type: 'look', who, dir }),
    /** 배경 전환. fade: 'cross' | 'black' | 'none'.  black은 기본적으로 인물도 정리 (opts.keep으로 유지) */
    bg: (id, fade = 'cross', opts = {}) => ({ type: 'bg', id, fade, ...opts }),
    place: (where, when) => ({ type: 'place', where, when }),
    chapter: (kicker, title, sub) => ({ type: 'chapter', kicker, title, sub }),
    /** 선택지. options: [{text, aff, set, then, jump, if}] */
    choice: (prompt, options) => ({ type: 'choice', prompt, choice: options }),
    /** 조건 분기 */
    when: (cond, then, otherwise) => ({ if: cond, then, else: otherwise }),
    aff: (o) => ({ type: 'aff', o }),
    set: (o) => ({ type: 'set', o }),
    jump: (to) => ({ type: 'jump', to }),
    wait: (ms) => ({ type: 'wait', ms }),
    fx: (name, who) => ({ type: 'fx', name, who }),
    endcard: (o) => ({ type: 'endcard', ...o }),
    call: (fn) => ({ type: 'call', fn }),
    /** 배경음악. id: 'title' | 'daily' | 'heart' | 'night' | null(정지) */
    bgm: (id) => ({ type: 'bgm', id }),
    /** 효과음. 'onair' 'msg' 'hop' 'choice' 'select' 'scene' 'card' 'aff' 'save' */
    sfx: (name) => ({ type: 'sfx', name }),
  };

  const SND = window.SOUND || { bgm() {}, sfx() {}, unlock() {}, setVolume() {} };
  const sfx = (n) => SND.sfx(n);

  /* ===========================================================
   *  3. 저장소 & 설정
   * =========================================================== */
  const KEY = CFG.saveKey || 'vn';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(`${KEY}:${k}`)); } catch { return null; } },
    set(k, v) {
      try { localStorage.setItem(`${KEY}:${k}`, JSON.stringify(v)); return true; }
      catch { toast('저장 공간이 부족하거나 저장이 막혀 있어요'); return false; }
    },
  };

  const DEFAULT_SETTINGS = { textSpeed: 26, autoDelay: 1300, affToast: true, boxAlpha: 0.84, bgmVol: 0.55, sfxVol: 0.7, nextSfx: true };
  let settings = { ...DEFAULT_SETTINGS, ...(store.get('settings') || {}) };

  function applySettings() {
    document.documentElement.style.setProperty('--tb-alpha', settings.boxAlpha);
    SND.setVolume('bgm', settings.bgmVol);
    SND.setVolume('sfx', settings.sfxVol);
    store.set('settings', settings);
  }

  /* ===========================================================
   *  4. 게임 상태
   * =========================================================== */
  function freshState() {
    const aff = {};
    Object.entries(CHARS).forEach(([id, c]) => { if (c.heroine) aff[id] = c.startAffection || 0; });
    return {
      label: CFG.startLabel, index: 0, stack: [],
      aff, flags: {}, bg: null, bgm: null, stage: {}, speaker: null,
      chapter: '', line: '', log: [],
    };
  }

  let S = freshState();
  let running = false, runId = 0;
  let waiting = null;            // 'say' | 'choice' | 'card' | 'end'
  let typing = null;
  let auto = false, skip = false;
  let autoTimer = 0, cardTimer = 0, placeTimer = 0;
  let modalOpen = false, uiHidden = false;
  let suppressLogOnce = false;

  const evalFn = (v) => (typeof v === 'function' ? v(S) : v);
  const isMobile = () => document.body.classList.contains('m');
  const skipping = () => skip;

  /* ===========================================================
   *  5. 실행 루프
   * =========================================================== */
  function popFrame() {
    const f = S.stack.pop();
    S.label = f.label; S.index = f.index;
  }

  function current() {
    for (;;) {
      const list = LABELS[S.label];
      if (!list) throw new Error(`라벨을 찾을 수 없어요: "${S.label}"`);
      if (S.index >= list.length) {
        if (S.stack.length) { popFrame(); continue; }
        return null;
      }
      const c = list[S.index];
      if (c.ret) {
        if (S.stack.length) popFrame(); else S.index++;
        continue;
      }
      return c;
    }
  }

  async function run() {
    if (running) return;
    running = true;
    const my = ++runId;
    try {
      for (let guard = 0; guard < 10000; guard++) {
        if (my !== runId) return;
        const cmd = current();
        if (!cmd) { endOfStory(); return; }
        const r = await exec(cmd);
        if (my !== runId) return;
        if (r === BLOCK) return;
        if (r !== JUMPED) S.index++;
      }
      throw new Error('명령이 너무 많이 연속 실행되었어요 (무한 반복 확인)');
    } catch (e) {
      console.error(e);
      toast(`⚠ ${esc(e.message)}`, '#ff8a80');
    } finally {
      if (my === runId) running = false;
    }
  }

  async function exec(c) {
    switch (c.type) {
      case 'say': return execSay(c);
      case 'show': {
        if (!CHARS[c.who]) { console.warn('[VN] 알 수 없는 캐릭터', c.who); return; }
        S.stage[c.who] = { pos: c.pos, face: c.face || 'normal', look: c.look || 'auto' };
        renderStage(skipping(), { [c.who]: c.from });
        return;
      }
      case 'hide': delete S.stage[c.who]; renderStage(skipping()); return;
      case 'hideAll': S.stage = {}; renderStage(skipping()); return;
      case 'move': if (S.stage[c.who]) { S.stage[c.who].pos = c.pos; renderStage(skipping()); } return;
      case 'face': if (S.stage[c.who]) { S.stage[c.who].face = c.face; renderStage(skipping()); } return;
      case 'look': if (S.stage[c.who]) { S.stage[c.who].look = c.dir; renderStage(skipping()); } return;
      case 'bg': await changeBg(c.id, c.fade, c); return;
      case 'place': showPlace(evalFn(c.where), evalFn(c.when)); return;
      case 'chapter': return showCard(c);
      case 'choice': return showChoice(c);
      case 'if': {
        const target = evalFn(c.cond) ? c.t : c.e;
        if (!target) return;
        S.stack.push({ label: S.label, index: S.index + 1 });
        S.label = target; S.index = 0;
        return JUMPED;
      }
      case 'aff': applyAff(c.o); return;
      case 'set': Object.assign(S.flags, clone(c.o)); return;
      case 'jump': S.stack = []; S.label = c.to; S.index = 0; return JUMPED;
      case 'wait': if (!skipping()) await sleep(c.ms); return;
      case 'fx': doFx(c.name, c.who); return;
      case 'call': c.fn(S, api); return;
      case 'bgm': S.bgm = c.id || null; SND.bgm(S.bgm); return;
      case 'sfx': if (!skipping()) sfx(c.name); return;
      case 'endcard': return showEndcard(c);
      default: console.warn('[VN] 알 수 없는 명령', c); return;
    }
  }

  function endOfStory() {
    stopAll();
    showScreen('title');
  }

  /* ===========================================================
   *  6. 대사창 & 타이핑
   * =========================================================== */
  function execSay(c) {
    const text = String(evalFn(c.text) ?? '');
    const who = c.who || null;
    const ch = who ? CHARS[who] : null;
    if (who && c.face && S.stage[who]) S.stage[who].face = c.face;
    S.speaker = c.msg ? null : who;
    renderStage(skipping());
    if (c.hop && who && !skipping()) { hop(who); sfx('hop'); }
    if (!skipping()) { if (c.sfx) sfx(c.sfx); else if (c.msg) sfx('msg'); }

    const tb = $('#textbox');
    const name = c.as || (ch ? ch.name : who || '');
    tb.classList.toggle('narr', !who);
    tb.classList.toggle('whisper', !!c.whisper);
    tb.classList.toggle('msg', !!c.msg);
    tb.style.setProperty('--c', ch ? ch.color : '#e9a8a2');
    $('#nameplate span').textContent = name;

    S.line = text;
    if (suppressLogOnce) suppressLogOnce = false;
    else S.log.push({ name: who ? name : '', color: ch ? ch.color : '', text, whisper: !!c.whisper });
    if (S.log.length > 400) S.log.splice(0, S.log.length - 400);

    waiting = 'say';
    startTyping(text);
    return BLOCK;
  }

  function startTyping(text) {
    cancelTyping();
    $('#next').classList.remove('on');
    const shown = $('#text .shown'), rest = $('#text .rest');
    const speed = skipping() ? 0 : settings.textSpeed;
    if (!speed) { shown.textContent = text; rest.textContent = ''; onTyped(); return; }
    shown.textContent = ''; rest.textContent = text;
    const t0 = performance.now();
    let n0 = -1;
    typing = { text, raf: 0 };
    const tick = (now) => {
      if (!typing) return;
      const n = Math.min(text.length, Math.floor((now - t0) / speed) + 1);
      if (n !== n0) { n0 = n; shown.textContent = text.slice(0, n); rest.textContent = text.slice(n); }
      if (n >= text.length) { typing = null; onTyped(); }
      else typing.raf = requestAnimationFrame(tick);
    };
    typing.raf = requestAnimationFrame(tick);
  }

  function cancelTyping() {
    if (typing) cancelAnimationFrame(typing.raf);
    typing = null;
  }

  function finishTyping() {
    if (!typing) return;
    const t = typing.text;
    cancelTyping();
    $('#text .shown').textContent = t;
    $('#text .rest').textContent = '';
    onTyped();
  }

  function onTyped() {
    $('#next').classList.add('on');
    scheduleAuto();
  }

  function clearAuto() { clearTimeout(autoTimer); autoTimer = 0; }

  function scheduleAuto() {
    clearAuto();
    if (waiting !== 'say' || typing || modalOpen) return;
    const go = () => { if (waiting === 'say' && !typing && !modalOpen) next(); };
    if (skip) autoTimer = setTimeout(go, 45);
    else if (auto) autoTimer = setTimeout(go, settings.autoDelay + S.line.length * 38);
  }

  function next() {
    if (!skip && settings.nextSfx) sfx('next');
    clearAuto();
    $('#next').classList.remove('on');
    waiting = null;
    S.index++;
    run();
  }

  function advance() {
    if (modalOpen) return;
    if (uiHidden) { setHidden(false); return; }
    if (waiting === 'say') {
      if (typing) finishTyping(); else next();
    } else if (waiting === 'card') closeCard();
  }

  /* ===========================================================
   *  7. 캐릭터 렌더링
   * =========================================================== */
  const probeCache = {};
  function probe(url) {
    if (!probeCache[url]) {
      probeCache[url] = new Promise((res) => {
        const img = new Image();
        img.onload = () => res(true);
        img.onerror = () => res(false);
        img.src = url;
      });
    }
    return probeCache[url];
  }
  async function firstLoadable(list) {
    for (const u of list) if (await probe(u)) return u;
    return null;
  }

  const faceCache = {};
  function resolveFace(id, face) {
    const key = `${id}/${face}`;
    if (faceCache[key]) return faceCache[key];
    const c = CHARS[id];
    const dir = c.folder || `assets/characters/${id}`;
    const exts = CFG.imageFormats || ['png'];
    const list = exts.map((x) => `${dir}/${face}.${x}`);
    if (face !== 'normal') exts.forEach((x) => list.push(`${dir}/normal.${x}`));
    faceCache[key] = firstLoadable(list).then((u) => u || placeholderChar(id, face));
    return faceCache[key];
  }

  function placeholderChar(id, face) {
    const c = CHARS[id];
    const col = c.color || '#aaaaaa';
    const hair = (c.placeholder && c.placeholder.hair) || 'bob';
    const dir = c.folder || `assets/characters/${id}`;
    const hairPath = {
      long: 'M152 220 C150 120 200 88 250 88 C300 88 350 120 348 220 L362 470 C340 452 318 446 300 446 L300 300 L200 300 L200 446 C182 446 160 452 138 470 Z',
      straight: 'M156 215 C152 118 200 86 250 86 C300 86 348 118 344 215 L350 420 L306 412 L300 300 L200 300 L194 412 L150 420 Z',
      bob: 'M150 225 C146 120 198 86 250 86 C302 86 354 120 350 225 L352 318 L318 322 L310 270 L190 270 L182 322 L148 318 Z',
    }[hair];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1000" width="500" height="1000">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".92"/><stop offset=".75" stop-color="${col}" stop-opacity=".55"/><stop offset="1" stop-color="${col}" stop-opacity=".25"/></linearGradient>
<linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<path d="${hairPath}" fill="${col}" opacity=".55"/>
<path d="M70 1000 C70 640 100 455 178 410 C206 394 228 388 250 388 C272 388 294 394 322 410 C400 455 430 640 430 1000 Z" fill="url(#g)"/>
<path d="M218 310 L282 310 L290 396 L210 396 Z" fill="url(#g)"/>
<ellipse cx="250" cy="215" rx="88" ry="106" fill="url(#g)"/>
<ellipse cx="226" cy="178" rx="44" ry="56" fill="url(#h)"/>
<rect x="140" y="520" width="220" height="132" rx="22" fill="rgba(16,19,32,.55)"/>
<text x="250" y="576" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#fff">${esc(c.name)}</text>
<text x="250" y="626" text-anchor="middle" font-family="sans-serif" font-size="26" fill="rgba(255,255,255,.82)">${esc(FACE_LABEL[face] || face)} · ${esc(face)}</text>
<text x="250" y="972" text-anchor="middle" font-family="monospace" font-size="17" fill="rgba(255,255,255,.75)">${esc(dir)}/${esc(face)}.png</text>
</svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function posX(pos) {
    const p = POS[pos] || POS.center;
    return isMobile() ? (p.mx ?? p.x) : p.x;
  }

  function lookOf(id) {
    const e = S.stage[id];
    if (e.look && e.look !== 'auto') return e.look;
    const others = Object.keys(S.stage).filter((k) => k !== id && CHARS[k] && !CHARS[k].noSprite);
    if (!others.length) return 'front';
    const me = posX(e.pos);
    const avg = others.reduce((a, k) => a + posX(S.stage[k].pos), 0) / others.length;
    if (Math.abs(avg - me) < 1) return 'front';
    return avg > me ? 'right' : 'left';
  }

  function layoutFor(id, e) {
    const c = CHARS[id];
    const base = { scale: c.scale ?? 1, offsetX: c.offsetX ?? 0, offsetY: c.offsetY ?? 0 };
    const m = isMobile() ? (c.mobile || {}) : {};
    const f = (c.faceAdjust && c.faceAdjust[e.face]) || {};
    return { ...base, ...m, ...f };
  }

  function charEl(id) {
    return $(`#chars .char[data-id="${id}"]:not(.leave)`);
  }

  function createChar(id) {
    const el = document.createElement('div');
    el.className = 'char';
    el.dataset.id = id;
    el.innerHTML = '<div class="bob"><div class="inner"></div></div>';
    return el;
  }

  function applyLayout(el, id, e) {
    const c = CHARS[id];
    const L = layoutFor(id, e);
    el.style.setProperty('--x', `${posX(e.pos) + L.offsetX}%`);
    el.style.setProperty('--h', `calc(var(--char-base) * ${L.scale})`);
    el.style.setProperty('--by', `calc(var(--char-base) * ${L.scale * -L.offsetY / 100})`);
    const dir = lookOf(id);
    const canFlip = c.allowFlip !== false && c.lookDir && c.lookDir !== 'front';
    const flip = canFlip && dir !== 'front' && dir !== c.lookDir ? -1 : 1;
    const lean = c.lean ?? 10;
    const inner = $('.inner', el);
    inner.style.setProperty('--flip', flip);
    inner.style.setProperty('--lean', `${dir === 'right' ? lean : dir === 'left' ? -lean : 0}px`);
  }

  async function setFace(el, id, face, instant) {
    const url = await resolveFace(id, face);
    if (!el.isConnected || el.dataset.src === url) return;
    el.dataset.src = url;
    const inner = $('.inner', el);
    const olds = $$('.face', inner);
    const img = document.createElement('img');
    img.className = 'face';
    img.alt = '';
    img.draggable = false;
    img.src = url;
    if (instant || !olds.length) {
      olds.forEach((o) => o.remove());
      inner.appendChild(img);
      return;
    }
    img.classList.add('incoming');
    inner.appendChild(img);
    try { await img.decode(); } catch { /* ignore */ }
    if (el.dataset.src !== url) { img.remove(); return; }
    requestAnimationFrame(() => img.classList.add('in'));
    setTimeout(() => {
      if (el.dataset.src !== url) return;
      olds.forEach((o) => o.remove());
      img.classList.remove('incoming', 'in');
    }, 300);
  }

  function renderStage(instant, enter = {}) {
    const layer = $('#chars');
    if (instant) layer.classList.add('instant');

    $$('.char', layer).forEach((el) => {
      if (!S.stage[el.dataset.id] && !el.classList.contains('leave')) {
        el.classList.add('leave');
        setTimeout(() => el.remove(), instant ? 0 : 560);
      }
    });

    Object.keys(S.stage).forEach((id) => {
      const c = CHARS[id];
      if (!c || c.noSprite) return;
      const e = S.stage[id];
      let el = charEl(id);
      const isNew = !el;
      if (isNew) {
        el = createChar(id);
        layer.appendChild(el);
        if (!instant) {
          const from = enter[id];
          el.style.setProperty('--ex', from === 'left' ? '-9vw' : from === 'right' ? '9vw' : '0px');
          el.style.setProperty('--ey', from ? '0px' : '16px');
          el.classList.add('enter');
        }
      }
      applyLayout(el, id, e);
      setFace(el, id, e.face, instant || isNew);
      const speaking = S.speaker === id;
      el.classList.toggle('speaking', speaking);
      el.classList.toggle('dim', !!S.speaker && !speaking);
      if (isNew && !instant) {
        void el.offsetWidth;
        requestAnimationFrame(() => {
          el.classList.remove('enter');
          el.style.setProperty('--ex', '0px');
          el.style.setProperty('--ey', '0px');
        });
      }
    });

    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.remove('instant')));
  }

  function hop(id) {
    const el = charEl(id);
    if (!el) return;
    const b = $('.bob', el);
    b.classList.remove('hop');
    void b.offsetWidth;
    b.classList.add('hop');
  }

  function doFx(name, who) {
    if (skipping()) return;
    if (name === 'hop') return hop(who);
    if (name === 'shake') {
      const st = $('#stage');
      st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
    }
    if (name === 'flash') {
      const f = $('#flash');
      f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    }
  }

  /* ===========================================================
   *  8. 배경
   * =========================================================== */
  const bgCache = {};
  const bgResolved = {};
  function resolveBg(id) {
    if (bgCache[id]) return bgCache[id];
    const b = BGS[id] || {};
    const base = b.src ? b.src.replace(/\.[a-z0-9]+$/i, '') : `assets/bg/${id}`;
    const list = b.src ? [b.src] : [];
    (CFG.bgFormats || ['jpg']).forEach((x) => list.push(`${base}.${x}`));
    bgCache[id] = firstLoadable(list).then((u) => (bgResolved[id] = u || null));
    return bgCache[id];
  }

  function bgPlaceholderCss(id) {
    const b = BGS[id] || { ph: ['#333', '#111'] };
    const [a, z] = b.ph || ['#333', '#111'];
    return `radial-gradient(120% 80% at 80% 10%, rgba(255,255,255,.28), transparent 60%),
      radial-gradient(90% 60% at 10% 90%, rgba(255,255,255,.12), transparent 60%),
      linear-gradient(165deg, ${a}, ${z})`;
  }

  let bgFront = 'A';
  async function paintBg(id, instant) {
    const url = id ? await resolveBg(id) : null;
    const back = $(`#bg${bgFront === 'A' ? 'B' : 'A'}`);
    const front = $(`#bg${bgFront}`);
    const b = BGS[id] || {};
    back.style.backgroundImage = url ? `url("${url}")` : bgPlaceholderCss(id);
    back.style.backgroundPosition = b.focus || '50% 50%';
    $('.bg-label', back).innerHTML = url || !id ? '' :
      `<b>${esc(b.name || id)}</b><span>assets/bg/${esc(id)}.jpg</span>`;
    if (instant) { back.classList.add('instant'); front.classList.add('instant'); }
    back.classList.add('show');
    front.classList.remove('show');
    bgFront = bgFront === 'A' ? 'B' : 'A';
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => {
      back.classList.remove('instant'); front.classList.remove('instant');
    }));
  }

  async function changeBg(id, fade, opts = {}) {
    S.bg = id;
    const fast = skipping();
    if (fade === 'black' && !fast) {
      sfx('scene');
      const f = $('#fade');
      f.classList.add('on');
      await sleep(480);
      if (!opts.keep) { S.stage = {}; S.speaker = null; renderStage(true); }
      await paintBg(id, true);
      await sleep(120);
      f.classList.remove('on');
      await sleep(260);
    } else {
      if (fade === 'black' && !opts.keep) { S.stage = {}; S.speaker = null; renderStage(true); }
      await paintBg(id, fast || fade === 'none');
    }
  }

  /* ===========================================================
   *  9. 연출: 장소 표시, 챕터 카드, 선택지, 엔드카드, 토스트
   * =========================================================== */
  function showPlace(where, when) {
    const el = $('#place');
    $('b', el).textContent = where || '';
    $('span', el).textContent = when || '';
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
    clearTimeout(placeTimer);
    placeTimer = setTimeout(() => el.classList.remove('on'), skipping() ? 900 : 3800);
  }

  function showCard(c) {
    S.chapter = [c.kicker, c.title].filter(Boolean).join(' · ');
    const card = $('#card');
    $('.card-kicker', card).textContent = c.kicker || '';
    $('.card-title', card).textContent = c.title || '';
    $('.card-sub', card).textContent = c.sub || '';
    card.classList.add('on');
    if (!skip) sfx('card');
    waiting = 'card';
    suppressLogOnce = false;
    autosave();
    clearTimeout(cardTimer);
    cardTimer = setTimeout(closeCard, skip ? 300 : 3200);
    return BLOCK;
  }

  function closeCard() {
    if (waiting !== 'card') return;
    clearTimeout(cardTimer);
    $('#card').classList.remove('on');
    waiting = null;
    S.index++;
    run();
  }

  function showChoice(c) {
    setSkip(false);
    clearAuto();
    suppressLogOnce = false;
    const box = $('#choices');
    const list = $('.choice-list', box);
    $('.choice-prompt', box).textContent = c.prompt ? String(evalFn(c.prompt)) : '';
    list.innerHTML = '';
    const opts = c.choice.filter((o) => !o.if || evalFn(o.if));
    opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.style.animationDelay = `${120 + i * 80}ms`;
      const label = String(evalFn(o.text));
      b.innerHTML = `<em>${String(i + 1).padStart(2, '0')}</em><span>${esc(label)}</span>`;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); pick(o, label); });
      b.addEventListener('mouseenter', () => { if (matchMedia('(hover: hover)').matches) sfx('hover'); });
      list.appendChild(b);
    });
    box.classList.add('on');
    sfx('choice');
    waiting = 'choice';
    autosave();
    return BLOCK;
  }

  function pick(o, label) {
    if (waiting !== 'choice') return;
    $('#choices').classList.remove('on');
    sfx('select');
    waiting = null;
    S.log.push({ choice: true, text: label });
    if (o.aff) applyAff(o.aff);
    if (o.set) Object.assign(S.flags, clone(o.set));
    if (o.sub) {
      S.stack.push({ label: S.label, index: S.index + 1 });
      S.label = o.sub; S.index = 0;
    } else if (o.jump) {
      S.stack = []; S.label = o.jump; S.index = 0;
    } else S.index++;
    run();
  }

  function pickByNumber(n) {
    if (waiting !== 'choice' || modalOpen) return;
    const b = $$('#choices .choice')[n - 1];
    if (b) b.click();
  }

  function applyAff(o) {
    Object.entries(o).forEach(([id, v]) => {
      if (!(id in S.aff)) S.aff[id] = 0;
      S.aff[id] = Math.max(0, Math.min(100, S.aff[id] + v));
      if (v > 0 && !skipping()) setTimeout(() => sfx('aff'), 350);
      if (settings.affToast && v && !skipping()) {
        const c = CHARS[id];
        toast(`<i>♥</i>${esc(c ? c.name : id)} <small>${v > 0 ? '마음이 조금 움직였다' : '마음이 살짝 식었다'}</small>`, c && c.color);
      }
    });
  }

  function stageLabel(c, v) {
    let label = '';
    (c.stages || []).forEach(([min, l]) => { if (v >= min) label = l; });
    return label;
  }

  function statsHtml() {
    return Object.entries(CHARS).filter(([, c]) => c.heroine).map(([id, c]) => {
      const v = S.aff[id] ?? 0;
      return `<div class="stat" style="--c:${c.color}">
        <div class="stat-top"><b>${esc(c.fullName || c.name)}</b><span>${esc(stageLabel(c, v))}</span></div>
        <div class="bar"><i style="width:${Math.max(2, v)}%"></i></div>
        <small>${esc(c.role || '')}</small></div>`;
    }).join('');
  }

  function showEndcard(c) {
    setSkip(false);
    setAuto(false);
    const el = $('#endcard');
    $('.ec-kicker', el).textContent = evalFn(c.kicker) || '';
    $('.ec-title', el).textContent = evalFn(c.title) || '';
    $('.ec-text', el).textContent = evalFn(c.text) || '';
    $('.ec-stats', el).innerHTML = statsHtml();
    $('.ec-next', el).textContent = evalFn(c.next) || '';
    el.classList.add('on');
    waiting = 'end';
    if (c.id) {
      const sys = store.get('system') || { cleared: {} };
      sys.cleared[c.id] = Date.now();
      store.set('system', sys);
    }
    return BLOCK;
  }

  function toast(html, color) {
    const t = document.createElement('div');
    t.className = 'toast';
    if (color) t.style.setProperty('--c', color);
    t.innerHTML = html;
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2300);
    setTimeout(() => t.remove(), 2900);
  }

  /* ===========================================================
   *  10. AUTO / SKIP / HIDE
   * =========================================================== */
  function setAuto(on) {
    auto = on;
    if (on) skip = false;
    syncQuick();
    if (on && waiting === 'say' && !typing) scheduleAuto();
    if (!on && !skip) clearAuto();
  }

  function setSkip(on) {
    skip = on;
    if (on) auto = false;
    syncQuick();
    $('#game').classList.toggle('skipping', on);
    if (!on) { clearAuto(); return; }
    if (waiting === 'say') { if (typing) finishTyping(); else scheduleAuto(); }
    else if (waiting === 'card') closeCard();
  }

  function syncQuick() {
    $('[data-q="auto"]').classList.toggle('active', auto);
    $('[data-q="skip"]').classList.toggle('active', skip);
  }

  function setHidden(on) {
    uiHidden = on;
    $('#game').classList.toggle('ui-hidden', on);
  }

  /* ===========================================================
   *  11. 세이브 / 로드
   * =========================================================== */
  function snapshot() {
    return {
      v: 1, t: Date.now(),
      label: S.label, index: S.index, stack: clone(S.stack),
      aff: clone(S.aff), flags: clone(S.flags),
      bg: S.bg, bgm: S.bgm, stage: clone(S.stage), speaker: S.speaker,
      chapter: S.chapter, line: S.line, log: S.log.slice(-200),
    };
  }

  const canSave = () => waiting === 'say' || waiting === 'choice';

  function saveTo(slot) {
    if (!canSave()) { toast('지금은 저장할 수 없어요'); return false; }
    const ok = store.set(`slot:${slot}`, snapshot());
    if (ok) sfx('save');
    if (ok) toast(`<i>✓</i>${slot === 'auto' ? '자동' : slot + '번'} 슬롯에 저장했어요`);
    return ok;
  }

  function autosave() { store.set('slot:auto', snapshot()); }

  const slotKeys = () => ['auto', ...Array.from({ length: CFG.saveSlots || 9 }, (_, i) => String(i + 1))];
  const readSlot = (k) => store.get(`slot:${k}`);

  function latestSave() {
    let best = null;
    slotKeys().forEach((k) => {
      const d = readSlot(k);
      if (d && LABELS[d.label] && (!best || d.t > best.t)) best = d;
    });
    return best;
  }

  function resetStageDom() {
    $('#chars').innerHTML = '';
    ['#choices', '#card', '#endcard'].forEach((s) => $(s).classList.remove('on'));
    $('#fade').classList.remove('on');
    $('#text .shown').textContent = '';
    $('#text .rest').textContent = '';
    $('#nameplate span').textContent = '';
    $('#textbox').className = 'narr';
    $('#next').classList.remove('on');
    setHidden(false);
  }

  function stopAll() {
    runId++;
    running = false;
    clearAuto();
    cancelTyping();
    clearTimeout(cardTimer);
    waiting = null;
    auto = false;
    skip = false;
    syncQuick();
    $('#game').classList.remove('skipping');
  }

  function startFrom(data) {
    if (!data || !LABELS[data.label]) { toast('이 세이브는 현재 버전의 스토리와 맞지 않아요'); return; }
    stopAll();
    closeModal(true);
    S = Object.assign(freshState(), clone(data));
    const base = freshState().aff;
    Object.keys(base).forEach((k) => { if (!(k in S.aff)) S.aff[k] = base[k]; });
    resetStageDom();
    showScreen('game');
    paintBg(S.bg, true);
    renderStage(true);
    SND.bgm(S.bgm || null);
    suppressLogOnce = true;
    run();
  }

  function newGame() {
    stopAll();
    closeModal(true);
    S = freshState();
    SND.bgm(null);
    resetStageDom();
    paintBg(null, true);
    showScreen('game');
    run();
  }

  /* ===========================================================
   *  12. 모달 (LOG / SAVE / LOAD / SETTINGS / MENU / STATUS)
   * =========================================================== */
  function openModal(title, build, cls = '') {
    const m = $('#modal');
    m.className = `modal on ${cls}`;
    $('header h3', m).textContent = title;
    const body = $('.modal-body', m);
    body.innerHTML = '';
    build(body);
    sfx('open');
    modalOpen = true;
    clearAuto();
  }

  function closeModal(silent) {
    const m = $('#modal');
    if (!m.classList.contains('on')) { modalOpen = false; return; }
    m.classList.remove('on');
    modalOpen = false;
    if (!silent) scheduleAuto();
  }

  function confirmBox(msg) {
    return new Promise((res) => {
      const c = $('#confirm');
      $('p', c).textContent = msg;
      c.classList.add('on');
      const done = (v) => {
        c.classList.remove('on');
        $('.yes', c).onclick = $('.no', c).onclick = null;
        res(v);
      };
      $('.yes', c).onclick = () => done(true);
      $('.no', c).onclick = () => done(false);
    });
  }

  function openLog() {
    openModal('LOG', (body) => {
      if (!S.log.length) { body.innerHTML = '<p class="empty-msg">아직 기록이 없어요</p>'; return; }
      body.innerHTML = S.log.map((l) => l.choice
        ? `<div class="log-choice">▸ ${esc(l.text)}</div>`
        : `<div class="log-line${l.name ? '' : ' narr'}${l.whisper ? ' whisper' : ''}" style="--c:${l.color || 'transparent'}">
            ${l.name ? `<b>${esc(l.name)}</b>` : ''}<p>${esc(l.text)}</p></div>`).join('');
      requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
    }, 'log');
  }

  function fmtDate(t) {
    const d = new Date(t);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function openSlots(mode) {
    openModal(mode === 'save' ? 'SAVE' : 'LOAD', (body) => {
      const grid = document.createElement('div');
      grid.className = 'slots';
      slotKeys().forEach((k) => {
        if (mode === 'save' && k === 'auto') return;
        const d = readSlot(k);
        const b = document.createElement('button');
        b.className = 'slot' + (d ? '' : ' empty');
        const thumb = d && d.bg ? (bgResolved[d.bg] ? `url("${bgResolved[d.bg]}")` : bgPlaceholderCss(d.bg)) : 'none';
        b.innerHTML = `
          <div class="slot-thumb" style='background-image:${thumb}'><span>${k === 'auto' ? 'AUTO' : 'NO.' + k.padStart(2, '0')}</span></div>
          <div class="slot-info">${d
            ? `<b>${esc(d.chapter || '—')}</b><p>${esc((d.line || '').slice(0, 46))}${(d.line || '').length > 46 ? '…' : ''}</p><time>${fmtDate(d.t)}</time>`
            : '<p class="none">비어 있음</p>'}</div>`;
        b.addEventListener('click', async () => {
          if (mode === 'save') {
            if (d && !(await confirmBox(`${k}번 슬롯에 덮어쓸까요?`))) return;
            if (saveTo(k)) openSlots('save');
          } else if (d) {
            if ($('#game').classList.contains('active') && !(await confirmBox('이 세이브를 불러올까요?\n현재 진행 중인 내용은 사라져요.'))) return;
            startFrom(d);
          }
        });
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }, 'slots-modal');
  }

  function openSettings() {
    openModal('SETTINGS', (body) => {
      body.innerHTML = `
        <label class="set-row"><span>글자 속도</span>
          <input type="range" min="0" max="60" step="2" data-k="textSpeed">
          <em class="hint">느림 ↔ 즉시</em></label>
        <label class="set-row"><span>AUTO 대기 시간</span>
          <input type="range" min="400" max="3600" step="100" data-k="autoDelay">
          <em class="hint">짧게 ↔ 길게</em></label>
        <label class="set-row"><span>대사창 불투명도</span>
          <input type="range" min="0.35" max="1" step="0.05" data-k="boxAlpha">
          <em class="hint">투명 ↔ 불투명</em></label>
        <label class="set-row"><span>배경음악</span>
          <input type="range" min="0" max="1" step="0.05" data-k="bgmVol">
          <em class="hint">끔 ↔ 크게</em></label>
        <label class="set-row"><span>효과음</span>
          <input type="range" min="0" max="1" step="0.05" data-k="sfxVol">
          <em class="hint">끔 ↔ 크게</em></label>
        <label class="set-row toggle"><span>대사 넘김 소리</span>
          <input type="checkbox" data-k="nextSfx"><i></i></label>
        <label class="set-row toggle"><span>호감도 변화 알림</span>
          <input type="checkbox" data-k="affToast"><i></i></label>
        <p class="set-note">단축키 · Space/Enter 진행 · Ctrl 누르는 동안 SKIP · A 자동 · L 로그 · H 숨기기 · 1~3 선택지 · Esc 메뉴</p>`;
      const ts = $('[data-k="textSpeed"]', body);
      ts.value = 60 - settings.textSpeed;
      ts.oninput = () => { settings.textSpeed = 60 - Number(ts.value); applySettings(); };
      const ad = $('[data-k="autoDelay"]', body);
      ad.value = settings.autoDelay;
      ad.oninput = () => { settings.autoDelay = Number(ad.value); applySettings(); };
      const ba = $('[data-k="boxAlpha"]', body);
      ba.value = settings.boxAlpha;
      ba.oninput = () => { settings.boxAlpha = Number(ba.value); applySettings(); };
      const at = $('[data-k="affToast"]', body);
      at.checked = settings.affToast;
      at.onchange = () => { settings.affToast = at.checked; applySettings(); };
      const bv = $('[data-k="bgmVol"]', body);
      bv.value = settings.bgmVol;
      bv.oninput = () => { settings.bgmVol = Number(bv.value); applySettings(); };
      const sv = $('[data-k="sfxVol"]', body);
      sv.value = settings.sfxVol;
      sv.onchange = () => { settings.sfxVol = Number(sv.value); applySettings(); sfx('select'); };
      const ns = $('[data-k="nextSfx"]', body);
      ns.checked = settings.nextSfx;
      ns.onchange = () => { settings.nextSfx = ns.checked; applySettings(); };
    });
  }

  function openStatus() {
    openModal('STATUS', (body) => {
      body.innerHTML = `<p class="status-ch">${esc(S.chapter || '—')}</p><div class="stats">${statsHtml()}</div>`;
    });
  }

  function openMenu() {
    openModal('MENU', (body) => {
      body.innerHTML = `<div class="menu-grid">
        <button data-m="status"><b>STATUS</b><span>관계</span></button>
        <button data-m="save"><b>SAVE</b><span>저장</span></button>
        <button data-m="load"><b>LOAD</b><span>불러오기</span></button>
        <button data-m="log"><b>LOG</b><span>대사 기록</span></button>
        <button data-m="settings"><b>SETTINGS</b><span>설정</span></button>
        <button data-m="title"><b>TITLE</b><span>타이틀로</span></button></div>`;
      $$('[data-m]', body).forEach((b) => b.addEventListener('click', async () => {
        const m = b.dataset.m;
        if (m === 'status') openStatus();
        if (m === 'save') openSlots('save');
        if (m === 'load') openSlots('load');
        if (m === 'log') openLog();
        if (m === 'settings') openSettings();
        if (m === 'title' && (await confirmBox('타이틀로 돌아갈까요?\n저장하지 않은 진행은 사라져요.'))) {
          stopAll(); closeModal(true); showScreen('title');
        }
      }));
    });
  }

  /* ===========================================================
   *  13. 화면 전환 & 타이틀
   * =========================================================== */
  let tcTimer = 0;
  function showScreen(name) {
    $$('.screen').forEach((s) => s.classList.toggle('active', s.id === name));
    clearInterval(tcTimer);
    if (name === 'title') {
      SND.bgm('title');
      const ends = CFG.endings || [];
      const got = (store.get('system') || { cleared: {} }).cleared || {};
      const n = ends.filter((e) => got[e.id]).length;
      const hid = ends.filter((e) => e.hidden && got[e.id]).length;
      $('#endingCount').textContent = ends.length && n ? `ENDINGS ${n} / ${ends.length}` + (hid ? `  ·  HIDDEN ${hid}` : '') : '';
      $('#btnContinue').disabled = !latestSave();
      let f = 0;
      tcTimer = setInterval(() => {
        f++;
        const p = (n) => String(n).padStart(2, '0');
        const fr = f % 24, s = Math.floor(f / 24);
        $('#timecode').textContent = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}:${p(fr)}`;
      }, 1000 / 24);
    }
  }

  function buildPetals() {
    const wrap = $('.petals');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('i');
      const size = 6 + Math.random() * 10;
      p.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size * 0.72}px;` +
        `animation-duration:${9 + Math.random() * 10}s,${3 + Math.random() * 3}s;` +
        `animation-delay:${-Math.random() * 18}s,${-Math.random() * 3}s;opacity:${0.45 + Math.random() * 0.45}`;
      wrap.appendChild(p);
    }
  }

  /* ===========================================================
   *  14. 레이아웃 (반응형)
   * =========================================================== */
  function layout() {
    const w = window.innerWidth, h = window.innerHeight;
    const portrait = h > w;
    const m = portrait || w < 760;
    document.body.classList.toggle('m', m);
    document.body.classList.toggle('portrait', portrait);
    const L = CFG.layout || {};
    const base = portrait
      ? Math.min(h * (L.portraitHeight ?? 0.8), w * (L.portraitMaxWidthRatio ?? 1.9))
      : h * (L.landscapeHeight ?? 0.95);
    document.documentElement.style.setProperty('--char-base', `${Math.round(base)}px`);
    if (Object.keys(S.stage).length) renderStage(true);
  }

  /* ===========================================================
   *  15. 입력
   * =========================================================== */
  function bindInput() {
    // 브라우저 정책상 첫 터치/클릭 이후에만 소리가 날 수 있음
    const unlock = () => { SND.unlock(); const h = $('#soundHint'); if (h) h.classList.add('off'); };
    ['pointerdown', 'keydown', 'touchstart'].forEach((e) => window.addEventListener(e, unlock, { capture: true, passive: true }));
    $('.title-menu').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      SND.unlock();
      sfx('select');
      const act = b.dataset.act;
      if (act === 'new') newGame();
      if (act === 'continue') { const d = latestSave(); if (d) startFrom(d); }
      if (act === 'load') openSlots('load');
      if (act === 'settings') openSettings();
    });

    $('#game').addEventListener('click', (ev) => {
      if (ev.target.closest('#quick, #choices, #endcard')) return;
      advance();
    });

    $('#quick').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      ev.stopPropagation();
      const q = b.dataset.q;
      if (q === 'auto') setAuto(!auto);
      if (q === 'skip') setSkip(!skip);
      if (q === 'log') openLog();
      if (q === 'save') openSlots('save');
      if (q === 'load') openSlots('load');
      if (q === 'hide') setHidden(true);
      if (q === 'menu') openMenu();
    });

    $('#endcard .ec-btn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      stopAll();
      $('#endcard').classList.remove('on');
      showScreen('title');
    });

    $('#modal').addEventListener('click', (ev) => {
      if (ev.target.id === 'modal' || ev.target.closest('.x')) closeModal();
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if ($('#confirm').classList.contains('on')) return;
        if (modalOpen) closeModal();
        else if ($('#game').classList.contains('active')) openMenu();
        return;
      }
      if (!$('#game').classList.contains('active') || modalOpen) return;
      if (ev.key === 'Control' && !ev.repeat) { setSkip(true); return; }
      if (ev.repeat) return;
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
      else if (/^[1-9]$/.test(ev.key)) pickByNumber(Number(ev.key));
      else if (ev.key === 'a' || ev.key === 'A') setAuto(!auto);
      else if (ev.key === 'l' || ev.key === 'L') openLog();
      else if (ev.key === 'h' || ev.key === 'H') setHidden(!uiHidden);
    });
    window.addEventListener('keyup', (ev) => { if (ev.key === 'Control') setSkip(false); });
    window.addEventListener('blur', () => { if (skip) setSkip(false); });

    $('#stage').addEventListener('wheel', (ev) => {
      if (ev.deltaY < 0 && $('#game').classList.contains('active') && !modalOpen) openLog();
    }, { passive: true });

    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  }

  /* ===========================================================
   *  16. 부팅
   * =========================================================== */
  function validate() {
    if (!LABELS[CFG.startLabel]) console.error(`[VN] 시작 라벨 "${CFG.startLabel}"이 없어요`);
    Object.entries(LABELS).forEach(([name, list]) => list.forEach((c) => {
      const targets = [];
      if (c.type === 'jump') targets.push(c.to);
      if (c.type === 'choice') c.choice.forEach((o) => o.jump && targets.push(o.jump));
      targets.forEach((t) => { if (!LABELS[t]) console.error(`[VN] "${name}"에서 존재하지 않는 라벨 "${t}"로 이동합니다`); });
      if (c.type === 'show' && !CHARS[c.who]) console.error(`[VN] "${name}": 알 수 없는 캐릭터 "${c.who}"`);
      if (c.type === 'bg' && !BGS[c.id]) console.warn(`[VN] "${name}": config에 없는 배경 "${c.id}"`);
    }));
  }

  function preload() {
    Object.entries(CHARS).forEach(([id, c]) => {
      if (c.noSprite) return;
      (c.faces || ['normal']).forEach((f) => resolveFace(id, f));
    });
    Object.keys(BGS).forEach((id) => resolveBg(id));
  }

  async function titleImage() {
    if (!CFG.titleImage) return;
    const u = await firstLoadable((CFG.bgFormats || ['jpg']).map((x) => `${CFG.titleImage}.${x}`));
    if (u) $('.title-bg').style.backgroundImage = `url("${u}")`;
  }

  function boot() {
    document.title = CFG.title;
    const tv = document.getElementById('titleVersion');
    if (tv && CFG.version) tv.textContent = CFG.version;   // 타이틀 버전 = GAME_CONFIG.version
    applySettings();
    validate();
    layout();
    bindInput();
    buildPetals();
    showScreen('title');
    preload();
    titleImage();
  }

  const api = {
    dsl, label: defineLabel, boot,
    get state() { return S; },
    get labels() { return LABELS; },
    toast,
    /** 엔딩/루트 판정 등에 쓰는 도우미 */
    gain: (id) => (S.aff[id] ?? 0) - ((CHARS[id] && CHARS[id].startAffection) || 0),
  };
  window.VN = api;
})();

</script>

<script>/* ==== js/story/hidden.js ==== */
/* =============================================================
 *  HIDDEN ENDINGS — 한 인물에게 선택을 집중하면 열리는 엔딩
 *
 *  선택지마다 누구 쪽 선택인지 아래 LEAN 표에 적혀 있습니다.
 *  한 사람 쪽 선택지가 있는 곳은 각자 9번(10번 중 1번은 상대 전용).
 *
 *  열리는 조건 (routes.js 의 route_split 이 루트보다 먼저 검사)
 *   1) 마지막 선택(3-3)에서 그 사람을 골랐을 것
 *   2) 그 사람 쪽 선택 9번 중 7번 이상  → 한두 번은 다르게 골라도 됨
 *   3) 상대 쪽 선택은 1번 이하         → '대부분 집중'했을 때만
 *  선택지별 점수 배분이 다르므로 달성 가능성은 별도 테스트로 확인해야 합니다.
 * ============================================================= */
(() => {
  const { say, narr, show, move, hide, hideAll, bg, place, chapter, bgm, sfx, endcard, when } = VN.dsl;
  const Y = (f, t, o) => say('yujin', f, t, o);
  const J = (f, t, o) => say('jia', f, t, o);
  const SY = (f, t, o) => say('seoyeon', f, t, o);
  const M = (t, o) => say('minhyuk', null, t, o);
  const W = { whisper: true };

  /** 플래그 값 → 누구 쪽 선택인지 */
  const LEAN = {
    q:       { ask: 'seoyeon', caught: 'jia' },
    why:     { serious: 'jia' },
    film:    { jia: 'jia', dawn: 'seoyeon', advice: 'seoyeon' },
    sat:     { seoyeon: 'seoyeon', jia: 'jia' },
    letter:  { skip: 'jia', give: 'seoyeon' },
    night:   { help: 'seoyeon', leave: 'jia' },
    walk:    { jia: 'jia', seoyeon: 'seoyeon' },
    comfort: { stay: 'seoyeon' },
    feel:    { senior: 'jia', jealous: 'jia', curious: 'seoyeon' },
    last:    { jia: 'jia', seoyeon: 'seoyeon' },
  };
  const NEED = { jia: 7, seoyeon: 7 };   // 9번 중 이만큼은 그 사람 쪽
  const RIVAL_MAX = 1;                    // 상대 쪽 선택은 이 횟수까지만

  function leanCount(s, who) {
    return Object.entries(LEAN).filter(([k, m]) => m[s.flags[k]] === who).length;
  }
  function qualifies(s, who) {
    const other = who === 'jia' ? 'seoyeon' : 'jia';
    return s.flags.last === who
      && leanCount(s, who) >= NEED[who]
      && leanCount(s, other) <= RIVAL_MAX;
  }
  VN.hiddenOf = (s) => {
    if (qualifies(s, 'jia')) return 'jia';
    if (qualifies(s, 'seoyeon')) return 'seoyeon';
    return null;
  };
  VN.leanCount = leanCount;

  /* ---------------- 나은 히든 : 커피 줄 ---------------- */
  VN.label('hidden_jia', [
    chapter('HIDDEN', '커피 줄', ''),
    bgm('heart'),
    bg('campus_gate', 'black'),

<script>/* ==== js/story/routes.js ==== */
/* =============================================================
 *  ROUTES — 공통 루트(프롤로그~3장) 이후 개별 루트 분기
 *
 *  3장 마지막 선택(flags.last)과 호감도 상승량으로 결정합니다.
 *  - 나은 옆에 남음  + 나은 호감도 상승 15 이상  → 나은 루트
 *  - 무대로 뛰어감   + 채연 호감도 상승 15 이상  → 채연 루트
 *  - 5분만 기다려    → 둘 중 더 높은 쪽(5 이상 차이 + 15 이상)
 *  - 그 외           → 노멀 엔딩
 *
 *  새 루트 챕터를 쓰면 아래 'jia_route' / 'seoyeon_route' 안의
 *  endcard 를 jump('jia_ch4') 처럼 바꿔서 이어 가면 됩니다.
 * ============================================================= */
(() => {
  const { say, narr, show, move, hideAll, bg, place, when, jump, endcard, bgm } = VN.dsl;
  const MSG_Y = { msg: true, as: '도연' };
  const J = (f, t, o) => say('jia', f, t, o);
  const SY = (f, t, o) => say('seoyeon', f, t, o);
  const Y = (f, t, o) => say('yujin', f, t, o);

  const RULE = { min: 15, margin: 5 };

  function routeOf(s) {
    const j = VN.gain('jia'), sy = VN.gain('seoyeon');
    const last = s.flags.last;
    if (last === 'jia' && j >= RULE.min) return 'jia';
    if (last === 'seoyeon' && sy >= RULE.min) return 'seoyeon';
    if (last === 'wait') {
      if (j >= RULE.min && j >= sy + RULE.margin) return 'jia';
      if (sy >= RULE.min && sy >= j + RULE.margin) return 'seoyeon';
    }
    return null;
  }
  VN.routeOf = routeOf;

  VN.label('route_split', [
    when((s) => VN.hiddenOf && VN.hiddenOf(s) === 'jia' && s.flags.last === 'jia', [jump('hidden_jia')]),
    when((s) => VN.hiddenOf && VN.hiddenOf(s) === 'seoyeon' && s.flags.last === 'seoyeon', [jump('hidden_seoyeon')]),
    when((s) => routeOf(s) === 'seoyeon', [jump('seoyeon_route')]),
    when((s) => routeOf(s) === 'jia', [jump('jia_route')]),
    jump('normal_end'),
  ]);

  /* ---------------- 나은 루트 (도입) ---------------- */
  VN.label('jia_route', [
    bgm('heart'),
    bg('jia_room', 'black'),
    place('그날 밤', '5월 16일 (토) · 오후 11:50'),
    show('jia', 'center', 'normal'),
    when((s) => s.flags.last === 'jia', [
      J('normal', '…말해 버렸다.'),
      J('shy', '8년 만에.'),
      J('normal', '대답은… 월요일에 듣기로 했는데.'),
      J('normal', '월요일 아침 커피는 두 잔이겠지. 늘 그랬던 것처럼.'),
      J('sad', '…근데 그날부터 그게, 늘 그랬던 거로 남을까.'),
    ], [
      J('normal', '다음에 하겠다고 했는데.'),
      J('smile', '…7분 만에 돌아왔네. 진짜로.'),
      J('normal', '두 군데 다 챙기는 애. 그래서 좋아하는 건데, 그래서 말을 못 하겠어.'),
    ]),
    narr('휴대폰이 짧게 울렸다.'),
    say('yujin', null, '월요일 아침 8시 50분에 정문', MSG_Y),
    say('yujin', null, '커피는 내가 살게. 너 뭐 마셔?', MSG_Y),
    J('surprised', '…'),
    J('smile', '8년 동안 한 번도 안 물어보더니.'),
    narr('나은은 답장을 세 번 지웠다가 썼다. 그리고 메모장을 열었다. 몇 년째 맨 위에 있던 한 줄 옆에, 처음으로 체크 표시가 생겼다.'),
    endcard({

    SY('normal', '…이 얼굴이면 붙었겠네.'),

    ]),
    when((s) => s.flags.comfort === 'stay', [
      narr('한동안 둘 다 말이 없었다. 부스에서 그랬던 것처럼, 그게 어색하지 않았다.'),
    ]),
    when((s) => s.flags.comfort === 'normal', [
      SY('normal', '오늘 웃는 거. 어땠어?'),
      Y('smile', '완전 통과요.'),
      SY('smile', '…알아. 부스에서 보고 있는 거 다 보였어.'),

    SY('normal', '다음 공채. 모니터링 해 줄 수 있어?'),
    Y('surprised', '제가요?'),

    SY('surprised', '…'),
    SY('normal', '…싫어요?'),
    Y('smile', '아뇨.'),
    SY('normal', '그럼 됐어.'),
    endcard({
      id: 'seoyeon_route_start', kicker: 'CHAEYEON ROUTE', title: '채연 루트',
      text: '늘 선을 긋던 선배가, 처음으로 먼저 옆에 앉았다.',
      next: '채연 루트 · 다음 업데이트에서 이어집니다',

    bgm('daily'),
    bg('campus_path', 'black'),
    place('6월', '종강'),
    show('yujin', 'center', 'normal'),
    Y('normal', '한 학기가 끝났다.'),

    Y('smile', '…그런데 뭔가, 놓친 것 같은 기분.'),
    endcard({
      id: 'normal_end', kicker: 'NORMAL END', title: '종강',
      text: '그렇게 1학기가 끝났다.',
      next: '다른 선택으로 다시 플레이해 보세요',
    }),
  ]);
})();
